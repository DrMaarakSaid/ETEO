<script>

    const firebaseConfig = {

    // LEVEL_ID PARA ESTE QUIZ
    // ============================================
    const LEVEL_ID = "code_deontologie_v1_debutant2_es";


    // ============================================
    // =========== 1. SISTEMA DE VOZ ==============
    // ============================================
    let speechSynthesisObj = null;
    let voiceReady = false;

    function initVoice() {
        if ('speechSynthesis' in window) {
            speechSynthesisObj = window.speechSynthesis;
            voiceReady = true;
            return true;
        }
        return false;
    }

    function speak(text, lang) {
        if (!voiceReady || !speechSynthesisObj) return;
        try {
            speechSynthesisObj.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            
            const voices = speechSynthesisObj.getVoices();
            let selectedVoice = voices.find(v => v.lang.startsWith('es') && v.localService === true);
            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.startsWith('es'));
            }
            if (selectedVoice) utterance.voice = selectedVoice;
            
            speechSynthesisObj.speak(utterance);
        } catch(e) {}
    }

    let voiceActivated = false;

    function activateVoice() {
        if (!voiceActivated) {
            initVoice();
            voiceActivated = true;
            const indicator = document.getElementById('voiceIndicator');
            if (indicator) {
                indicator.textContent = "🎙️ IA activada";
                indicator.style.background = "#4caf50";
                setTimeout(() => {
                    indicator.style.opacity = "0.5";
                }, 2000);
            }
        }
    }

    // ============================================
    // =========== 2. INFO USUARIO ===============
    // ============================================
    function getUserName() { return localStorage.getItem("eteo_userName") || ""; }
    function getUserCountry() { return localStorage.getItem("eteo_userCountry") || "MA"; }

    function saveUserInfo() {
        const name = document.getElementById("userName").value.trim();
        const select = document.getElementById("userCountry");
        const otherInput = document.getElementById("otherCountry");
        let country = select.value;
        
        if (otherInput.value.trim() !== "") {
            country = otherInput.value.trim();
        }
        
        localStorage.setItem("eteo_userName", name === "" ? "Anónimo" : name);
        localStorage.setItem("eteo_userCountry", country);
    }

    // ============================================
    // =========== UNLOCK LEVEL 3 (BETA DESACTIVADO) =
    // ============================================
    function unlockLevel3(percentage) {
        // ⚠️ VERSIÓN BETA : El siguiente nivel está bloqueado
        // Los usuarios podrán desbloquear los niveles superiores en la versión final (6 meses).
        return false; // Siempre false en BETA para niveles > Principiante 2
    }

    // ================================================================
    // 🔥 GUARDAR VALIDACIÓN PARA PROGRESO.HTML (CORREGIDO)
    // ================================================================
    function guardarValidacion(especialidad, nivel, score, total) {
        const percentage = (score / total) * 100;
        
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: especialidad,
                niveau: nivel,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progresoData = JSON.parse(localStorage.getItem('eteo_progreso') || '{}');
            const key = especialidad + '_' + nivel;
            progresoData[key] = true;
            localStorage.setItem('eteo_progreso', JSON.stringify(progresoData));
            
            console.log('✅ Validación guardada para progreso.html');
        }
    }

        app.innerHTML = `

    // ============================================
    // =========== 3. ENVÍO SCORE FIREBASE =======
    // ============================================
    async function sendScoreToFirebase(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Anónimo";
        const userCountry = localStorage.getItem("eteo_userCountry") || "MA";
        
        const scoreData = {
            nom: userName,
            pays: userCountry,
            score: score,
            maxScore: maxScore,
            percentage: percentage,
            levelId: LEVEL_ID,
            date: new Date().toISOString(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection('scores').add(scoreData);
            console.log("✅ Score enviado a Firebase !");
            return true;
        } catch (error) {
            console.error("❌ Error Firebase:", error);
            return false;
        }
    }

    // ============================================
    // =========== 4. PREGUNTAS (24) =============
    // ============================================
   const questions = [

    // ============================================
    // =========== CORRECCIÓN CRUCIAL ============
    // ============================================
    const MAX_SCORE = questions.length * 15; // 375 puntos
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("code_deontologie_v1_debutant2_es", JSON.stringify({ score: finalScore, maxScore, percentage, date: new Date().toISOString() }));
        return percentage;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    speak("¡Tiempo agotado! Pasando a la siguiente pregunta.", "es-ES");
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function speakCurrentQuestion() {
        const correctedText = `Pregunta ${currentQuestion + 1} : ${questions[currentQuestion].question}`;
        speak(correctedText, "es-ES");
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header"><h1>⚖️ Código de Deontología - Principiante 2</h1><p>Pregunta ${currentQuestion + 1}/${questions.length}</p></div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Explicación :</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                </div>
                <div class="timer">⏱️ Tiempo restante : <span id="timer">${timeLeft}</span> segundos</div>
                <div class="score">🏆 Puntuación actual : ${score}/${MAX_SCORE}</div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandonar</button>
                    <button class="nav-btn" onclick="nextQuestion()">Siguiente →</button>
                </div>
            </div>
        `;
        answerLocked = false;
        startTimer();
        speakCurrentQuestion();
    }

    function checkAnswer(selectedIndex) {
        if (answerLocked) return;

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        if (isCorrect) {
            score += pointsEarned;
            speak(`¡Respuesta correcta! +${pointsEarned} puntos. ${q.explanation}`, "es-ES");
        } else {
            speak(`Respuesta incorrecta. La respuesta correcta era : ${shuffledOptions[currentCorrectIndex]}. ${q.explanation}`, "es-ES");
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Respuesta correcta : ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        document.querySelector('.score').innerHTML = `🏆 Puntuación actual : ${score}/${MAX_SCORE}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
    }

    function nextQuestion() {
        if (!answerLocked) { speak("Por favor seleccione una respuesta.", "es-ES"); return; }
        currentQuestion++;
        timeLeft = 20;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    // ============================================
    // =========== POPUP CLASIFICACIÓN MODAL =====
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anónimo";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 No hay puntuaciones registradas para este nivel por el momento.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Su clasificación</div>
                        <div class="rank-number">${userRank}e posición</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} puntos (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Todavía no está en la clasificación de este nivel</div>
                        <div>¡Vuelva a hacer el quiz para aparecer!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 TOP 20 - Código de Deontología Principiante 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anónimo"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 No hay puntuaciones para este nivel</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Error Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ No se pudo cargar la clasificación.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Error desconocido'}</span></div>`;
        }
    }

    // ============================================
    // =========== endQuiz CORREGIDO ==============
    // ============================================
    function endQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        const percentage = (score / MAX_SCORE) * 100;
        saveScore(score, MAX_SCORE);
        
        // === VERSIÓN BETA : El siguiente nivel está bloqueado ===
        const isUnlocked = unlockLevel3(percentage); // Siempre false en BETA
        
        // 🔥 Guardar la validación para progreso.html - NOMBRE CORREGIDO
        guardarValidacion('Código_de_Deontología', 'principiante2', score, MAX_SCORE);
        
        sendScoreToFirebase(score, MAX_SCORE, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 ¡Quiz terminado!</h1>
                <div class="final-score">Puntuación : ${score}/${MAX_SCORE}</div>
                <div>Porcentaje : ${percentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">
                    ${percentage >= 60 ?
                        `<div class="unlock-badge">✅ ¡Nivel Principiante 2 validado! 🎊</div>
                         <div class="locked-badge">🔒 BETA : La continuación (Intermedio & Experto) llegará después de 6 meses de evaluación.</div>` :
                        `<div class="locked-badge">⚠️ Puntuación insuficiente (mínimo 60% requerido para validar el nivel)</div>`}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${percentage >= 60 ?
                        '📚 Ha validado los dos niveles Principiantes. ¡Gracias por su participación!' :
                        `💪 Le falta un ${(60 - percentage).toFixed(1)}% para validar el nivel. ¡Vuelva a intentarlo!`}
                </div>
                <div>
                    <button class="share-btn" onclick="shareScore()">📤 Compartir mi puntuación</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Dar mi opinión</button>
                    <button class="menu-btn" onclick="goToMenu()">🏠 Menú principal</button>
                    <button class="ranking-btn" onclick="openRankingModal()">🏆 Clasificación mundial</button>
                </div>
            </div>
        `;
        
        if (percentage >= 60) {
            speak(`¡Felicitaciones! Ha validado el nivel Principiante 2 con una puntuación de ${percentage.toFixed(1)}%. La continuación estará disponible en la versión final.`, "es-ES");
            
            setTimeout(function() {
                openBetaEvaluationPopup();
            }, 2000);
        } else {
            speak(`Su puntuación es de ${percentage.toFixed(1)}%. Debe alcanzar el 60% para validar el nivel.`, "es-ES");
        }
        
        setTimeout(() => {
            openRankingModal();
        }, 2500);
    }

    // ============================================
    // =========== BETA EVALUATION POPUP ==========
    // ============================================
    function openBetaEvaluationPopup() {
        if (document.getElementById('betaPopup')) return;
        const userName = localStorage.getItem("eteo_userName") || "Doctor";
        const modal = document.createElement('div');
        modal.id = 'betaPopup';
        modal.style.cssText = `position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; justify-content:center; align-items:center; z-index:10002; animation:fadeIn 0.3s ease;`;
        modal.innerHTML = `<div style="background:white; border-radius:30px; width:90%; max-width:500px; padding:35px 25px; text-align:center; animation:slideUp 0.3s ease;">
            <div style="font-size:4rem;">🎉🏆🎉</div>
            <h2 style="color:#667eea;">¡Felicitaciones ${userName}!</h2>
            <p>Ha validado los dos niveles Principiantes con éxito.</p>
            <div style="margin:25px 0;">
                <p style="font-weight:bold;">🌟 Evalúe la versión BETA 🌟</p>
                <div id="starRating" style="display:flex; justify-content:center; gap:12px; font-size:3rem; cursor:pointer;">
                    <span data-rating="1">☆</span><span data-rating="2">☆</span><span data-rating="3">☆</span><span data-rating="4">☆</span><span data-rating="5">☆</span>
                </div>
                <p id="ratingMessage" style="margin-top:10px; font-size:0.85rem; color:#888;"></p>
            </div>
            <div style="background:#f0f8ff; padding:15px; border-radius:20px;">
                <p style="color:#ff5722;">🚀 La continuación (Intermedio & Experto) llegará después de 6 meses de evaluación.</p>
            </div>
            <button onclick="closeBetaPopup()" style="background:#4caf50; color:white; border:none; padding:12px 30px; border-radius:50px; cursor:pointer; margin-top:15px;">Volver al menú</button>
        </div>`;
        document.body.appendChild(modal);
        const stars = modal.querySelectorAll('#starRating span');
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                sendBetaEvaluation(rating);
                stars.forEach((s, idx) => { s.innerHTML = idx < rating ? '★' : '☆'; s.style.color = idx < rating ? '#ffc107' : '#ccc'; });
                document.getElementById('ratingMessage').innerHTML = '✅ ¡Gracias por su evaluación!';
            });
        });
    }

    function closeBetaPopup() {
        var modal = document.getElementById('betaPopup');
        if (modal) modal.remove();
        goToMenu();
    }

    async function sendBetaEvaluation(rating) {
        const userName = localStorage.getItem("eteo_userName") || "Anónimo";
        const userCountry = localStorage.getItem("eteo_userCountry") || "MA";
        try {
            await db.collection('evaluations_beta').add({
                nom: userName, pays: userCountry, note: rating, langue: 'es',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("✅ ¡Evaluación BETA enviada!");
        } catch(error) { console.error("Error Beta:", error); }
    }

    // ============================================
    // =========== ABANDONO CORREGIDO =============
    // ============================================
    function abandonQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("code_deontologie_v1_debutant2_es", JSON.stringify({ score, maxScore: MAX_SCORE, percentage: partialPercentage, date: new Date().toISOString(), abandoned: true }));
        
        // 🔥 Guardar la validación incluso en caso de abandono - NOMBRE CORREGIDO
        guardarValidacion('Código_de_Deontología', 'principiante2', score, MAX_SCORE);
        
        sendScoreToFirebase(score, MAX_SCORE, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `<div class="result-container"><h1>❌ Quiz abandonado</h1><div class="final-score">Puntuación parcial : ${score}/${MAX_SCORE}</div><div>Porcentaje : ${partialPercentage.toFixed(1)}%</div><div style="margin:20px 0;">🏆 Esta puntuación ha sido registrada en la clasificación.</div><button class="menu-btn" onclick="goToMenu()">🏠 Volver al menú</button></div>`;
        speak(`Quiz abandonado. Puntuación parcial : ${score} sobre ${MAX_SCORE}.`, "es-ES");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE) * 100;
        const text = `🎓 ETEO - Código de Deontología\nMi puntuación en el nivel Principiante 2 : ${score}/${MAX_SCORE} (${percentage.toFixed(1)}%)\n¡Desafíame en ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Puntuación', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ ¡Puntuación copiada al portapapeles!");
            }).catch(() => {
                alert("📋 Para compartir, copie este texto :\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    // ============================================
    // =========== goToMenu CON TIMESTAMP ========
    // ============================================
    function goToMenu() { 
        window.location.href = "menu_es.html?t=" + Date.now(); 
    }

    function startQuiz() {
        saveUserInfo();
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
    }

    document.body.addEventListener('click', function firstClick() { 
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
