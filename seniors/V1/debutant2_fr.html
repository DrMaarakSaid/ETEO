<script>
    // ============================================

    const firebaseConfig = {

    // ============================================
    // LEVEL_ID POUR CE QUIZ

    const LEVEL_ID = "seniors_v1_debutant2_fr";

    // ============================================
    // =========== 1. SYSTÈME VOCAL ===============
    // ============================================
    let speechSynthesisObj = null;
    let voiceReady = false;

    function initVoice() {
        if ('speechSynthesis' in window) {
            speechSynthesisObj = window.speechSynthesis;
            voiceReady = true;
            return true;
        }
        return false;
    }

    function speak(text, lang) {
        if (!voiceReady || !speechSynthesisObj) return;
        try {
            speechSynthesisObj.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            speechSynthesisObj.speak(utterance);
        } catch(e) {}
    }

    function stopSpeaking() {
        if (voiceReady && speechSynthesisObj) {
            speechSynthesisObj.cancel();
        }
    }

    let voiceActivated = false;

    function activateVoice() {
        if (!voiceActivated) {
            initVoice();
            voiceActivated = true;
            const indicator = document.getElementById('voiceIndicator');
            if (indicator) {
                indicator.textContent = "🎙️ IA activée";
                indicator.style.background = "#daa520";
                indicator.style.color = "#2a4a6a";
                setTimeout(() => {
                    indicator.style.opacity = "0.5";
                }, 2000);
            }
        }
        return true;
    }

    // ============================================
    // =========== 2. INFOS UTILISATEUR ==========
    // ============================================
    function getUserName() { return localStorage.getItem("eteo_userName") || ""; }
    function getUserCountry() { return localStorage.getItem("eteo_userCountry") || "MA"; }

    function saveUserInfo() {
        const name = document.getElementById("userName").value.trim();
        const select = document.getElementById("userCountry");
        const otherInput = document.getElementById("otherCountry");
        let country = select.value;
        
        if (otherInput.value.trim() !== "") {
            country = otherInput.value.trim();
        }
        
        localStorage.setItem("eteo_userName", name === "" ? "Anonyme" : name);
        localStorage.setItem("eteo_userCountry", country);
    }

    // ============================================
    // =========== FONCTION DÉBLOCAGE =============
    // ============================================
    function unlockLevel3(percentage) {
        if (percentage >= 60) {
            localStorage.setItem("seniors_v1_intermediaire1_fr_unlocked", "true");
            return true;
        }
        return false;
    }

    // ================================================================
    // 🔥 SAUVEGARDER LA VALIDATION POUR PROGRESSION.HTML
    // ================================================================
    function sauvegarderValidation(specialite, niveau, score, total) {
        const percentage = (score / total) * 100;
        
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: specialite,
                niveau: niveau,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progression = JSON.parse(localStorage.getItem('eteo_progression')) || {};
            const key = specialite + '_' + niveau;
            progression[key] = true;
            localStorage.setItem('eteo_progression', JSON.stringify(progression));
            
            console.log('✅ Validation sauvegardée pour progression.html');
        }
    }

    // ============================================
    // =========== 3. POPUP SCÉNARIO =============
    // ============================================
    let scenarioPlaying = false;
    let scenarioStarted = false;

    function showScenarioPopup() {
        const modal = document.createElement('div');
        modal.id = 'scenarioModal';
        modal.innerHTML = `
            <div class="modal-content">
                <button class="modal-close" onclick="closeScenarioPopup()">✕</button>
                <div class="modal-icon">💔</div>
                <div class="modal-title">📖 L'absence imprévue</div>
                <div class="modal-text" id="scenarioText">
                    <span class="serious">🔴 Contexte :</span> Dr Ahmed (62 ans) est décédé brutalement. Il n'avait rien préparé. Sa femme Nadia, ses enfants Karim et Salma sont perdus.<br><br>
                    <span class="serious">🌸 Soutien :</span> Dr Sofia, l'amie d'Ahmed, les accompagne dans cette épreuve.<br><br>
                    <span class="serious">📋 Objectif :</span> Comprendre comment gérer un cabinet après le décès du dentiste, les aspects juridiques, et l'importance de préparer sa succession.
                </div>
                <div class="modal-status waiting" id="scenarioStatus">👆 Cliquez n'importe où pour écouter le scénario</div>
                <div class="modal-footer">
                    <button class="modal-btn" id="btnEcouterScenario">🔊 Réécouter</button>
                    <button class="modal-btn secondary" onclick="closeScenarioPopup()">✅ Compris, commençons !</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        
        // 🔥 DÉCLENCHER LA LECTURE AU PREMIER CLIC
        const startScenario = function() {
            if (scenarioStarted) return;
            scenarioStarted = true;
            
            activateVoice();
            
            const scenarioText = document.getElementById('scenarioText');
            if (scenarioText) {
                const text = scenarioText.textContent;
                const cleanText = text.replace(/[🔴🌸📋💔]/g, '').trim();
                speak(cleanText, 'fr-FR');
                const statusEl = document.getElementById('scenarioStatus');
                if (statusEl) {
                    statusEl.textContent = '🔊 Lecture en cours...';
                    statusEl.className = 'modal-status playing';
                }
                scenarioPlaying = true;
                
                setTimeout(() => {
                    const statusEl2 = document.getElementById('scenarioStatus');
                    if (statusEl2 && scenarioPlaying) {
                        statusEl2.textContent = '✅ Scénario lu. Prêt à commencer !';
                        statusEl2.className = 'modal-status';
                    }
                }, 30000);
            }
            
            document.removeEventListener('click', startScenario);
        };
        
        document.addEventListener('click', startScenario);
        
        document.getElementById('btnEcouterScenario').addEventListener('click', function() {
            stopSpeaking();
            const scenarioText = document.getElementById('scenarioText');
            if (scenarioText) {
                const text = scenarioText.textContent;
                const cleanText = text.replace(/[🔴🌸📋💔]/g, '').trim();
                speak(cleanText, 'fr-FR');
                const statusEl = document.getElementById('scenarioStatus');
                if (statusEl) {
                    statusEl.textContent = '🔊 Réécoute en cours...';
                    statusEl.className = 'modal-status playing';
                }
            }
        });
    }

    function closeScenarioPopup() {
        stopSpeaking();
        const modal = document.getElementById('scenarioModal');
        if (modal) {
            modal.remove();
        }
        scenarioPlaying = false;
        scenarioStarted = true;
    }

    const MAX_SCORE = questions.length * 15;
    let currentQuestion = 0;
    let score = 0;

    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("seniors_v1_debutant2_fr", JSON.stringify({ 
            score: finalScore, 
            maxScore: maxScore,
            percentage: percentage,
            date: new Date().toISOString() 
        }));
        return percentage;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    speak("Temps écoulé ! Passons à la question suivante.", "fr-FR");
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function speakCurrentQuestion() {
        speak(`Question ${currentQuestion + 1} : ${questions[currentQuestion].question}`, "fr-FR");
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header">
                <h1>👴 Seniors - Débutant Niveau 2</h1>
                <div class="subtitle">Question ${currentQuestion + 1}/${questions.length}</div>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Explication :</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                </div>
                <div class="timer">⏱️ Temps restant : <span id="timer">${timeLeft}</span> secondes</div>
                <div class="score">🏆 Score actuel : ${score}/${MAX_SCORE}</div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandonner</button>
                    <button class="nav-btn" onclick="nextQuestion()">Suivant →</button>

            </div>

        answerLocked = false;
        startTimer();
        setTimeout(() => speakCurrentQuestion(), 500);
    }

    function checkAnswer(selectedIndex) {
        if (answerLocked) return;

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        if (isCorrect) {
            score += pointsEarned;
            speak(`Bonne réponse ! +${pointsEarned} points.`, "fr-FR");
        } else {
            speak(`Mauvaise réponse. La bonne réponse était : ${shuffledOptions[currentCorrectIndex]}.`, "fr-FR");
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Bonne réponse : ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        document.querySelector('.score').innerHTML = `🏆 Score actuel : ${score}/${MAX_SCORE}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
    }

    function nextQuestion() {
        if (!answerLocked) { 
            speak("Veuillez sélectionner une réponse.", "fr-FR");

        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();

            <div class="beta-popup-content">
                <div class="big-icon">🎉🏆🎉</div>
                <h2>Félicitations ${userName} !</h2>
                <p>Vous avez validé les deux niveaux Débutants avec succès.</p>
                <div style="margin:25px 0;">
                    <p style="font-weight:bold;">🌟 Évaluez la version BETA 🌟</p>
                    <div class="stars" id="starRating">
                        <span data-rating="1">☆</span>
                        <span data-rating="2">☆</span>
                        <span data-rating="3">☆</span>
                        <span data-rating="4">☆</span>
                        <span data-rating="5">☆</span>
                    </div>
                    <div class="rating-message" id="ratingMessage"></div>
                </div>
                <div class="beta-info">
                    <p>🚀 La suite (Intermédiaire & Expert) arrivera après 6 mois d'évaluation.</p>
                </div>
                <button class="beta-btn" onclick="closeBetaPopup()">Retour au menu</button>
            </div>
        `;
        document.body.appendChild(popup);
        
        const stars = popup.querySelectorAll('#starRating span');
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                sendBetaEvaluation(rating);
                stars.forEach((s, idx) => { 
                    s.innerHTML = idx < rating ? '★' : '☆'; 
                    s.style.color = idx < rating ? '#ffc107' : '#ccc'; 
                });
                document.getElementById('ratingMessage').innerHTML = '✅ Merci pour votre évaluation !';
            });
        });
    }

    function closeBetaPopup() {
        const modal = document.getElementById('betaPopup');
        if (modal) modal.remove();
        goToMenu();
    }

    async function sendBetaEvaluation(rating) {
        const userName = localStorage.getItem("eteo_userName") || "Anonyme";
        const userCountry = localStorage.getItem("eteo_userCountry") || "MA";
        try {
            await db.collection('evaluations_beta').add({
                nom: userName,
                pays: userCountry,
                note: rating,
                langue: 'fr',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("✅ Évaluation BETA envoyée !");
        } catch(error) {
            console.error("Erreur Beta:", error);
        }
    }

    // ============================================
    // =========== RANKING MODAL ==================
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anonyme";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 Aucun score enregistré pour ce niveau pour le moment.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Votre classement</div>
                        <div class="rank-number">${userRank}e position</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} points (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Vous n'êtes pas encore dans le classement de ce niveau</div>
                        <div>Refaites le quiz pour apparaître !</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #daa520;">🏆 TOP 20 - Seniors Débutant 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(218,165,32,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anonyme"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 Aucun score pour ce niveau</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Erreur Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Impossible de charger le classement.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Erreur inconnue'}</span></div>`;
        }
    }

    function abandonQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("seniors_v1_debutant2_fr", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel3(partialPercentage);
        sauvegarderValidation('Seniors', 'debutant2', score, MAX_SCORE);
        sendScoreToFirebase(score, MAX_SCORE, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `<div class="result-container"><h1>❌ Quiz abandonné</h1><div class="final-score">Score partiel : ${score}/${MAX_SCORE}</div><div>Pourcentage : ${partialPercentage.toFixed(1)}%</div><div style="margin:20px 0;">🏆 Ce score a été enregistré dans le classement.</div><button class="menu-btn" onclick="goToMenu()">🏠 Retour au menu</button></div>`;
        speak(`Quiz abandonné. Score partiel : ${score} sur ${MAX_SCORE}.`, "fr-FR");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE) * 100;
        const text = `🎓 ETEO - Seniors\nMon score au niveau Débutant 2 : ${score}/${MAX_SCORE} (${percentage.toFixed(1)}%)\nDéfie-moi sur ETEO !`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Score', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Score copié dans le presse-papier !");
            }).catch(() => {
                alert("📋 Pour partager, copiez ce texte :\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        closeScenarioPopup();
        saveUserInfo();
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
    }

    // ============================================
    // =========== INITIALISATION ================
    // ============================================
    showWelcomeScreen();

    setTimeout(() => {
        showScenarioPopup();
    }, 800);

    document.body.addEventListener('click', function firstClick() {
        activateVoice();
        document.body.removeEventListener('click', firstClick);
    });
</script>
</body>
