<script>

    const firebaseConfig = {

    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================
    // LEVEL_ID ДЛЯ ЭТОЙ ВИКТОРИНЫ
    // ============================================
    const LEVEL_ID = "women_dentists_v1_debutant2_fr";

    // ============================================
    // =========== 1. ГОЛОСОВАЯ СИСТЕМА ==========
    // ============================================
    let speechSynthesisObj = null;
    let voiceReady = false;

    function initVoice() {
        if ('speechSynthesis' in window) {
            speechSynthesisObj = window.speechSynthesis;
            voiceReady = true;
            return true;
        }
        return false;
    }

    function speak(text, lang) {
        if (!voiceReady || !speechSynthesisObj) return;
        try {
            speechSynthesisObj.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            speechSynthesisObj.speak(utterance);
        } catch(e) {}
    }

    function stopSpeaking() {
        if (voiceReady && speechSynthesisObj) {
            speechSynthesisObj.cancel();
        }
    }

    let voiceActivated = false;

    function activateVoice() {
        if (!voiceActivated) {
            initVoice();
            voiceActivated = true;
            const indicator = document.getElementById('voiceIndicator');
            if (indicator) {
                indicator.textContent = "🎙️ ИИ активирован";
                indicator.style.background = "#ca8aaa";
                setTimeout(() => {
                    indicator.style.opacity = "0.5";
                }, 2000);
            }
        }
        return true;
    }

    // ============================================
    // =========== 2. ИНФОРМАЦИЯ О ПОЛЬЗОВАТЕЛЕ =
    // ============================================
    function getUserName() { return localStorage.getItem("eteo_userName") || ""; }
    function getUserCountry() { return localStorage.getItem("eteo_userCountry") || "MA"; }

    function saveUserInfo() {
        const name = document.getElementById("userName").value.trim();
        const select = document.getElementById("userCountry");
        const otherInput = document.getElementById("otherCountry");
        let country = select.value;
        
        if (otherInput.value.trim() !== "") {
            country = otherInput.value.trim();
        }
        
        localStorage.setItem("eteo_userName", name === "" ? "Аноним" : name);
        localStorage.setItem("eteo_userCountry", country);
    }

    // ============================================
    // =========== ФУНКЦИЯ РАЗБЛОКИРОВКИ ==========
    // ============================================
    function unlockLevel3(percentage) {
        if (percentage >= 60) {
            localStorage.setItem("women_dentists_v1_intermediaire1_fr_unlocked", "true");
            return true;
        }
        return false;
    }

    // ================================================================
    // 🔥 СОХРАНЕНИЕ ПРОВЕРКИ ДЛЯ PROGRESSION.HTML
    // ================================================================
    function sauvegarderValidation(specialite, niveau, score, total) {
        const percentage = (score / total) * 100;
        
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: specialite,
                niveau: niveau,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progression = JSON.parse(localStorage.getItem('eteo_progression')) || {};
            const key = specialite + '_' + niveau;
            progression[key] = true;
            localStorage.setItem('eteo_progression', JSON.stringify(progression));
            
            console.log('✅ Проверка сохранена для progression.html');
        }
    }

    // ============================================
    // =========== 3. ПОПАП СЦЕНАРИЯ =============
    // ============================================
    let scenarioPlaying = false;
    let scenarioStarted = false;

    function showScenarioPopup() {
        const modal = document.createElement('div');
        modal.id = 'scenarioModal';
        modal.innerHTML = `
            <div class="modal-content">
                <button class="modal-close" onclick="closeScenarioPopup()">✕</button>
                <div class="modal-icon">👩‍⚕️</div>
                <div class="modal-title">📖 Возвращение доктора Мерьем</div>
                <div class="modal-text" id="scenarioText">
                    <span class="serious">🔴 Контекст:</span> Др. Мерьем возвращается в свой кабинет после 14 недель декретного отпуска. Она обнаруживает, что ее заменяющий, др. Карим, внес изменения. Некоторые пациенты ушли, была нанята новая ассистентка.<br><br>
                    <span class="serious">🌸 Поддержка:</span> Др. София, ее наставница, сопровождает ее в этом сложном переходе.<br><br>
                    <span class="serious">📋 Цель:</span> Успешно вернуться, управлять изменениями, совмещать профессиональную и семейную жизнь и подготовить будущее своего кабинета.
                </div>
                <div class="modal-status waiting" id="scenarioStatus">👆 Нажмите в любом месте, чтобы прослушать сценарий</div>
                <div class="modal-footer">
                    <button class="modal-btn" id="btnEcouterScenario">🔊 Прослушать снова</button>
                    <button class="modal-btn secondary" onclick="closeScenarioPopup()">✅ Понял, начнем!</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        
        // 🔥 ЗАПУСТИТЬ ВОСПРОИЗВЕДЕНИЕ ПРИ ПЕРВОМ КЛИКЕ
        const startScenario = function() {
            if (scenarioStarted) return;
            scenarioStarted = true;
            
            activateVoice();
            
            const scenarioText = document.getElementById('scenarioText');
            if (scenarioText) {
                const text = scenarioText.textContent;
                const cleanText = text.replace(/[🔴🌸📋👩‍⚕️]/g, '').trim();
                speak(cleanText, 'ru-RU');
                const statusEl = document.getElementById('scenarioStatus');
                if (statusEl) {
                    statusEl.textContent = '🔊 Идет чтение...';
                    statusEl.className = 'modal-status playing';
                }
                scenarioPlaying = true;
                
                setTimeout(() => {
                    const statusEl2 = document.getElementById('scenarioStatus');
                    if (statusEl2 && scenarioPlaying) {
                        statusEl2.textContent = '✅ Сценарий прочитан. Готовы начать!';
                        statusEl2.className = 'modal-status';
                    }
                }, 25000);
            }
            
            document.removeEventListener('click', startScenario);
        };
        
        document.addEventListener('click', startScenario);
        
        document.getElementById('btnEcouterScenario').addEventListener('click', function() {
            stopSpeaking();
            const scenarioText = document.getElementById('scenarioText');
            if (scenarioText) {
                const text = scenarioText.textContent;
                const cleanText = text.replace(/[🔴🌸📋👩‍⚕️]/g, '').trim();
                speak(cleanText, 'ru-RU');
                const statusEl = document.getElementById('scenarioStatus');
                if (statusEl) {
                    statusEl.textContent = '🔊 Повторное чтение...';
                    statusEl.className = 'modal-status playing';
                }
            }
        });
    }

    function closeScenarioPopup() {
        stopSpeaking();
        const modal = document.getElementById('scenarioModal');
        if (modal) {
            modal.remove();

    async function sendScoreToFirebase(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        const userCountry = localStorage.getItem("eteo_userCountry") || "MA";
        
        const scoreData = {
            nom: userName,
            pays: userCountry,
            score: score,
            maxScore: maxScore,
            percentage: percentage,
            levelId: LEVEL_ID,
            date: new Date().toISOString(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection('scores').add(scoreData);
            console.log("✅ Баллы отправлены в Firebase!");
            return true;
        } catch (error) {
            console.error("❌ Ошибка Firebase:", error);
            return false;
        }
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("women_dentists_v1_debutant2_fr", JSON.stringify({ 
            score: finalScore, 
            maxScore: maxScore,
            percentage: percentage,
            date: new Date().toISOString() 
        }));
        return percentage;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    speak("Время вышло! Переходим к следующему вопросу.", "ru-RU");
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function speakCurrentQuestion() {
        speak(`Вопрос ${currentQuestion + 1} : ${questions[currentQuestion].question}`, "ru-RU");
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header">
                <h1>👩‍⚕️ Женщины-стоматологи - Начинающий Уровень 2</h1>
                <div class="subtitle">Вопрос ${currentQuestion + 1}/${questions.length}</div>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Объяснение:</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                </div>
                <div class="timer">⏱️ Осталось времени: <span id="timer">${timeLeft}</span> секунд</div>
                <div class="score">🏆 Текущий счет: ${score}/${MAX_SCORE}</div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Прервать</button>
                    <button class="nav-btn" onclick="nextQuestion()">Далее →</button>
                </div>
            </div>
        `;
        answerLocked = false;
        startTimer();
        setTimeout(() => speakCurrentQuestion(), 500);
    }

    function checkAnswer(selectedIndex) {
        if (answerLocked) return;

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        if (isCorrect) {
            score += pointsEarned;
            speak(`Правильный ответ! +${pointsEarned} баллов.`, "ru-RU");
        } else {
            speak(`Неправильный ответ. Правильный ответ был: ${shuffledOptions[currentCorrectIndex]}.`, "ru-RU");
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Правильный ответ: ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        document.querySelector('.score').innerHTML = `🏆 Текущий счет: ${score}/${MAX_SCORE}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
    }

    function nextQuestion() {
        if (!answerLocked) { 
            speak("Пожалуйста, выберите ответ.", "ru-RU"); 
            return; 
        }
        currentQuestion++;
        timeLeft = 30;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    function goToMenu() {
        window.location.href = "menu_ru.html";
    }

    function goToDashboard() {
        window.location.href = "../../../../classements_dashboard_ru.html";
    }

    // ============================================
    // =========== endQuiz ========================
    // ============================================
    function endQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        
        const percentage = (score / MAX_SCORE) * 100;
        saveScore(score, MAX_SCORE);
        
        const isUnlocked = unlockLevel3(percentage);
        sauvegarderValidation('Женщины-стоматологи', 'debutant2', score, MAX_SCORE);
        sendScoreToFirebase(score, MAX_SCORE, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 Викторина завершена!</h1>
                <div class="final-score">Результат: ${score}/${MAX_SCORE}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Процент: <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${isUnlocked ? 
                        '<div class="unlock-badge">✅ Уровень Средний 1 разблокирован! 🎊</div>' : 
                        '<div class="locked-badge">⚠️ Недостаточно баллов (требуется минимум 60% для открытия следующего уровня)</div>'}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${isUnlocked ? 
                        '📚 Перейдите в меню для доступа к уровню Средний 1.' : 
                        `💪 Вам не хватает ${(60 - percentage).toFixed(1)}% для открытия уровня Средний 1. Попробуйте снова!`}
                </div>
                <div>
                    <button class="share-btn" onclick="shareScore()">📤 Поделиться результатом</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Оставить отзыв</button>
                    <button class="menu-btn" onclick="goToMenu()">🏠 Главное меню</button>
                    <button class="ranking-btn" onclick="goToDashboard()">🏆 Мировой рейтинг</button>
                </div>
            </div>
        `;
        
        if (isUnlocked) {
            speak(`Поздравляем! Вы разблокировали уровень Средний 1 с результатом ${percentage.toFixed(1)}%.`, "ru-RU");
        } else {
            speak(`Ваш результат: ${percentage.toFixed(1)}%. Для разблокировки уровня Средний 1 необходимо достичь 60%.`, "ru-RU");
        }
        
        // 🆕 ПОПАП ОЦЕНКИ БЕТА
        if (percentage >= 60) {
            setTimeout(function() {
                openBetaEvaluationPopup();
            }, 2000);
        }
        
        setTimeout(() => {
            openRankingModal();
        }, 2500);
    }

    // ============================================
    // 🆕 ПОПАП ОЦЕНКИ БЕТА
    // ============================================
    function openBetaEvaluationPopup() {
        if (document.getElementById('betaPopup')) return;
        const userName = localStorage.getItem("eteo_userName") || "Доктор";
        
        const popup = document.createElement('div');
        popup.id = 'betaPopup';
        popup.className = 'beta-popup-overlay';
        popup.innerHTML = `
            <div class="beta-popup-content">
                <div class="big-icon">🎉🏆🎉</div>
                <h2>Поздравляем ${userName}!</h2>
                <p>Вы успешно подтвердили оба начальных уровня.</p>
                <div style="margin:25px 0;">
                    <p style="font-weight:bold;">🌟 Оцените БЕТА-ВЕРСИЮ 🌟</p>
                    <div class="stars" id="starRating">
                        <span data-rating="1">☆</span>
                        <span data-rating="2">☆</span>
                        <span data-rating="3">☆</span>
                        <span data-rating="4">☆</span>
                        <span data-rating="5">☆</span>
                    </div>
                    <div class="rating-message" id="ratingMessage"></div>
                </div>
                <div class="beta-info">
                    <p>🚀 Продолжение (Средний и Экспертный) появится после 6 месяцев оценки.</p>
                </div>
                <button class="beta-btn" onclick="closeBetaPopup()">Вернуться в меню</button>
            </div>
        `;
        document.body.appendChild(popup);
        
        const stars = popup.querySelectorAll('#starRating span');
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                sendBetaEvaluation(rating);
                stars.forEach((s, idx) => { 
                    s.innerHTML = idx < rating ? '★' : '☆'; 
                    s.style.color = idx < rating ? '#ffc107' : '#ccc'; 
                });
                document.getElementById('ratingMessage').innerHTML = '✅ Спасибо за вашу оценку!';
            });
        });
    }

    function closeBetaPopup() {
        const modal = document.getElementById('betaPopup');
        if (modal) modal.remove();
        goToMenu();
    }

    async function sendBetaEvaluation(rating) {
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        const userCountry = localStorage.getItem("eteo_userCountry") || "MA";
        try {
            await db.collection('evaluations_beta').add({
                nom: userName,
                pays: userCountry,
                note: rating,
                langue: 'ru',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("✅ Оценка БЕТА отправлена!");
        } catch(error) {
            console.error("Ошибка Beta:", error);
        }
    }

    // ============================================
    // =========== МОДАЛЬНОЕ ОКНО РЕЙТИНГА =======
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 Нет сохраненных результатов для этого уровня.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Ваше место</div>
                        <div class="rank-number">${userRank}-е место</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} баллов (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Вы еще не в рейтинге этого уровня</div>
                        <div>Пройдите викторину снова, чтобы появиться!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #ca8aaa;">🏆 ТОП-20 - Женщины-стоматологи Начинающий 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(202,138,170,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Аноним"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 Нет результатов для этого уровня</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Ошибка Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Невозможно загрузить рейтинг.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Неизвестная ошибка'}</span></div>`;
        }
    }

    function abandonQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("women_dentists_v1_debutant2_fr", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel3(partialPercentage);
        sauvegarderValidation('Женщины-стоматологи', 'debutant2', score, MAX_SCORE);
        sendScoreToFirebase(score, MAX_SCORE, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `<div class="result-container"><h1>❌ Викторина прервана</h1><div class="final-score">Частичный результат: ${score}/${MAX_SCORE}</div><div>Процент: ${partialPercentage.toFixed(1)}%</div><div style="margin:20px 0;">🏆 Этот результат сохранен в рейтинге.</div><button class="menu-btn" onclick="goToMenu()">🏠 Вернуться в меню</button></div>`;
        speak(`Викторина прервана. Частичный результат: ${score} из ${MAX_SCORE}.`, "ru-RU");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE) * 100;
        const text = `🎓 ETEO - Женщины-стоматологи\nМой результат на уровне Начинающий 2: ${score}/${MAX_SCORE} (${percentage.toFixed(1)}%)\nПроверь меня на ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'Результат ETEO', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Результат скопирован в буфер обмена!");
            }).catch(() => {
                alert("📋 Чтобы поделиться, скопируйте этот текст:\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        closeScenarioPopup();
        saveUserInfo();
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
    }

    // ============================================
    // =========== ИНИЦИАЛИЗАЦИЯ ==================
    // ============================================
    showWelcomeScreen();

    setTimeout(() => {
        showScenarioPopup();
    }, 800);

    document.body.addEventListener('click', function firstClick() {
        activateVoice();
        document.body.removeEventListener('click', firstClick);
    });
</script>
