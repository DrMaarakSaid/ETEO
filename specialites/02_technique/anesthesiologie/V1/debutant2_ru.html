    // ============================================

    let speechSynthesisObj = null;
    let voiceReady = false;

    function initVoice() {
        if ('speechSynthesis' in window) {
            speechSynthesisObj = window.speechSynthesis;
            voiceReady = true;
            return true;
        }
        return false;
    }

    function speak(text, lang) {
        if (!voiceReady || !speechSynthesisObj) return;
        try {
            speechSynthesisObj.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            speechSynthesisObj.speak(utterance);
        } catch(e) {}
    }

    let voiceActivated = false;

    function activateVoice() {
        if (!voiceActivated) {
            initVoice();
            voiceActivated = true;
            const indicator = document.getElementById('voiceIndicator');
            if (indicator) {
                indicator.textContent = "🎙️ ИИ активирован";
                indicator.style.background = "#4caf50";
                setTimeout(() => {
                    indicator.style.opacity = "0.5";
                }, 2000);
            }
        }
    }

    // ============================================

    async function sendScoreToFirebase(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        
        const scoreData = {
            nom: userName,
            pays: userCountry,
            score: score,
            maxScore: maxScore,
            percentage: percentage,
            levelId: LEVEL_ID,
            date: new Date().toISOString(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection('scores').add(scoreData);
            console.log("✅ Результат отправлен в Firebase!");
            return true;
        } catch (error) {
            console.error("❌ Ошибка Firebase:", error);
            return false;
        }
    }

    const MAX_SCORE_BASE = questions.length * 10;
    const MAX_SCORE_WITH_BONUS = questions.length * 15;
    
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;

    let answerLocked = false;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("anesthesiologie_v1_debutant2_fr", JSON.stringify({ 
            score: finalScore, 
            maxScore: maxScore,
            percentage: percentage,
            date: new Date().toISOString() 
        }));
        return percentage;
    }

    function unlockLevel3(percentage) {
        const SEUIL_DEBLOCAGE = 60;
        
        if (percentage >= SEUIL_DEBLOCAGE) {
            localStorage.setItem("anesthesiologie_v1_intermediaire1_fr_unlocked", "true");
            localStorage.setItem("anesthesiologie_v1_debutant2_fr_score", percentage.toFixed(1));
            console.log("✅ Уровень Средний 1 РАЗБЛОКИРОВАН! Результат: " + percentage.toFixed(1) + "%");
            return true;
        } else {
            localStorage.setItem("anesthesiologie_v1_intermediaire1_fr_unlocked", "false");
            console.log("❌ Уровень Средний 1 ЗАБЛОКИРОВАН. Результат: " + percentage.toFixed(1) + "% (мин " + SEUIL_DEBLOCAGE + "%)");
            return false;
        }
    }

    function sauvegarderValidation(specialite, niveau, score, total) {
        const percentage = (score / total) * 100;
        
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: specialite,
                niveau: niveau,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progression = JSON.parse(localStorage.getItem('eteo_progression')) || {};
            const key = specialite + '_' + niveau;
            progression[key] = true;
            localStorage.setItem('eteo_progression', JSON.stringify(progression));
            
            console.log('✅ Валидация сохранена для progression.html');
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    speak("Время вышло! Переходим к следующему вопросу.", "ru-RU");
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function speakCurrentQuestion() {
        speak(`Вопрос ${currentQuestion + 1} : ${questions[currentQuestion].question}`, "ru-RU");
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header"><h1>💉 Анестезиология - Начинающий Уровень 2</h1><p>Вопрос ${currentQuestion + 1}/${questions.length}</p></div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Объяснение:</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                </div>
                <div class="timer">⏱️ Осталось времени: <span id="timer">${timeLeft}</span> секунд</div>
                <div class="score">🏆 Текущий счёт: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Прервать</button>
                    <button class="nav-btn" onclick="nextQuestion()">Далее →</button>
                </div>
            </div>
        `;
        answerLocked = false;
        startTimer();
        setTimeout(() => speakCurrentQuestion(), 500);
    }

    function checkAnswer(selectedIndex) {
        if (answerLocked) return;

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        if (isCorrect) {
            score += pointsEarned;
            speak(`Правильный ответ! +${pointsEarned} баллов.`, "ru-RU");
        } else {
            speak(`Неправильный ответ. Правильный ответ был: ${shuffledOptions[currentCorrectIndex]}.`, "ru-RU");
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Правильный ответ: ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        document.querySelector('.score').innerHTML = `🏆 Текущий счёт: ${score}/${MAX_SCORE_WITH_BONUS}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
    }

    function nextQuestion() {
        if (!answerLocked) { 
            speak("Пожалуйста, выберите ответ.", "ru-RU"); 
            return; 
        }
        currentQuestion++;
        timeLeft = 20;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    function endQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        
        saveScore(score, MAX_SCORE_WITH_BONUS);
        
        // === БЕТА-ВЕРСИЯ : Следующий уровень заблокирован ===
        const isUnlocked = false; // Всегда false в БЕТА
        // =================================
        
        // 🔥 Сохранение валидации для progression.html
        sauvegarderValidation('Стоматологическая анестезиология', 'начинающий2', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 Квиз завершён!</h1>
                <div class="final-score">Счёт: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Процент: <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${percentage >= 60 ?
                        `<div class="unlock-badge">✅ Уровень Начинающий 2 подтверждён! 🎊</div>
                         <div class="locked-badge">🔒 БЕТА: Продолжение (Средний & Эксперт) появится после 6 месяцев оценки.</div>` :
                        `<div class="locked-badge">⚠️ Недостаточно баллов (минимум 60% для подтверждения уровня)</div>`}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${percentage >= 60 ?
                        '📚 Вы прошли оба начальных уровня. Спасибо за участие!' :
                        `💪 Вам не хватает ${(60 - percentage).toFixed(1)}% для подтверждения уровня. Попробуйте снова!`}
                </div>
                <div>
                    <button class="share-btn" onclick="shareScore()">📤 Поделиться результатом</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Оставить отзыв</button>
                    <button class="menu-btn" onclick="goToMenu()">🏠 Главное меню</button>
                    <button class="ranking-btn" onclick="goToDashboard()">🏆 Мировой рейтинг</button>
                </div>
            </div>
        `;
        
        if (percentage >= 60) {
            speak(`Поздравляем! Вы прошли уровень Начинающий 2 с результатом ${percentage.toFixed(1)}%. Продолжение будет доступно в финальной версии.`, "ru-RU");
            
            setTimeout(function() {
                openBetaEvaluationPopup();
            }, 2000);
        } else {
            speak(`Ваш результат ${percentage.toFixed(1)}%. Для подтверждения уровня необходимо достичь 60%.`, "ru-RU");
        }
        
        setTimeout(() => {
            openRankingModal();
        }, 2500);
    }

    // ============================================
    // =========== POPUP CLASSEMENT MODAL ========
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    // ============================================
    // =========== loadRankingInModal ============
    // ============================================
    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 На данный момент нет записей для этого уровня.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Ваше место</div>
                        <div class="rank-number">${userRank}-е место</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} баллов (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Вы ещё не в рейтинге этого уровня</div>
                        <div>Пройдите квиз, чтобы появиться!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 ТОП-20 - Анестезиология Начинающий 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Аноним"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 Нет записей для этого уровня</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Erreur Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Не удалось загрузить рейтинг.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Неизвестная ошибка'}</span></div>`;
        }
    }

    // ============================================
    // =========== БЕТА-ОЦЕНКА ПОПАП =============
    // ============================================
    function openBetaEvaluationPopup() {
        if (document.getElementById('betaPopup')) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Доктор";
        
        const modal = document.createElement('div');
        modal.id = 'betaPopup';
        modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10002;
            animation: fadeIn 0.3s ease;
        `;
        
        modal.innerHTML = `
            <div style="background: white; border-radius: 30px; width: 90%; max-width: 500px; padding: 35px 25px; text-align: center; animation: slideUp 0.3s ease; position: relative;">
                <div style="font-size: 4rem; margin-bottom: 10px;">🎉🏆🎉</div>
                <h2 style="color: #667eea; margin-bottom: 5px;">Поздравляем, ${userName}!</h2>
                <p style="margin-bottom: 20px; font-size: 1rem;">
                    Вы успешно прошли <strong>оба начальных уровня</strong>.<br>
                    Впечатляющий результат!
                </p>
                
                <div style="margin: 25px 0;">
                    <p style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">🌟 Оцените БЕТА-версию 🌟</p>
                    <div id="starRating" style="display: flex; justify-content: center; gap: 12px; font-size: 3rem; cursor: pointer;">
                        <span data-rating="1" style="color: #ccc;">☆</span>
                        <span data-rating="2" style="color: #ccc;">☆</span>
                        <span data-rating="3" style="color: #ccc;">☆</span>
                        <span data-rating="4" style="color: #ccc;">☆</span>
                        <span data-rating="5" style="color: #ccc;">☆</span>
                    </div>
                    <p id="ratingMessage" style="margin-top: 10px; font-size: 0.85rem; color: #888;"></p>
                </div>
                
                <div style="background: #f0f8ff; padding: 15px; border-radius: 20px; margin: 15px 0; border-left: 4px solid #667eea;">
                    <p style="color: #ff5722; font-size: 0.95rem; margin: 0;">
                        🚀 <strong>Продолжение (Средний & Эксперт)</strong> появится после <strong>6 месяцев оценки</strong> этой Бета-версии.<br><br>
                        Ваше мнение помогает нам улучшать ETEO. Спасибо за доверие, <strong>${userName}</strong>!
                    </p>
                </div>
                
                <button onclick="closeBetaPopup()" style="background: #4caf50; color: white; border: none; padding: 12px 30px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 15px;">
                    Вернуться в меню
                </button>
            </div>
        `;
        
        document.body.appendChild(modal);
        
        const stars = modal.querySelectorAll('#starRating span');
        stars.forEach(function(star) {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                sendBetaEvaluation(rating);
                
                stars.forEach(function(s, idx) {
                    if (idx < rating) {
                        s.innerHTML = '★';
                        s.style.color = '#ffc107';
                    } else {
                        s.innerHTML = '☆';
                        s.style.color = '#ccc';
                    }
                });
                
                const messageDiv = document.getElementById('ratingMessage');
                messageDiv.innerHTML = '✅ Спасибо за вашу оценку! Ваш отзыв сохранён.';
                messageDiv.style.color = '#4caf50';
                messageDiv.style.fontWeight = 'bold';
            });
        });
    }

    function closeBetaPopup() {
        var modal = document.getElementById('betaPopup');
        if (modal) modal.remove();
        goToMenu();
    }

    async function sendBetaEvaluation(rating) {
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        
        try {
            await db.collection('evaluations_beta').add({
                nom: userName,
                pays: userCountry,
                note: rating,
                langue: 'ru',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("✅ Оценка Бета отправлена!");
        } catch (error) {
            console.error("❌ Ошибка оценки Бета:", error);
        }
    }

    // ============================================
    // =========== ДРУГИЕ ФУНКЦИИ ================
    // ============================================
    function abandonQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        localStorage.setItem("anesthesiologie_v1_debutant2_fr", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE_WITH_BONUS, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        // БЕТА: следующий уровень заблокирован
        // unlockLevel3(partialPercentage); // Отключено в БЕТА

        // 🔥 Сохранение валидации даже в случае прерывания (если результат ≥ 60%)
        sauvegarderValidation('Стоматологическая анестезиология', 'начинающий2', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `<div class="result-container"><h1>❌ Квиз прерван</h1><div class="final-score">Частичный счёт: ${score}/${MAX_SCORE_WITH_BONUS}</div><div>Процент: ${partialPercentage.toFixed(1)}%</div><div style="margin:20px 0;">🏆 Этот результат был записан в рейтинг.</div><button class="menu-btn" onclick="goToMenu()">🏠 Вернуться в меню</button></div>`;
        speak(`Квиз прерван. Частичный счёт: ${score} из ${MAX_SCORE_WITH_BONUS}.`, "ru-RU");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        const text = `🎓 ETEO - Анестезиология\nМой результат на уровне Начинающий 2: ${score}/${MAX_SCORE_WITH_BONUS} (${percentage.toFixed(1)}%)\nБрось мне вызов на ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Результат', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Результат скопирован в буфер обмена!");
            }).catch(() => {
                alert("📋 Для публикации скопируйте этот текст:\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        saveUserInfo();
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
    }

    document.body.addEventListener('click', function firstClick() { 
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
