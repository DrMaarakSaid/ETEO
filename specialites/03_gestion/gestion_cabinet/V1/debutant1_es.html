<script>

    const firebaseConfig = {

        authDomain: "eteo-endo-to-every-one.firebaseapp.com",

    // ============================================

    // ============================================
    // =========== 1. VOICE SYSTEM ===============
    // ============================================
    
    let isSpeaking = false;
    let voiceReady = false;
    let voiceActivated = false;
    let lastAnswerCorrect = false;
    let lastCorrectAnswer = "";
    let lastPointsEarned = 0;

    // ============================================
    // 🔥 FUNCTION: REACTIVATE ALL BUTTONS
    // ============================================
    function resetAllVoiceButtons() {
        console.log("🔄 resetAllVoiceButtons() - Reactivando TODOS los botones");
        
        const qBtn = document.getElementById('voiceQuestionBtn');
        if (qBtn) {
            qBtn.disabled = false;
            qBtn.textContent = '🔊 Leer pregunta';
            console.log("✅ voiceQuestionBtn reactivado");
        }
        
        const fBtn = document.getElementById('voiceFeedbackBtn');
        if (fBtn) {
            fBtn.disabled = false;
            fBtn.textContent = '🔊 Reescuchar retroalimentación';
            console.log("✅ voiceFeedbackBtn reactivado");
        }
        
        const eBtn = document.getElementById('voiceExplanationBtn');
        if (eBtn) {
            eBtn.disabled = false;
            eBtn.textContent = '🔊 Leer explicación';
            console.log("✅ voiceExplanationBtn reactivado");
        }
        
        const rBtn = document.getElementById('voiceResultBtn');
        if (rBtn) {
            rBtn.disabled = false;
            rBtn.textContent = '🔊 Escuchar su resultado';
            console.log("✅ voiceResultBtn reactivado");
        }
        
        isSpeaking = false;
        updateVoiceIndicator('active');
        console.log("✅ Todos los botones de voz están ahora ACTIVOS!");
    }

    // ============================================
    // 🔥 FUNCTION: STOP SPEAKING
    // ============================================
    function stopSpeaking() {
        console.log("🔊 stopSpeaking() llamado");
        
        try {
            if (window.Capacitor?.Plugins?.TextToSpeech) {
                window.Capacitor.Plugins.TextToSpeech.stop();
                console.log("✅ Parada Android realizada");
            }
        } catch(e) { console.log("⚠️ Error parada Android:", e); }
        
        try {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                console.log("✅ Parada Web Speech realizada");
            }
        } catch(e) { console.log("⚠️ Error parada Web Speech:", e); }
        
        isSpeaking = false;
        console.log("✅ isSpeaking reset a false");
        resetAllVoiceButtons();
    }

    // ============================================
    // 🔥 FUNCTION: FALLBACK WEB SPEECH
    // ============================================
    function fallbackWebSpeech(text, lang, callback) {
        console.log("🔊 fallbackWebSpeech() llamado");
        
        if (!window.speechSynthesis) {
            console.error("❌ Web Speech no disponible");
            if (callback) callback();
            return;
        }
        
        try {
            window.speechSynthesis.cancel();
            
            // Corrección de abreviaturas para español
            let correctedText = text;
            if (lang === 'es-ES' || lang === 'es') {
                correctedText = correctedText.replace(/Dr\.?\s+/g, 'Doctor ');
                correctedText = correctedText.replace(/Dra\.?\s+/g, 'Doctora ');
                correctedText = correctedText.replace(/\bDr\b/g, 'Doctor');
                correctedText = correctedText.replace(/\bDra\b/g, 'Doctora');
            }
            
            const utterance = new SpeechSynthesisUtterance(correctedText);
            utterance.lang = lang || 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            // ✅ NO FORZAR VOZ - Dejar que el sistema elija
            
            let callbackExecuted = false;
            
            const safeCallback = function() {
                if (!callbackExecuted) {
                    callbackExecuted = true;
                    console.log("✅ Callback Web Speech ejecutado");
                    if (callback) callback();
                }
            };
            
            utterance.onend = function() {
                console.log("✅ Web Speech terminado (onend)");
                safeCallback();
            };
            
            utterance.onerror = function(e) {
                console.error("❌ Error Web Speech:", e);
                safeCallback();
            };
            
            window.speechSynthesis.speak(utterance);
            
            setTimeout(function() {
                if (!callbackExecuted) {
                    console.warn("⚠️ TIMEOUT Web Speech - Forzando callback");
                    safeCallback();
                }
            }, 5000);
            
        } catch (error) {
            console.error("❌ Error en fallbackWebSpeech:", error);
            if (callback) callback();
        }
    }

    // ============================================
    // 🔥 FUNCTION: SPEAK (Capacitor + Web Speech)
    // ============================================
    function speak(text, lang, callback) {
        console.log("🔊 speak() llamado con:", text.substring(0, 50) + '...');
        
        if (!text) { 
            console.log("⚠️ Texto vacío, callback inmediato");
            if (callback) callback(); 
            return; 
        }
        
        const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
        
        let callbackExecuted = false;
        
        const safeCallback = function() {
            if (!callbackExecuted) {
                callbackExecuted = true;
                console.log("✅ safeCallback() ejecutado");
                isSpeaking = false;
                if (callback) callback();
            }
        };
        
        try {
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("🔊 Usando plugin Capacitor TTS en Android");
                const TTS = window.Capacitor.Plugins.TextToSpeech;
                
                TTS.speak({ 
                    text: text, 
                    lang: lang || 'es-ES', 
                    rate: 0.9, 
                    pitch: 1.0, 
                    volume: 1.0 
                }).then(() => {
                    console.log("✅ Capacitor TTS terminado");
                    setTimeout(safeCallback, 300);
                }).catch((error) => {
                    console.error("❌ Error Capacitor TTS:", error);
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback a Web Speech");
                        fallbackWebSpeech(text, lang, safeCallback);
                    } else {
                        safeCallback();
                    }
                });
                
                setTimeout(function() {
                    if (!callbackExecuted) {
                        console.warn("⚠️ TIMEOUT Capacitor TTS - Forzando callback");
                        safeCallback();
                    }
                }, 5000);
                
            } else if (window.speechSynthesis) {
                console.log("🔊 Usando Web Speech API");
                fallbackWebSpeech(text, lang, safeCallback);
                
            } else {
                console.error("❌ No hay motor TTS disponible");
                safeCallback();
            }
        } catch (error) {
            console.error("❌ ERROR en speak():", error);
            safeCallback();
        }
    }

    // ============================================
    // 🔥 VOICE ACTIVATION
    // ============================================
    function activateVoice() {
        console.log("🔊 activateVoice() llamado");
        if (!voiceActivated) {
            const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
            console.log("🔊 isAndroid =", isAndroid);
            
            if (isAndroid) {
                if (window.Capacitor?.Plugins?.TextToSpeech) {
                    console.log("✅ Capacitor TTS disponible en Android");
                    voiceReady = true;
                    voiceActivated = true;
                    updateVoiceIndicator('active');
                } else {
                    console.warn("⚠️ Capacitor TTS no encontrado en Android");
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback a Web Speech");
                        voiceReady = true;
                        voiceActivated = true;
                        window.speechSynthesis.getVoices();
                        updateVoiceIndicator('active');
                    }
                }
            } else {
                if (window.speechSynthesis) {
                    console.log("✅ Web Speech disponible en PC");
                    voiceReady = true;
                    voiceActivated = true;
                    window.speechSynthesis.getVoices();
                    updateVoiceIndicator('active');
                }
            }
            console.log("✅ Voz activada, voiceReady =", voiceReady);
        } else {
            console.log("ℹ️ Voz ya activada");
        }
    }

    function updateVoiceIndicator(status) {
        const indicator = document.getElementById('voiceIndicator');
        if (indicator) {
            if (status === 'active') {
                indicator.textContent = '🎙️ IA activada';
                indicator.className = 'voice-indicator active';
            } else if (status === 'speaking') {
                indicator.textContent = '🎙️ Hablando...';
                indicator.className = 'voice-indicator speaking';
            } else {
                indicator.textContent = '🔇 IA inactiva';
                indicator.className = 'voice-indicator inactive';
            }
        }
    }

    // =========== VOICE FUNCTIONS ===============
    // ============================================
    
    function speakQuestionOnly() {

        if (btn) {
            btn.disabled = true;
            btn.textContent = '🔊 Leyendo...';
            console.log("🔇 voiceResultBtn desactivado");
        }
        
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(text, "es-ES", function() {
            console.log("✅ speakFinalResult() terminado");
            resetAllVoiceButtons();
        });
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

                    <button class="voice-btn" id="voiceQuestionBtn">🔊 Leer pregunta</button>
                </div>
                
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                
                <div id="feedbackContainer" style="display: none;"></div>
                
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Explicación:</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                    <div class="voice-btn-row">
                        <button class="voice-btn explanation-btn-style" id="voiceExplanationBtn" style="display: none;">🔊 Leer explicación</button>
                    </div>
                </div>
                
                <div class="timer">⏱️ Tiempo restante: <span id="timer">${timeLeft}</span> segundos</div>
                <div class="score">🏆 Puntuación actual: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                
                <!-- ✅ BOTÓN MI PROGRESIÓN - SIEMPRE ACTIVO -->
                <div style="margin: 10px 0;">
                    <button class="btn-progression" onclick="goToProgression()">📊 Mi progresión</button>
                </div>
                
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandonar</button>
                    <button class="nav-btn" onclick="nextQuestion()">Siguiente →</button>
                </div>
            </div>
        `;
        
        attachVoiceEvents();
        answerLocked = false;
        startTimer();
        lastAnswerCorrect = false;
        lastCorrectAnswer = "";
        lastPointsEarned = 0;
        
        setTimeout(() => {
            speakQuestionOnly();
        }, 500);
    }

    // ============================================
    // =========== ATTACH VOICE EVENTS ============
    // ============================================
    function attachVoiceEvents() {
        const voiceBtn = document.getElementById('voiceQuestionBtn');
        if (voiceBtn) {
            const newVoiceBtn = voiceBtn.cloneNode(true);
            voiceBtn.parentNode.replaceChild(newVoiceBtn, voiceBtn);
            newVoiceBtn.addEventListener('click', speakQuestionOnly);
            console.log("✅ Evento adjuntado a voiceQuestionBtn");
        }
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn && explBtn.style.display !== 'none') {
            const newExplBtn = explBtn.cloneNode(true);
            explBtn.parentNode.replaceChild(newExplBtn, explBtn);
            newExplBtn.addEventListener('click', speakExplanation);
            console.log("✅ Evento adjuntado a voiceExplanationBtn");
        }
    }

    // ============================================
    // =========== CHECK ANSWER ===================
    // ============================================
    function checkAnswer(selectedIndex) {
        console.log("🔍 checkAnswer() - Opción", String.fromCharCode(65 + selectedIndex));
        
        stopSpeaking();
        
        if (answerLocked) {
            console.log("⏳ Respuesta ya bloqueada");
            return;
        }

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        lastAnswerCorrect = isCorrect;
        lastCorrectAnswer = shuffledOptions[currentCorrectIndex];
        lastPointsEarned = pointsEarned;

        if (isCorrect) {
            score += pointsEarned;
            console.log("✅ Respuesta correcta! +", pointsEarned, "puntos");
        } else {
            console.log("❌ Respuesta incorrecta. Respuesta correcta:", shuffledOptions[currentCorrectIndex]);
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        const feedbackContainer = document.getElementById('feedbackContainer');
        if (feedbackContainer) {
            const feedbackClass = isCorrect ? 'feedback-container' : 'feedback-container wrong';
            feedbackContainer.style.display = 'block';
            feedbackContainer.className = feedbackClass;
            
            let pointsDisplay = '';
            if (isCorrect) {
                pointsDisplay = `<span class="points-badge correct">+${pointsEarned} puntos</span>`;
            } else {
                pointsDisplay = `<span class="points-badge wrong">(0 puntos)</span>`;
            }
            
            feedbackContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        ${isCorrect ? '✅ ¡Respuesta correcta!' : '❌ Respuesta incorrecta'}
                        ${pointsDisplay}
                    </div>
                    <button class="voice-btn feedback-btn-style" id="voiceFeedbackBtn">🔊 Reescuchar retroalimentación</button>
                </div>
            `;
            
            const feedbackBtn = document.getElementById('voiceFeedbackBtn');
            if (feedbackBtn) {
                const newFeedbackBtn = feedbackBtn.cloneNode(true);
                feedbackBtn.parentNode.replaceChild(newFeedbackBtn, feedbackBtn);
                newFeedbackBtn.addEventListener('click', speakFeedback);
                console.log("✅ Evento adjuntado a voiceFeedbackBtn");
            }
        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Respuesta correcta: ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn) {
            explBtn.style.display = 'inline-block';
            attachVoiceEvents();
        }
        
        document.querySelector('.score').innerHTML = `🏆 Puntuación actual: ${score}/${MAX_SCORE_WITH_BONUS}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
        
        let feedbackText = "";
        if (isCorrect) {
            feedbackText = `¡Respuesta correcta! +${pointsEarned} puntos.`;
        } else {
            feedbackText = `Respuesta incorrecta. La respuesta correcta era: ${shuffledOptions[currentCorrectIndex]}.`;
        }
        
        console.log("🔊 Lectura automática del feedback");
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(feedbackText, "es-ES", function() {
            console.log("✅ Feedback automático terminado");
            resetAllVoiceButtons();
        });
    }

    // ============================================
    // =========== NEXT QUESTION ==================
    // ============================================
    function nextQuestion() {
        console.log("🔍 nextQuestion() llamado");
        stopSpeaking();
        
        if (!answerLocked) {
            console.log("⚠️ Por favor responda antes de continuar");
            return;
        }
        currentQuestion++;
        timeLeft = 30;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    // ============================================
    // =========== NAVIGATION =====================
    // ============================================
    
    function goToMenu() {
        window.location.href = "menu_es.html?t=" + Date.now();
    }

    function goToDashboard() {
        window.location.href = "../../../../classements_dashboard.html";
    }

    function goToRanking() {
        goToDashboard();
    }

    // ============================================
    // =========== endQuiz ========================
    // ============================================
    function endQuiz() {
        console.log("🔍 endQuiz() llamado");
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        
        saveScore(score, MAX_SCORE_WITH_BONUS);
        
        const isUnlocked = unlockLevel2(percentage);
        
        sauvegarderValidation('Gestion_Consultorio', 'principiante1', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 ¡Quiz finalizado!</h1>
                <div class="final-score">Puntuación: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Porcentaje: <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${isUnlocked ? 
                        '<div class="unlock-badge">✅ ¡Nivel Principiante 2 desbloqueado! 🎊</div>' : 
                        '<div class="locked-badge">⚠️ Puntuación insuficiente (mínimo 60% requerido para desbloquear el siguiente nivel)</div>'}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${isUnlocked ? 
                        '📚 Ve al menú para acceder al nivel 2.' : 
                        `💪 Te falta un ${(60 - percentage).toFixed(1)}% para desbloquear el nivel 2. ¡Vuelve a intentarlo!`}
                </div>
                
                <div class="voice-btn-row">
                    <button class="voice-btn result-btn-style" id="voiceResultBtn">🔊 Escuchar su resultado</button>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0;">
                    <button class="share-btn" onclick="shareScore()">📤 Compartir mi puntuación</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Dar mi opinión</button>
                    <button class="ranking-btn" onclick="goToDashboard()">🏆 Clasificación mundial</button>
                </div>
                
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Menú principal</button>
                    <!-- ✅ SIEMPRE ACTIVO - El usuario puede ver su progresión -->
                    <button class="btn-progression" onclick="goToProgression()">📊 Mi progresión</button>
                </div>
            </div>
        `;
        
        const resultBtn = document.getElementById('voiceResultBtn');
        if (resultBtn) {
            const newResultBtn = resultBtn.cloneNode(true);
            resultBtn.parentNode.replaceChild(newResultBtn, resultBtn);
            newResultBtn.addEventListener('click', speakFinalResult);
            console.log("✅ Evento adjuntado a voiceResultBtn");
        }
        
        setTimeout(() => {
            speakFinalResult();
        }, 1000);
        
        setTimeout(() => {
            openRankingModal();
        }, 2000);
    }

    // ============================================
    // =========== POPUP RANKING MODAL ============
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    // ============================================
    // =========== loadRankingInModal ============
    // ============================================
    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anónimo";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 No hay puntuaciones registradas para este nivel por el momento.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Su clasificación</div>
                        <div class="rank-number">${userRank}ª posición</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} puntos (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Todavía no estás en la clasificación de este nivel</div>
                        <div>¡Vuelve a hacer el quiz para aparecer!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 TOP 20 - Gestión de Consultorio Principiante 1</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anónimo"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 No hay puntuaciones para este nivel</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Error Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ No se puede cargar la clasificación.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Error desconocido'}</span></div>`;
        }
    }

    function abandonQuiz() {
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        localStorage.setItem("gestion_cabinet_v1_debutant1_es", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE_WITH_BONUS, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel2(partialPercentage);
        sauvegarderValidation('Gestion_Consultorio', 'principiante1', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>❌ Quiz abandonado</h1>
                <div class="final-score">Puntuación parcial: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div>Porcentaje: ${partialPercentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">🏆 Esta puntuación ha sido registrada en la clasificación.</div>
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Volver al menú</button>
                    <!-- ✅ SIEMPRE ACTIVO - El usuario puede ver su progresión -->
                    <button class="btn-progression" onclick="goToProgression()">📊 Mi progresión</button>
                </div>
            </div>
        `;
        speak(`Quiz abandonado. Puntuación parcial: ${score} de ${MAX_SCORE_WITH_BONUS}.`, "es-ES");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        const text = `🎓 ETEO - Gestión de Consultorio Principiante 1\nMi puntuación: ${score}/${MAX_SCORE_WITH_BONUS} (${percentage.toFixed(1)}%)\n¡Desafíame en ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Score', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ ¡Puntuación copiada al portapapeles!");
            }).catch(() => {
                alert("📋 Para compartir, copia este texto:\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        console.log("🚀 startQuiz() llamado");
        saveUserInfo();
        console.log("🔊 Activando voz...");
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
        console.log("✅ Quiz iniciado");
    }

    // ============================================
    // =========== INITIALIZATION =================
    // ============================================
    console.log("🚀 Página cargada - ETEO Quiz Gestión de Consultorio (ES)");
    console.log("📱 window.Capacitor =", window.Capacitor);
    
    if (window.Capacitor) {
        console.log("📱 Platform =", window.Capacitor.getPlatform());
        console.log("📱 Plugins =", Object.keys(window.Capacitor.Plugins || {}));
    }
    
    document.body.addEventListener('click', function firstClick() { 
        console.log("🖱️ Primer clic - Activando voz");
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
