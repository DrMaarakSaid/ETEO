<script>
    // ============================================
    // =========== CONFIGURATION FIREBASE =========
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",
        projectId: "eteo-endo-to-every-one",
        storageBucket: "eteo-endo-to-every-one.firebasestorage.app",
        messagingSenderId: "511524282020",

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================
    // LEVEL_ID POUR CE QUIZ
    // ============================================
    const LEVEL_ID = "gestion_cabinet_v1_debutant1_fr";

    // ============================================
    // =========== 1. VOICE SYSTEM ===============
    // ============================================
    
    let isSpeaking = false;
    let voiceReady = false;
    let voiceActivated = false;
    let lastAnswerCorrect = false;
    let lastCorrectAnswer = "";
    let lastPointsEarned = 0;

    // ============================================
    // 🔥 FUNCTION: REACTIVATE ALL BUTTONS
    // ============================================
    function resetAllVoiceButtons() {
        console.log("🔄 resetAllVoiceButtons() - Réactivation de TOUS les boutons");
        
        const qBtn = document.getElementById('voiceQuestionBtn');
        if (qBtn) {
            qBtn.disabled = false;
            qBtn.textContent = '🔊 Lire la question';
            console.log("✅ voiceQuestionBtn réactivé");
        }
        
        const fBtn = document.getElementById('voiceFeedbackBtn');
        if (fBtn) {
            fBtn.disabled = false;
            fBtn.textContent = '🔊 Réécouter le feedback';
            console.log("✅ voiceFeedbackBtn réactivé");
        }
        
        const eBtn = document.getElementById('voiceExplanationBtn');
        if (eBtn) {
            eBtn.disabled = false;
            eBtn.textContent = '🔊 Lire l\'explication';
            console.log("✅ voiceExplanationBtn réactivé");
        }
        
        const rBtn = document.getElementById('voiceResultBtn');
        if (rBtn) {
            rBtn.disabled = false;
            rBtn.textContent = '🔊 Écouter votre résultat';
            console.log("✅ voiceResultBtn réactivé");
        }
        
        isSpeaking = false;
        updateVoiceIndicator('active');
        console.log("✅ Tous les boutons vocaux sont maintenant ACTIFS !");
    }

    // ============================================
    // 🔥 FUNCTION: STOP SPEAKING
    // ============================================
    function stopSpeaking() {
        console.log("🔊 stopSpeaking() appelé");
        
        try {
            if (window.Capacitor?.Plugins?.TextToSpeech) {
                window.Capacitor.Plugins.TextToSpeech.stop();
                console.log("✅ Arrêt Android effectué");
            }
        } catch(e) { console.log("⚠️ Erreur arrêt Android:", e); }
        
        try {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                console.log("✅ Arrêt Web Speech effectué");
            }
        } catch(e) { console.log("⚠️ Erreur arrêt Web Speech:", e); }
        
        isSpeaking = false;
        console.log("✅ isSpeaking remis à false");
        resetAllVoiceButtons();
    }

    // ============================================
    // 🔥 FUNCTION: FALLBACK WEB SPEECH
    // ============================================
    function fallbackWebSpeech(text, lang, callback) {
        console.log("🔊 fallbackWebSpeech() appelé");
        
        if (!window.speechSynthesis) {
            console.error("❌ Web Speech non disponible");
            if (callback) callback();
            return;
        }
        
        try {
            window.speechSynthesis.cancel();
            
            // Correction des abréviations pour le français
            let correctedText = text;
            if (lang === 'fr-FR' || lang === 'fr') {
                correctedText = correctedText.replace(/Dr\.?\s+/g, 'Docteur ');
                correctedText = correctedText.replace(/Pr\.?\s+/g, 'Professeur ');
            }
            
            const utterance = new SpeechSynthesisUtterance(correctedText);
            utterance.lang = lang || 'fr-FR';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            // ✅ NE PAS FORCER DE VOIX - Laisser le système choisir
            
            let callbackExecuted = false;
            
            const safeCallback = function() {
                if (!callbackExecuted) {
                    callbackExecuted = true;
                    console.log("✅ Callback Web Speech exécuté");
                    if (callback) callback();
                }
            };
            
            utterance.onend = function() {
                console.log("✅ Web Speech terminé (onend)");
                safeCallback();
            };
            
            utterance.onerror = function(e) {
                console.error("❌ Erreur Web Speech:", e);
                safeCallback();
            };
            
            window.speechSynthesis.speak(utterance);
            
            setTimeout(function() {
                if (!callbackExecuted) {
                    console.warn("⚠️ TIMEOUT Web Speech - Forçage du callback");
                    safeCallback();
                }
            }, 5000);
            
        } catch (error) {
            console.error("❌ Erreur dans fallbackWebSpeech:", error);
            if (callback) callback();
        }
    }

    // ============================================
    // 🔥 FUNCTION: SPEAK (Capacitor + Web Speech)
    // ============================================
    function speak(text, lang, callback) {
        console.log("🔊 speak() appelé avec:", text.substring(0, 50) + '...');
        
        if (!text) { 
            console.log("⚠️ Texte vide, callback immédiat");
            if (callback) callback(); 
            return; 
        }
        
        const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
        
        let callbackExecuted = false;
        
        const safeCallback = function() {
            if (!callbackExecuted) {
                callbackExecuted = true;
                console.log("✅ safeCallback() exécuté");
                isSpeaking = false;
                if (callback) callback();
            }
        };
        
        try {
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("🔊 Utilisation du plugin Capacitor TTS sur Android");
                const TTS = window.Capacitor.Plugins.TextToSpeech;
                
                TTS.speak({ 
                    text: text, 
                    lang: lang || 'fr-FR', 
                    rate: 0.9, 
                    pitch: 1.0, 
                    volume: 1.0 
                }).then(() => {
                    console.log("✅ Capacitor TTS terminé");
                    setTimeout(safeCallback, 300);
                }).catch((error) => {
                    console.error("❌ Erreur Capacitor TTS:", error);
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback vers Web Speech");
                        fallbackWebSpeech(text, lang, safeCallback);
                    } else {
                        safeCallback();
                    }
                });
                
                setTimeout(function() {
                    if (!callbackExecuted) {
                        console.warn("⚠️ TIMEOUT Capacitor TTS - Forçage du callback");
                        safeCallback();
                    }
                }, 5000);
                
            } else if (window.speechSynthesis) {
                console.log("🔊 Utilisation de Web Speech API");
                fallbackWebSpeech(text, lang, safeCallback);
                
            } else {
                console.error("❌ Aucun moteur TTS disponible");
                safeCallback();
            }
        } catch (error) {
            console.error("❌ ERREUR dans speak():", error);
            safeCallback();
        }
    }

    // ============================================
    // 🔥 VOICE ACTIVATION
    // ============================================
    function activateVoice() {
        console.log("🔊 activateVoice() appelé");
        if (!voiceActivated) {
            const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
            console.log("🔊 isAndroid =", isAndroid);
            
            if (isAndroid) {
                if (window.Capacitor?.Plugins?.TextToSpeech) {
                    console.log("✅ Capacitor TTS disponible sur Android");
                    voiceReady = true;
                    voiceActivated = true;
                    updateVoiceIndicator('active');
                } else {
                    console.warn("⚠️ Capacitor TTS non trouvé sur Android");
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback vers Web Speech");
                        voiceReady = true;
                        voiceActivated = true;
                        window.speechSynthesis.getVoices();
                        updateVoiceIndicator('active');
                    }
                }
            } else {
                if (window.speechSynthesis) {
                    console.log("✅ Web Speech disponible sur PC");
                    voiceReady = true;
                    voiceActivated = true;
                    window.speechSynthesis.getVoices();
                    updateVoiceIndicator('active');
                }
            }
            console.log("✅ Voix activée, voiceReady =", voiceReady);
        } else {
            console.log("ℹ️ Voix déjà activée");
        }
    }

    function updateVoiceIndicator(status) {
        const indicator = document.getElementById('voiceIndicator');
        if (indicator) {
            if (status === 'active') {
                indicator.textContent = '🎙️ IA activée';
                indicator.className = 'voice-indicator active';
            } else if (status === 'speaking') {
                indicator.textContent = '🎙️ En train de parler...';
                indicator.className = 'voice-indicator speaking';
            } else {
                indicator.textContent = '🔇 IA inactive';
                indicator.className = 'voice-indicator inactive';
            }
        }
    }

    // ============================================
    // =========== VOICE FUNCTIONS ===============
    // ============================================
    
    function speakQuestionOnly() {
        console.log("🔊 speakQuestionOnly() appelé");
        stopSpeaking();
        
        const q = questions[currentQuestion];
        const text = `Question ${currentQuestion + 1} sur ${questions.length} : ${q.question}`;
        const btn = document.getElementById('voiceQuestionBtn');
        
        if (btn) {
            btn.disabled = true;
            btn.textContent = '🔊 Lecture...';
            console.log("🔇 voiceQuestionBtn désactivé");
        }
        
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(text, "fr-FR", function() {
            console.log("✅ speakQuestionOnly() terminé");

        if (btn) {
            btn.disabled = true;
            btn.textContent = '🔊 Lecture...';
            console.log("🔇 voiceFeedbackBtn désactivé");
        }
        
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(text, "fr-FR", function() {
            console.log("✅ speakFeedback() terminé");
            resetAllVoiceButtons();
        });
    }

    function speakFinalResult() {
        console.log("🔊 speakFinalResult() appelé");
        stopSpeaking();
        
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        const isUnlocked = percentage >= 60;
        let text = `Votre score final est de ${score} sur ${MAX_SCORE_WITH_BONUS}, soit ${percentage.toFixed(1)} pour cent. `;
        if (isUnlocked) {
            text += "Félicitations ! Vous avez débloqué le niveau Débutant 2. Excellent travail !";
        } else {
            text += `Il vous manque ${(60 - percentage).toFixed(1)} pour cent pour débloquer le niveau 2. Continuez à vous entraîner !`;
        }
        
        const btn = document.getElementById('voiceResultBtn');
        
        if (btn) {
            btn.disabled = true;
            btn.textContent = '🔊 Lecture...';
            console.log("🔇 voiceResultBtn désactivé");
        }
        
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(text, "fr-FR", function() {
            console.log("✅ speakFinalResult() terminé");
            resetAllVoiceButtons();
        });
    }

    async function sendScoreToFirebase(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Anonyme";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        
        const scoreData = {
            nom: userName,
            pays: userCountry,
            score: score,
            maxScore: maxScore,
            percentage: percentage,
            levelId: LEVEL_ID,
            date: new Date().toISOString(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection('scores').add(scoreData);
            console.log("✅ Score envoyé à Firebase !");
            return true;
        } catch (error) {
            console.error("❌ Erreur Firebase:", error);
            return false;
        }
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("gestion_cabinet_v1_debutant1_fr", JSON.stringify({ 
            score: finalScore, 
            maxScore: maxScore,
            percentage: percentage,
            date: new Date().toISOString() 
        }));
        return percentage;
    }

    // ============================================
    // =========== UNLOCK LEVEL 2 ================
    // ============================================
    function unlockLevel2(percentage) {
        const SEUIL_DEBLOCAGE = 60;
        
        if (percentage >= SEUIL_DEBLOCAGE) {
            localStorage.setItem("gestion_cabinet_v1_debutant2_fr_unlocked", "true");
            localStorage.setItem("gestion_cabinet_v1_debutant1_fr_score", percentage.toFixed(1));
            console.log("✅ Niveau 2 DÉBLOQUÉ ! Score: " + percentage.toFixed(1) + "%");
            return true;
        } else {
            localStorage.setItem("gestion_cabinet_v1_debutant2_fr_unlocked", "false");
            console.log("❌ Niveau 2 VERROUILLÉ. Score: " + percentage.toFixed(1) + "% (min " + SEUIL_DEBLOCAGE + "%)");
            return false;
        }
    }

    // ================================================================
    // 🔥 SAVE VALIDATION FOR PROGRESSION.HTML
    // ================================================================
    function sauvegarderValidation(specialite, niveau, score, total) {
        const percentage = (score / total) * 100;
        
        // ✅ SEULEMENT SI >= 60% - La case est cochée
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: specialite,
                niveau: niveau,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progressionData = JSON.parse(localStorage.getItem('eteo_progression') || '{}');
            const key = specialite + '_' + niveau;
            progressionData[key] = true;
            localStorage.setItem('eteo_progression', JSON.stringify(progressionData));
            
            console.log('✅ Validation sauvegardée pour progression.html (>= 60%)');
        } else {
            console.log('❌ Validation NON sauvegardée (score < 60%)');
        }
    }

    // ================================================================

    // ================================================================
    function goToProgression() {
        console.log("🔍 goToProgression() appelé");
        
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        
        // ✅ TOUJOURS autorisé - L'utilisateur peut voir sa progression
        const validationData = {
            specialite: 'Gestion du cabinet',
            niveau: 'debutant1',
            score: score,
            total: MAX_SCORE_WITH_BONUS,
            percentage: percentage,
            timestamp: Date.now()
        };
        localStorage.setItem('eteo_validation', JSON.stringify(validationData));
        console.log("✅ Données de validation sauvegardées pour la progression");
        
        // 🔥 La validation NE sera sauvegardée que si >= 60%
        sauvegarderValidation('Gestion du cabinet', 'debutant1', score, MAX_SCORE_WITH_BONUS);
        
        // ✅ Chemin CORRECT : 4 niveaux pour arriver à la racine www
        const url = '../../../../progression_fr.html?valider=Gestion du cabinet_debutant1&score=' + score + '&total=' + MAX_SCORE_WITH_BONUS;
        console.log("🔀 Redirection vers:", url);
        window.location.href = url;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

                    </div>
                </div>
                
                <div class="timer">⏱️ Temps restant : <span id="timer">${timeLeft}</span> secondes</div>
                <div class="score">🏆 Score actuel : ${score}/${MAX_SCORE_WITH_BONUS}</div>
                
                <!-- ✅ BOUTON MA PROGRESSION - TOUJOURS ACTIF -->
                <div style="margin: 10px 0;">
                    <button class="btn-progression" onclick="goToProgression()">📊 Ma progression</button>
                </div>
                
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandonner</button>
                    <button class="nav-btn" onclick="nextQuestion()">Suivant →</button>
                </div>
            </div>
        `;
        
        attachVoiceEvents();
        answerLocked = false;
        startTimer();
        lastAnswerCorrect = false;
        lastCorrectAnswer = "";
        lastPointsEarned = 0;
        
        setTimeout(() => {
            speakQuestionOnly();
        }, 500);
    }

    // ============================================
    // =========== ATTACH VOICE EVENTS ============
    // ============================================
    function attachVoiceEvents() {
        const voiceBtn = document.getElementById('voiceQuestionBtn');
        if (voiceBtn) {
            const newVoiceBtn = voiceBtn.cloneNode(true);
            voiceBtn.parentNode.replaceChild(newVoiceBtn, voiceBtn);
            newVoiceBtn.addEventListener('click', speakQuestionOnly);
            console.log("✅ Événement attaché à voiceQuestionBtn");
        }
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn && explBtn.style.display !== 'none') {
            const newExplBtn = explBtn.cloneNode(true);
            explBtn.parentNode.replaceChild(newExplBtn, explBtn);
            newExplBtn.addEventListener('click', speakExplanation);
            console.log("✅ Événement attaché à voiceExplanationBtn");
        }
    }

    // ============================================
    // =========== CHECK ANSWER ===================
    // ============================================
    function checkAnswer(selectedIndex) {
        console.log("🔍 checkAnswer() - Option", String.fromCharCode(65 + selectedIndex));
        
        stopSpeaking();
        
        if (answerLocked) {
            console.log("⏳ Réponse déjà verrouillée");
            return;
        }

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        lastAnswerCorrect = isCorrect;
        lastCorrectAnswer = shuffledOptions[currentCorrectIndex];
        lastPointsEarned = pointsEarned;

        if (isCorrect) {
            score += pointsEarned;
            console.log("✅ Bonne réponse ! +", pointsEarned, "points");
        } else {
            console.log("❌ Mauvaise réponse. Bonne réponse :", shuffledOptions[currentCorrectIndex]);
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        const feedbackContainer = document.getElementById('feedbackContainer');
        if (feedbackContainer) {
            const feedbackClass = isCorrect ? 'feedback-container' : 'feedback-container wrong';
            feedbackContainer.style.display = 'block';
            feedbackContainer.className = feedbackClass;
            
            let pointsDisplay = '';
            if (isCorrect) {
                pointsDisplay = `<span class="points-badge correct">+${pointsEarned} points</span>`;
            } else {
                pointsDisplay = `<span class="points-badge wrong">(0 point)</span>`;
            }
            
            feedbackContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        ${isCorrect ? '✅ Bonne réponse !' : '❌ Mauvaise réponse'}
                        ${pointsDisplay}
                    </div>
                    <button class="voice-btn feedback-btn-style" id="voiceFeedbackBtn">🔊 Réécouter le feedback</button>
                </div>
            `;
            
            const feedbackBtn = document.getElementById('voiceFeedbackBtn');
            if (feedbackBtn) {
                const newFeedbackBtn = feedbackBtn.cloneNode(true);
                feedbackBtn.parentNode.replaceChild(newFeedbackBtn, feedbackBtn);
                newFeedbackBtn.addEventListener('click', speakFeedback);
                console.log("✅ Événement attaché à voiceFeedbackBtn");
            }
        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Bonne réponse : ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn) {
            explBtn.style.display = 'inline-block';
            attachVoiceEvents();
        }
        
        document.querySelector('.score').innerHTML = `🏆 Score actuel : ${score}/${MAX_SCORE_WITH_BONUS}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
        
        let feedbackText = "";
        if (isCorrect) {
            feedbackText = `Bonne réponse ! +${pointsEarned} points.`;
        } else {
            feedbackText = `Mauvaise réponse. La bonne réponse était : ${shuffledOptions[currentCorrectIndex]}.`;
        }
        
        console.log("🔊 Lecture automatique du feedback");
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(feedbackText, "fr-FR", function() {
            console.log("✅ Feedback automatique terminé");
            resetAllVoiceButtons();
        });
    }

    // ============================================
    // =========== NEXT QUESTION ==================
    // ============================================
    function nextQuestion() {
        console.log("🔍 nextQuestion() appelé");
        stopSpeaking();
        
        if (!answerLocked) {
            console.log("⚠️ Veuillez répondre avant de continuer");
            return;
        }
        currentQuestion++;
        timeLeft = 30;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    // ============================================
    // =========== NAVIGATION =====================
    // ============================================
    
    function goToMenu() {
        window.location.href = "menu_fr.html?t=" + Date.now();
    }

    function goToDashboard() {
        window.location.href = "../../../../classements_dashboard.html";
    }

    function goToRanking() {
        goToDashboard();
    }

    // ============================================
    // =========== endQuiz ========================
    // ============================================
    function endQuiz() {
        console.log("🔍 endQuiz() appelé");
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        
        saveScore(score, MAX_SCORE_WITH_BONUS);
        
        const isUnlocked = unlockLevel2(percentage);
        
        sauvegarderValidation('Gestion du cabinet', 'debutant1', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 Quiz terminé !</h1>
                <div class="final-score">Score : ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Pourcentage : <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${isUnlocked ? 
                        '<div class="unlock-badge">✅ Niveau Débutant 2 débloqué ! 🎊</div>' : 
                        '<div class="locked-badge">⚠️ Score insuffisant (minimum 60% requis pour débloquer le niveau suivant)</div>'}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${isUnlocked ? 
                        '📚 Rendez-vous dans le menu pour accéder au niveau 2.' : 
                        `💪 Il vous manque ${(60 - percentage).toFixed(1)}% pour débloquer le niveau 2. Réessayez !`}
                </div>
                
                <div class="voice-btn-row">
                    <button class="voice-btn result-btn-style" id="voiceResultBtn">🔊 Écouter votre résultat</button>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0;">
                    <button class="share-btn" onclick="shareScore()">📤 Partager mon score</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Donner mon avis</button>
                    <button class="ranking-btn" onclick="goToDashboard()">🏆 Classement mondial</button>
                </div>
                
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Menu principal</button>
                    <!-- ✅ TOUJOURS ACTIF - L'utilisateur peut voir sa progression -->
                    <button class="btn-progression" onclick="goToProgression()">📊 Ma progression</button>
                </div>
            </div>
        `;
        
        const resultBtn = document.getElementById('voiceResultBtn');
        if (resultBtn) {
            const newResultBtn = resultBtn.cloneNode(true);
            resultBtn.parentNode.replaceChild(newResultBtn, resultBtn);
            newResultBtn.addEventListener('click', speakFinalResult);
            console.log("✅ Événement attaché à voiceResultBtn");
        }
        
        setTimeout(() => {
            speakFinalResult();
        }, 1000);
        
        setTimeout(() => {
            openRankingModal();
        }, 2000);
    }

    // ============================================
    // =========== POPUP CLASSEMENT MODAL ========
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    // ============================================
    // =========== loadRankingInModal ============
    // ============================================
    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anonyme";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 Aucun score enregistré pour ce niveau pour le moment.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Votre classement</div>
                        <div class="rank-number">${userRank}e position</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} points (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Vous n'êtes pas encore dans le classement de ce niveau</div>
                        <div>Refaites le quiz pour apparaître !</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 TOP 20 - Gestion de cabinet Débutant 1</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anonyme"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 Aucun score pour ce niveau</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Erreur Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Impossible de charger le classement.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Erreur inconnue'}</span></div>`;
        }
    }

    function abandonQuiz() {
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        localStorage.setItem("gestion_cabinet_v1_debutant1_fr", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE_WITH_BONUS, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel2(partialPercentage);
        sauvegarderValidation('Gestion du cabinet', 'debutant1', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>❌ Quiz abandonné</h1>
                <div class="final-score">Score partiel : ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div>Pourcentage : ${partialPercentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">🏆 Ce score a été enregistré dans le classement.</div>
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Retour au menu</button>
                    <!-- ✅ TOUJOURS ACTIF - L'utilisateur peut voir sa progression -->
                    <button class="btn-progression" onclick="goToProgression()">📊 Ma progression</button>
                </div>
            </div>
        `;
        speak(`Quiz abandonné. Score partiel : ${score} sur ${MAX_SCORE_WITH_BONUS}.`, "fr-FR");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        const text = `🎓 ETEO - Gestion de cabinet Débutant 1\nMon score : ${score}/${MAX_SCORE_WITH_BONUS} (${percentage.toFixed(1)}%)\nDéfie-moi sur ETEO !`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Score', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Score copié dans le presse-papier !");
            }).catch(() => {
                alert("📋 Pour partager, copiez ce texte :\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        console.log("🚀 startQuiz() appelé");
        saveUserInfo();
        console.log("🔊 Activation de la voix...");
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
        console.log("✅ Quiz démarré");
    }

    // ============================================
    // =========== INITIALISATION =================
    // ============================================
    console.log("🚀 Page chargée - ETEO Quiz Gestion de cabinet (FR)");
    console.log("📱 window.Capacitor =", window.Capacitor);
    
    if (window.Capacitor) {
        console.log("📱 Platform =", window.Capacitor.getPlatform());
        console.log("📱 Plugins =", Object.keys(window.Capacitor.Plugins || {}));
    }
    
    document.body.addEventListener('click', function firstClick() { 
        console.log("🖱️ Premier clic - Activation de la voix");
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
