<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ETEO - Débutant 1 (Mode Conduite)</title>
    <link rel="manifest" href="../../../../manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 20px;
        }
        body.dark { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        body.dark .container { background: #1e1e2e; color: #eee; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 1.5rem; color: #667eea; }
        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
        }
        body.dark .progress-bar { background: #333; }
        .progress-fill {
            background: #4caf50;
            border-radius: 10px;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .question-container { text-align: center; }
        .question-text { font-size: 1.2rem; margin-bottom: 25px; font-weight: bold; }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .option-btn {
            background: #f0f0f0;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        body.dark .option-btn { background: #2a2a3e; color: #eee; }
        .option-btn:hover:not(.disabled) { background: #e0e0e0; }
        .option-btn.correct { background: #4caf50; color: white; }
        .option-btn.wrong { background: #f44336; color: white; }
        .option-btn.disabled { cursor: not-allowed; opacity: 0.8; }
        .explanation-box {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            display: none;
        }
        body.dark .explanation-box { background: #2a2a3e; }
        .explanation-box.show { display: block; }
        .explanation-title { font-weight: bold; color: #667eea; margin-bottom: 5px; }
        .correct-answer { color: #4caf50; font-weight: bold; margin-top: 5px; }
        .score { font-size: 1rem; margin: 10px 0; }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 20px;
        }
        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        .result-container { text-align: center; }
        .final-score { font-size: 2rem; font-weight: bold; color: #667eea; margin: 20px 0; }
        .share-btn, .feedback-btn, .menu-btn, .ranking-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
        }
        .voice-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            z-index: 999;
        }
    </style>
</head>
<body>
<div class="voice-indicator" id="voiceIndicator">🎙️ IA en attente</div>
<div class="container" id="app"></div>

<script>
    // ============================================
    // =========== 1. VOICE & RECOGNITION ========
    // ============================================
    let speechSynthesisObj = null;
    let voiceReady = false;
    let recognition = null;

    function initVoice() {
        if ('speechSynthesis' in window) {
            speechSynthesisObj = window.speechSynthesis;
            voiceReady = true;
        }
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = "fr-FR";
            recognition.continuous = false;
            recognition.interimResults = false;
        }
        return true;
    }

    function speak(text, lang) {
        if (!voiceReady || !speechSynthesisObj) return;
        try {
            speechSynthesisObj.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            speechSynthesisObj.speak(utterance);
        } catch(e) {}
    }

    function listenForAnswer(callback) {
        if (!recognition) {
            speak("Reconnaissance vocale non supportée.", "fr-FR");
            callback(null);
            return;
        }
        recognition.start();
        recognition.onresult = (event) => {
            const parole = event.results[0][0].transcript.toUpperCase().trim();
            const lettre = parole.match(/[A-D]/);
            if (lettre) {
                callback(lettre[0]);
            } else {
                speak("Je n'ai pas compris. Répondez par A, B, C ou D.", "fr-FR");
                listenForAnswer(callback);
            }
        };
        recognition.onerror = () => {
            speak("Je ne vous entends pas bien. Réessayez.", "fr-FR");
            listenForAnswer(callback);
        };
    }

    let voiceActivated = false;
    function activateVoice() {
        if (!voiceActivated) {
            initVoice();
            voiceActivated = true;
            const indicator = document.getElementById('voiceIndicator');
            if (indicator) {
                indicator.textContent = "🎙️ IA activée";
                indicator.style.background = "#4caf50";
            }
        }
    }

    // ============================================
    // =========== 2. PAYS & UTILISATEUR =========
    // ============================================
    const countries = [
        { code: "FR", name: "🇫🇷 France" }, { code: "MA", name: "🇲🇦 Maroc" },
        { code: "CH", name: "🇨🇭 Suisse" }, { code: "CA", name: "🇨🇦 Canada" },
        { code: "BE", name: "🇧🇪 Belgique" }, { code: "SN", name: "🇸🇳 Sénégal" },
        { code: "CI", name: "🇨🇮 Côte d'Ivoire" }, { code: "CM", name: "🇨🇲 Cameroun" },
        { code: "DZ", name: "🇩🇿 Algérie" }, { code: "TN", name: "🇹🇳 Tunisie" },
        { code: "US", name: "🇺🇸 USA" }, { code: "GB", name: "🇬🇧 UK" }
    ];

    function getUserName() { return localStorage.getItem("eteo_userName") || ""; }
    function getUserCountry() { return localStorage.getItem("eteo_userCountry") || "FR"; }
    function saveUserInfo() {
        const name = document.getElementById("userName").value.trim();
        const country = document.getElementById("userCountry").value;
        localStorage.setItem("eteo_userName", name === "" ? "Anonyme" : name);
        localStorage.setItem("eteo_userCountry", country);
    }

    function showWelcomeScreen() {
        const app = document.getElementById("app");
        let countryOptions = "";
        countries.forEach(c => { countryOptions += `<option value="${c.code}">${c.name}</option>`; });
        app.innerHTML = `
            <div class="welcome-screen" style="text-align:center">
                <div class="header"><h1>🔬 Débutant Niveau 1 (Mode Conduite)</h1><p>Bienvenue Docteur !</p></div>
                <div class="input-group" style="margin-bottom:20px; text-align:left"><label>👤 Votre nom (facultatif) :</label><input type="text" id="userName" placeholder="Ex: Dr. Martin" value="${getUserName()}" style="width:100%; padding:12px; border-radius:10px"></div>
                <div class="input-group" style="margin-bottom:20px; text-align:left"><label>🌍 Votre pays (obligatoire) :</label><select id="userCountry" style="width:100%; padding:12px; border-radius:10px">${countryOptions}</select></div>
                <button class="start-quiz-btn" onclick="startQuiz()" style="background:#4caf50; color:white; border:none; padding:12px 25px; border-radius:30px; cursor:pointer">🚀 Commencer le quiz (mains libres)</button>
                <div class="note" style="margin-top:15px">🎙️ Mode conduite : l'IA lit tout, vous répondez à voix haute (A, B, C, D). Pas de timer.</div>
            </div>
        `;
        const savedCountry = getUserCountry();
        const countrySelect = document.getElementById("userCountry");
        if (countrySelect) countrySelect.value = savedCountry;
    }

    // ============================================
    // =========== 3. GITHUB SCORE ===============
    // ============================================
    async function sendScoreToGitHub(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Anonyme";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        const newScore = { nom: userName, pays: userCountry, score: score, maxScore: maxScore, percentage: percentage, levelId: "debutant1", date: new Date().toISOString() };
        const urlScores = "https://raw.githubusercontent.com/DrMaarakSaid/ETEO-scores/main/data/scores.json";
        const token = "TON_TOKEN_GITHUB";
        try {
            const response = await fetch(urlScores);
            let data = await response.json();
            if (!data.scores) data.scores = [];
            data.scores.push(newScore);
            data.scores.sort((a, b) => b.score - a.score);
            if (data.scores.length > 100) data.scores = data.scores.slice(0, 100);
            await fetch("https://api.github.com/repos/DrMaarakSaid/ETEO-scores/contents/data/scores.json", {
                method: "PUT", headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: `Ajout score ${score}/${maxScore} - ${userName}`, content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))) })
            });
            console.log("✅ Score envoyé !");
        } catch (error) { console.error("❌ Erreur :", error); }
    }

    // ============================================
    // =========== 4. QUESTIONS (25) =============
    // ============================================
    const questions = [
        { question: "Combien de racines a une molaire maxillaire typique ?", options: ["1", "2", "3", "4"], correct: 2, explanation: "Une molaire maxillaire typique possède 3 racines." },
        { question: "Quelle est la forme recommandée pour la cavité d'accès d'une incisive centrale maxillaire ?", options: ["Circulaire", "Triangulaire", "Ovale", "Carrée"], correct: 1, explanation: "La cavité d'accès est triangulaire." },
        { question: "Quel pourcentage d'incisives latérales mandibulaires présentent 2 canaux ?", options: ["25%", "35%", "44%", "55%"], correct: 2, explanation: "Environ 44% des incisives latérales mandibulaires ont deux canaux." },
        { question: "La pente d'un instrument endodontique ISO 0.02 signifie :", options: ["Augmentation de 0.2 mm par mm", "Augmentation de 0.02 mm par mm", "Augmentation de 0.02 mm par 2 mm", "Diminution"], correct: 1, explanation: "Une pente 0.02 = augmentation de 0.02 mm par mm." },
        { question: "Le plexus nerveux de Raschkow est situé dans quelle couche de la pulpe ?", options: ["Couche odontoblastique", "Couche acellulaire", "Couche cellulaire riche", "Noyau central"], correct: 2, explanation: "Le plexus de Raschkow se trouve dans la couche cellulaire riche." },
        { question: "Le symptôme le plus précoce d'une pulpe enflammée est :", options: ["Sensibilité thermique", "Douleur spontanée nocturne", "Douleur à la percussion", "Douleur à la palpation"], correct: 0, explanation: "La sensibilité au chaud/froid est le premier signe." },
        { question: "Une réponse thermique normale se caractérise par :", options: ["Douleur qui disparaît en 1-2 secondes", "Douleur qui persiste 15 secondes", "Absence de réponse", "Douleur pulsatile"], correct: 0, explanation: "Une pulpe saine répond par une douleur brève." },
        { question: "Une réponse thermique avec douleur persistante >15 secondes indique :", options: ["Pulpite réversible", "Pulpite irréversible", "Pulpe normale", "Hyperémie"], correct: 1, explanation: "Une douleur persistante signe une pulpite irréversible." },
        { question: "Le test de percussion renseigne sur :", options: ["La santé de la pulpe", "L'inflammation du desmodonte", "La profondeur de la carie", "Une fracture"], correct: 1, explanation: "La percussion évalue le ligament parodontal." },
        { question: "La pulpe dentaire est unique car :", options: ["Circulation collatérale abondante", "Entourée de tissu dur", "Pas de cellules sensorielles", "Se régénère complètement"], correct: 1, explanation: "La pulpe est enfermée dans des tissus durs." },
        { question: "Le produit actif dans l'Endo Ice est :", options: ["Azote liquide", "Dichlorodifluorométhane", "Oxyde nitreux", "Eau glacée"], correct: 1, explanation: "L'Endo Ice utilise du dichlorodifluorométhane." },
        { question: "Le pourcentage d'incisives centrales mandibulaires avec 2 canaux et 2 foramens est :", options: ["24%", "6%", "30%", "44%"], correct: 1, explanation: "Seulement 6% ont deux canaux distincts." },
        { question: "La deuxième prémolaire mandibulaire a le plus souvent :", options: ["1 canal, 1 foramen (86%)", "2 canaux, 2 foramens", "1 canal, 2 foramens", "2 canaux, 1 foramen"], correct: 0, explanation: "86% ont un canal unique." },
        { question: "Le concept de 'Patency' consiste à :", options: ["Élargir le foramen à #40", "Utiliser une petite lime pour confirmer la perméabilité", "Obturer le canal", "Isoler avec digue"], correct: 1, explanation: "La patency maintient le foramen perméable." },
        { question: "La longueur de travail se mesure idéalement à :", options: ["0.5-1.0 mm court de l'apex", "Exactement à l'apex", "1.0 mm au-delà", "2.0 mm court"], correct: 0, explanation: "La WL se situe 0.5-1 mm court de l'apex." },
        { question: "La gutta-percha contient principalement :", options: ["Latex", "Gutta-percha + oxyde de zinc", "Résine époxy", "Silicone"], correct: 1, explanation: "La gutta-percha est composée de trans-1,4-polyisoprène." },
        { question: "Une hyperhémie pulpaire est :", options: ["Réversible", "Nécrose totale", "Abcès apical", "Chronicité"], correct: 0, explanation: "L'hyperhémie est une inflammation réversible." },
        { question: "Un critère essentiel pour une pulpe saine est :", options: ["Réponse normale aux tests", "Absence de réponse", "Réponse uniquement au chaud", "Douleur à la percussion"], correct: 0, explanation: "Une pulpe saine répond normalement aux tests." },
        { question: "La zone de contrôle apical est :", options: ["Zone créée par l'endodontiste dans le tiers apical", "Zone naturelle coronaire", "Chambre pulpaire", "Collet"], correct: 0, explanation: "Zone intentionnellement façonnée par le clinicien." },
        { question: "L'ostéite condensante est :", options: ["Lésion radio-opaque réactionnelle", "Lésion radio-claire", "Kyste", "Tumeur"], correct: 0, explanation: "Réaction osseuse sclérotique à une inflammation." },
        { question: "Une cicatrice apicale se présente comme :", options: ["Radiolucence apicale sur dent bien traitée", "Radio-opacité", "Kyste", "Nécrose"], correct: 0, explanation: "Zone radiolucente persistante sur dent correctement traitée." },
        { question: "Un kyste latéro-radiculaire est d'origine :", options: ["Développementale", "Infectieuse", "Traumatique", "Inflammatoire"], correct: 0, explanation: "Lésion développementale, non inflammatoire." },
        { question: "Dans un kyste latéro-radiculaire, la dent est :", options: ["Vitale", "Non vitale", "Nécrosée", "Déchaussée"], correct: 0, explanation: "Associée à une dent vitale." },
        { question: "Le cémentome périapical :", options: ["N'affecte pas la vitalité pulpaire", "Nécessite toujours un traitement", "Est malin", "Est symptomatique"], correct: 0, explanation: "Lésion bénigne non associée à la nécrose." },
        { question: "La technique 'step-back' est :", options: ["Technique apico-coronaire", "Technique d'obturation", "Technique d'anesthésie", "Technique radiographique"], correct: 0, explanation: "Instrumentation de l'apex vers la couronne." }
    ];

    const MAX_SCORE = questions.length * 10;
    let currentQuestion = 0;
    let score = 0;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let currentOriginalCorrect = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("eteo_debutant1", JSON.stringify({ score: finalScore, maxScore, percentage, date: new Date().toISOString() }));
        return percentage;
    }

    function speakQuestionAndOptions(question, options, idx) {
        let text = `Question ${idx + 1} : ${question}. `;
        text += "Les options sont : ";
        options.forEach((opt, i) => {
            text += `${String.fromCharCode(65 + i)} : ${opt}. `;
        });
        text += "À vous de répondre. Dites A, B, C ou D.";
        speak(text, "fr-FR");
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);
        currentOriginalCorrect = q.correct;

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" style="display:none" data-idx="${idx}">${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header"><h1>🔬 Débutant Niveau 1 (Mode Conduite)</h1><p>Question ${currentQuestion + 1}/${questions.length}</p></div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Explication :</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                </div>
                <div class="score">🏆 Score actuel : ${score}/${MAX_SCORE}</div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandonner</button>
                </div>
            </div>
        `;

        answerLocked = false;

        setTimeout(() => {
            speakQuestionAndOptions(q.question, shuffledOptions, currentQuestion);
            listenForAnswer((lettre) => {
                if (lettre && !answerLocked) {
                    const idx = lettre.charCodeAt(0) - 65;
                    checkAnswer(idx);
                }
            });
        }, 500);
    }

    function checkAnswer(selectedIndex) {
        if (answerLocked) return;
        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);

        if (isCorrect) {
            score += 10;
            speak(`Bonne réponse ! +10 points. ${q.explanation}`, "fr-FR");
        } else {
            speak(`Mauvaise réponse. La bonne réponse était : ${shuffledOptions[currentCorrectIndex]}. ${q.explanation}`, "fr-FR");
        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Bonne réponse : ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        document.querySelector('.score').innerHTML = `🏆 Score actuel : ${score}/${MAX_SCORE}`;

        answerLocked = true;

        setTimeout(() => {
            if (currentQuestion + 1 < questions.length) {
                currentQuestion++;
                renderQuestion();
            } else {
                endQuiz();
            }
        }, 2000);
    }

    function endQuiz() {
        const percentage = (score / MAX_SCORE) * 100;
        saveScore(score, MAX_SCORE);
        sendScoreToGitHub(score, MAX_SCORE, percentage);
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 Quiz terminé !</h1>
                <div class="final-score">Score : ${score}/${MAX_SCORE}</div>
                <div>Pourcentage : ${percentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">${percentage>=60 ? '✅ Niveau Débutant 2 débloqué !' : '⚠️ Score insuffisant (minimum 60% requis)'}</div>
                <div><button class="share-btn" onclick="shareScore()">📤 Partager mon score</button><button class="feedback-btn" onclick="giveFeedback()">📝 Donner mon avis</button><button class="menu-btn" onclick="goToMenu()">🏠 Menu principal</button><button class="ranking-btn" onclick="goToRanking()">🏆 Classement mondial</button></div>
            </div>
        `;
    }

    function abandonQuiz() {
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("eteo_debutant1", JSON.stringify({ score, maxScore: MAX_SCORE, percentage: partialPercentage, date: new Date().toISOString(), abandoned: true }));
        sendScoreToGitHub(score, MAX_SCORE, partialPercentage);
        const app = document.getElementById('app');
        app.innerHTML = `<div class="result-container"><h1>❌ Quiz abandonné</h1><div class="final-score">Score partiel : ${score}/${MAX_SCORE}</div><div>Pourcentage : ${partialPercentage.toFixed(1)}%</div><div style="margin:20px 0;">🏆 Ce score a été enregistré dans le classement.</div><button class="menu-btn" onclick="goToMenu()">🏠 Retour au menu</button></div>`;
        speak(`Quiz abandonné. Score partiel : ${score} sur ${MAX_SCORE}.`, "fr-FR");
    }

    function shareScore() {
        const text = `🎓 ETEO - Endodontie\nMon score au niveau Débutant 1 : ${score}/${MAX_SCORE} (${((score/MAX_SCORE)*100).toFixed(1)}%)\nDéfie-moi sur ETEO !`;
        if (navigator.share) navigator.share({ title: 'ETEO Score', text });
        else { navigator.clipboard.writeText(text); alert("Score copié !"); }
    }
    function giveFeedback() { window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); }
    function goToMenu() { window.location.href = "menu_fr.html"; }

    function goToDashboard() {
        window.location.href = "../../../../classements_dashboard.html";
    }

    function goToRanking() { window.location.href = "../../../../classements_dashboard.html"; }

    function startQuiz() {
        saveUserInfo();
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
    }

    document.body.addEventListener('click', function firstClick() { activateVoice(); document.body.removeEventListener('click', firstClick); });
    showWelcomeScreen();
</script>
</body>
</html>
