<script>

    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",

    // ============================================
    // LEVEL_ID POUR CE QUIZ
    // ============================================
    const LEVEL_ID = "pedodontie_v1_debutant2_ru";

    // ============================================
    // =========== 1. ПРОДВИНУТАЯ ГОЛОСОВАЯ СИСТЕМА =====
    // ============================================
    
    let isSpeaking = false;
    let voiceReady = false;
    let voiceActivated = false;
    let lastAnswerCorrect = false;
    let lastCorrectAnswer = "";
    let lastPointsEarned = 0;

    // ============================================
    // 🔥 ФУНКЦИЯ : СБРОС ВСЕХ ГОЛОСОВЫХ КНОПОК
    // ============================================
    function resetAllVoiceButtons() {

        const qBtn = document.getElementById('voiceQuestionBtn');
        if (qBtn) {

            console.log("✅ voiceQuestionBtn реактивирован");
        }
        
        const fBtn = document.getElementById('voiceFeedbackBtn');
        if (fBtn) {
            fBtn.disabled = false;
            fBtn.textContent = '🔊 Повторить отзыв';
            console.log("✅ voiceFeedbackBtn реактивирован");
        }
        
        const eBtn = document.getElementById('voiceExplanationBtn');
        if (eBtn) {
            eBtn.disabled = false;
            eBtn.textContent = '🔊 Прочитать объяснение';
            console.log("✅ voiceExplanationBtn реактивирован");
        }
        
        const rBtn = document.getElementById('voiceResultBtn');
        if (rBtn) {

        }
        
        isSpeaking = false;
        updateVoiceIndicator('active');
        console.log("✅ Все голосовые кнопки АКТИВНЫ!");
    }

    // ============================================
    // 🔥 ФУНКЦИЯ : ОСТАНОВИТЬ РЕЧЬ
    // ============================================
    function stopSpeaking() {
        console.log("🔊 stopSpeaking() вызван");
        
        try {
            if (window.Capacitor?.Plugins?.TextToSpeech) {
                window.Capacitor.Plugins.TextToSpeech.stop();
                console.log("✅ Stop Android выполнен");
            }
        } catch(e) { console.log("⚠️ Ошибка остановки Android:", e); }
        
        try {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                console.log("✅ Web Speech stop выполнен");
            }
        } catch(e) { console.log("⚠️ Ошибка остановки Web Speech:", e); }
        
        isSpeaking = false;
        console.log("✅ isSpeaking сброшен на false");
        resetAllVoiceButtons();
    }

    // ============================================
    // 🔥 ФУНКЦИЯ : FALLBACK WEB SPEECH
    // ============================================
    function fallbackWebSpeech(text, lang, callback) {
        console.log("🔊 fallbackWebSpeech() вызван");
        
        if (!window.speechSynthesis) {
            console.error("❌ Web Speech недоступен");
            if (callback) callback();
            return;
        }
        
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            const voices = window.speechSynthesis.getVoices();
            const russianVoice = voices.find(v => v.lang.startsWith('ru'));
            if (russianVoice) utterance.voice = russianVoice;
            
            let callbackExecuted = false;
            
            const safeCallback = function() {
                if (!callbackExecuted) {
                    callbackExecuted = true;
                    console.log("✅ Web Speech callback выполнен");
                    if (callback) callback();
                }
            };
            
            utterance.onend = function() {
                console.log("✅ Web Speech завершён (onend)");
                safeCallback();
            };
            
            utterance.onerror = function(e) {
                console.error("❌ Ошибка Web Speech:", e);
                safeCallback();
            };
            
            window.speechSynthesis.speak(utterance);
            
            setTimeout(function() {
                if (!callbackExecuted) {
                    console.warn("⚠️ TIMEOUT Web Speech - Принудительный callback");
                    safeCallback();
                }
            }, 5000);
            
        } catch (error) {
            console.error("❌ Ошибка в fallbackWebSpeech:", error);
            if (callback) callback();
        }
    }

    // ============================================
    // 🔥 ФУНКЦИЯ : SPEAK (с Capacitor + Web Speech)
    // ============================================
    function speak(text, lang, callback) {
        console.log("🔊 speak() вызван с текстом:", text.substring(0, 50) + '...');
        
        if (!text) { 
            console.log("⚠️ Пустой текст, немедленный callback");
            if (callback) callback(); 
            return; 
        }
        
        const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
        
        let callbackExecuted = false;
        
        const safeCallback = function() {
            if (!callbackExecuted) {
                callbackExecuted = true;
                console.log("✅ safeCallback() выполнен");
                isSpeaking = false;
                if (callback) callback();
            }
        };
        
        try {
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("🔊 Использование Capacitor TTS на Android");
                const TTS = window.Capacitor.Plugins.TextToSpeech;
                
                TTS.speak({ 
                    text: text, 
                    lang: lang || 'ru-RU', 
                    rate: 0.9, 
                    pitch: 1.0, 
                    volume: 1.0 
                }).then(() => {
                    console.log("✅ Capacitor TTS завершён");
                    setTimeout(safeCallback, 300);
                }).catch((error) => {
                    console.error("❌ Ошибка Capacitor TTS:", error);
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback на Web Speech");
                        fallbackWebSpeech(text, lang, safeCallback);
                    } else {
                        safeCallback();
                    }
                });
                
                setTimeout(function() {
                    if (!callbackExecuted) {
                        console.warn("⚠️ TIMEOUT Capacitor TTS - Принудительный callback");
                        safeCallback();
                    }
                }, 5000);
                
            } else if (window.speechSynthesis) {
                console.log("🔊 Использование Web Speech API");
                fallbackWebSpeech(text, lang, safeCallback);
            } else {
                console.error("❌ Нет доступного TTS движка");
                safeCallback();
            }
        } catch (error) {
            console.error("❌ ОШИБКА в speak():", error);
            safeCallback();
        }
    }

    // ============================================
    // 🔥 АКТИВАЦИЯ ГОЛОСА
    // ============================================
    function activateVoice() {
        console.log("🔊 activateVoice() вызван");
        if (!voiceActivated) {
            const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
            console.log("🔊 isAndroid =", isAndroid);
            
            if (isAndroid) {

    function updateVoiceIndicator(status) {
        const indicator = document.getElementById('voiceIndicator');
        if (indicator) {
            if (status === 'active') {
                indicator.textContent = '🎙️ ИИ активен';
                indicator.className = 'voice-indicator active';
            } else if (status === 'speaking') {
                indicator.textContent = '🎙️ Говорит...';
                indicator.className = 'voice-indicator speaking';
            } else {
                indicator.textContent = '🔇 ИИ неактивен';
                indicator.className = 'voice-indicator inactive';
            }
        }
    }

        stopSpeaking();
        
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        const isUnlocked = percentage >= 60;
        let text = `Ваш итоговый результат: ${score} из ${MAX_SCORE_WITH_BONUS}, что составляет ${percentage.toFixed(1)} процентов. `;
        if (isUnlocked) {

    function attachVoiceEvents() {
        const voiceBtn = document.getElementById('voiceQuestionBtn');
        if (voiceBtn) {
            const newVoiceBtn = voiceBtn.cloneNode(true);
            voiceBtn.parentNode.replaceChild(newVoiceBtn, voiceBtn);
            newVoiceBtn.addEventListener('click', speakQuestionOnly);
            console.log("✅ Событие привязано для voiceQuestionBtn");
        }
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn && explBtn.style.display !== 'none') {
            const newExplBtn = explBtn.cloneNode(true);
            explBtn.parentNode.replaceChild(newExplBtn, explBtn);
            newExplBtn.addEventListener('click', speakExplanation);
            console.log("✅ Событие привязано для voiceExplanationBtn");
        }
    }

    async function sendScoreToFirebase(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        
        const scoreData = {
            nom: userName,
            pays: userCountry,
            score: score,
            maxScore: maxScore,
            percentage: percentage,
            levelId: LEVEL_ID,
            date: new Date().toISOString(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection('scores').add(scoreData);
            console.log("✅ Результат отправлен в Firebase!");
            return true;
        } catch (error) {
            console.error("❌ Ошибка Firebase:", error);
            return false;
        }
    }

    // ============================================
    // =========== MAX SCORE =============
    // ============================================
    const MAX_SCORE_BASE = questions.length * 10;
    const MAX_SCORE_WITH_BONUS = questions.length * 15;
    
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("pedodontie_v1_debutant2_ru", JSON.stringify({ 
            score: finalScore, 
            maxScore: maxScore,
            percentage: percentage,
            date: new Date().toISOString() 
        }));
        return percentage;
    }

    // ============================================
    // =========== UNLOCK LEVEL 3 ============
    // ============================================
    function unlockLevel3(percentage) {
        const SEUIL_DEBLOCAGE = 60;
        
        if (percentage >= SEUIL_DEBLOCAGE) {
            localStorage.setItem("pedodontie_v1_intermediaire1_ru_unlocked", "true");
            localStorage.setItem("pedodontie_v1_debutant2_ru_score", percentage.toFixed(1));
            console.log("✅ Уровень Средний 1 РАЗБЛОКИРОВАН! Результат: " + percentage.toFixed(1) + "%");
            return true;
        } else {
            localStorage.setItem("pedodontie_v1_intermediaire1_ru_unlocked", "false");
            console.log("❌ Уровень Средний 1 ЗАБЛОКИРОВАН. Результат: " + percentage.toFixed(1) + "% (мин " + SEUIL_DEBLOCAGE + "%)");
            return false;
        }
    }

    // ================================================================
    // 🔥 СОХРАНЕНИЕ ВАЛИДАЦИИ ДЛЯ PROGRESSION.HTML
    // ================================================================
    function sauvegarderValidation(specialite, niveau, score, total) {
        const percentage = (score / total) * 100;
        
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: specialite,
                niveau: niveau,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progressionData = JSON.parse(localStorage.getItem('eteo_progression') || '{}');
            const key = specialite + '_' + niveau;
            progressionData[key] = true;
            localStorage.setItem('eteo_progression', JSON.stringify(progressionData));
            
            console.log('✅ Валидация сохранена для progression.html');
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    // ============================================
    // =========== RENDER QUESTION ================
    // ============================================
    function renderQuestion() {
        console.log("🔍 renderQuestion() - Вопрос", currentQuestion + 1);
        isSpeaking = false;
        
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${letter}. ${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header"><h1>👶 Детская стоматология - Начальный уровень 2</h1><p>Вопрос ${currentQuestion + 1}/${questions.length}</p></div>

        attachVoiceEvents();

    // ============================================
    // =========== CHECK ANSWER ===================
    // ============================================
    function checkAnswer(selectedIndex) {
        console.log("🔍 checkAnswer() - Опция", String.fromCharCode(65 + selectedIndex));
        
        stopSpeaking();
        
        if (answerLocked) {
            console.log("⏳ Ответ уже заблокирован");
            return;
        }

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        lastAnswerCorrect = isCorrect;
        lastCorrectAnswer = shuffledOptions[currentCorrectIndex];
        lastPointsEarned = pointsEarned;

        if (isCorrect) {
            score += pointsEarned;
            console.log("✅ Правильный ответ! +", pointsEarned, "баллов");
        } else {
            console.log("❌ Неправильный ответ. Правильный ответ:", shuffledOptions[currentCorrectIndex]);
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        const feedbackContainer = document.getElementById('feedbackContainer');
        if (feedbackContainer) {
            const feedbackClass = isCorrect ? 'feedback-container' : 'feedback-container wrong';
            feedbackContainer.style.display = 'block';
            feedbackContainer.className = feedbackClass;
            
            let pointsDisplay = '';
            if (isCorrect) {
                pointsDisplay = `<span class="points-badge correct">+${pointsEarned} баллов</span>`;
            } else {
                pointsDisplay = `<span class="points-badge wrong">(0 баллов)</span>`;
            }
            
            feedbackContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        ${isCorrect ? '✅ Правильный ответ!' : '❌ Неправильный ответ'}
                        ${pointsDisplay}
                    </div>
                    <button class="voice-btn feedback-btn-style" id="voiceFeedbackBtn">🔊 Повторить отзыв</button>
                </div>
            `;
            
            const feedbackBtn = document.getElementById('voiceFeedbackBtn');
            if (feedbackBtn) {
                const newFeedbackBtn = feedbackBtn.cloneNode(true);
                feedbackBtn.parentNode.replaceChild(newFeedbackBtn, feedbackBtn);
                newFeedbackBtn.addEventListener('click', speakFeedback);
                console.log("✅ Событие привязано для voiceFeedbackBtn");
            }
        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Правильный ответ: ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn) {
            explBtn.style.display = 'inline-block';
            attachVoiceEvents();
        }
        
        document.querySelector('.score').innerHTML = `🏆 Текущий балл: ${score}/${MAX_SCORE_WITH_BONUS}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
        
        let feedbackText = "";
        if (isCorrect) {
            feedbackText = `Правильный ответ! +${pointsEarned} баллов.`;
        } else {
            feedbackText = `Неправильный ответ. Правильный ответ: ${shuffledOptions[currentCorrectIndex]}.`;
        }
        
        console.log("🔊 Авто-чтение отзыва");
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(feedbackText, "ru-RU", function() {
            console.log("✅ Авто-отзыв завершён");
        });
    }

    // ============================================
    // =========== loadRankingInModal ============
    // ============================================
    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 Пока нет результатов для этого уровня.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Ваше место</div>
                        <div class="rank-number">${userRank}${userRank === 1 ? ' место' : userRank === 2 ? ' место' : userRank === 3 ? ' место' : ' место'}</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} баллов (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Вы ещё не в рейтинге этого уровня</div>
                        <div>Пройдите викторину, чтобы появиться!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 ТОП 20 - Детская стоматология Начальный 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Аноним"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Ошибка Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Не удалось загрузить рейтинг.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Неизвестная ошибка'}</span></div>`;
        }
    }

    // ============================================
    // =========== POPUP BETA - ОПЦИЯ 2 (RU) =====
    // ============================================
    function openBetaEvaluationPopup() {
        if (document.getElementById('betaPopup')) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Доктор";
        
        const modal = document.createElement('div');
        modal.id = 'betaPopup';
        modal.className = 'beta-popup-overlay';
        modal.innerHTML = `
            <div class="beta-popup-content">
                <div class="big-icon">🎉🏆🎉</div>
                <h2>Поздравляем ${userName}!</h2>
                <p>Вы успешно прошли <strong>оба начальных уровня</strong>.<br>Какой впечатляющий путь!</p>
                
                <div style="margin: 25px 0;">
                    <p style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">🌟 Оцените БЕТА-версию 🌟</p>
                    <div class="stars" id="starRating">
                        <span data-rating="1" style="color: #ccc;">☆</span>
                        <span data-rating="2" style="color: #ccc;">☆</span>
                        <span data-rating="3" style="color: #ccc;">☆</span>
                        <span data-rating="4" style="color: #ccc;">☆</span>
                        <span data-rating="5" style="color: #ccc;">☆</span>
                    </div>
                    <p class="rating-message" id="ratingMessage"></p>
                </div>
                
                <div class="beta-info">
                    <p>🚀 <strong>Продолжение (Средний и Эксперт)</strong> появится после <strong>6 месяцев оценки</strong> этой Бета-версии.<br><br>
                    Ваше мнение помогает нам улучшать ETEO. Спасибо за доверие, <strong>${userName}</strong>!</p>
                </div>
                
                <button class="beta-btn" onclick="closeBetaPopup()">Вернуться в меню</button>
            </div>
        `;
        
        document.body.appendChild(modal);
        
        // ✅ ОПЦИЯ 2 : Полное голосовое чтение сообщения (на русском)
        stopSpeaking();
        
        setTimeout(() => {
            const fullMessage = `Поздравляем ${userName}! Вы успешно прошли оба начальных уровня. ` +
                               `Пожалуйста, оцените БЕТА-версию, нажав на звёздочки. ` +
                               `Продолжение, включая Средний и Эксперт уровни, появится через шесть месяцев оценки. ` +
                               `Спасибо за ваше доверие.`;
            
            isSpeaking = true;
            updateVoiceIndicator('speaking');
            speak(fullMessage, "ru-RU", function() {
                console.log("✅ Сообщение поп-апа БЕТА прочитано автоматически");
                isSpeaking = false;
                updateVoiceIndicator('active');
            });
        }, 600);
        
        // Управление звёздами
        const stars = modal.querySelectorAll('#starRating span');
        stars.forEach(function(star) {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                sendBetaEvaluation(rating);
                
                stars.forEach(function(s, idx) {
                    if (idx < rating) {
                        s.innerHTML = '★';
                        s.style.color = '#ffc107';
                    } else {
                        s.innerHTML = '☆';
                        s.style.color = '#ccc';
                    }
                });
                
                const messageDiv = document.getElementById('ratingMessage');
                messageDiv.innerHTML = '✅ Спасибо за вашу оценку! Ваше мнение сохранено.';
                messageDiv.style.color = '#4caf50';
                messageDiv.style.fontWeight = 'bold';
                
                // ✅ Голосовое подтверждение оценки (на русском)
                const confirmationMessage = `Спасибо за вашу оценку ${rating} из 5. Ваше мнение сохранено.`;
                
                stopSpeaking();
                isSpeaking = true;
                updateVoiceIndicator('speaking');
                speak(confirmationMessage, "ru-RU", function() {
                    console.log("✅ Подтверждение оценки прочитано");
                    isSpeaking = false;
                    updateVoiceIndicator('active');
                });
            });
        });
    }

    function closeBetaPopup() {
        var modal = document.getElementById('betaPopup');
        if (modal) modal.remove();
        goToMenu();
    }

    async function sendBetaEvaluation(rating) {
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        
        try {
            await db.collection('evaluations_beta').add({
                nom: userName,
                pays: userCountry,
                note: rating,
                langue: 'ru',
                nivel: 'debutant2',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("✅ Оценка Бета отправлена!");
        } catch (error) {
            console.error("❌ Ошибка оценки Бета:", error);
        }
    }

    // ============================================
    // =========== AUTRES FONCTIONS ===============
    // ============================================
    function abandonQuiz() {
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        localStorage.setItem("pedodontie_v1_debutant2_ru", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE_WITH_BONUS, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel3(partialPercentage);
        
        sauvegarderValidation('Pedodontics', 'debutant2', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>❌ Викторина прервана</h1>
                <div class="final-score">Частичный балл: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div>Процент: ${partialPercentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">🏆 Этот результат сохранён в рейтинге.</div>
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Вернуться в меню</button>
                    <button class="btn-progression" onclick="goToProgression()">📊 Моя прогрессия</button>
                </div>
            </div>
        `;
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        const text = `🎓 ETEO - Детская стоматология\nМой результат на уровне Начальный 2: ${score}/${MAX_SCORE_WITH_BONUS} (${percentage.toFixed(1)}%)\nПопробуй побить мой рекорд на ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Результат', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Результат скопирован в буфер обмена!");
            }).catch(() => {
                alert("📋 Для публикации скопируйте этот текст:\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        console.log("🚀 startQuiz() вызван");
        saveUserInfo();
        console.log("🔊 Активация голоса...");
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
        console.log("✅ Викторина запущена");
    }

    // ============================================
    // =========== INITIALIZATION =================
    // ============================================
    console.log("🚀 Страница загружена - ETEO Quiz Детская стоматология (RU) - Начальный 2");
    console.log("📱 window.Capacitor =", window.Capacitor);
    
    if (window.Capacitor) {
        console.log("📱 Платформа =", window.Capacitor.getPlatform());
        console.log("📱 Плагины =", Object.keys(window.Capacitor.Plugins || {}));
    }
    
    document.body.addEventListener('click', function firstClick() { 
        console.log("🖱️ Первый клик - Активация голоса");
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
