<script>

    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",

    // ============================================
    // LEVEL_ID POUR CE QUIZ
    // ============================================

    // ============================================
    // =========== 1. VOICE SYSTEM ================
    // ============================================
    
    let isSpeaking = false;
    let voiceReady = false;
    let voiceActivated = false;
    let lastAnswerCorrect = false;
    let lastCorrectAnswer = "";
    let lastPointsEarned = 0;

    // ============================================
    // 🔥 FUNCTION: RESET ALL VOICE BUTTONS
    // ============================================
    function resetAllVoiceButtons() {
        console.log("🔄 resetAllVoiceButtons() - Reactivating ALL buttons");
        
        // ✅ Button "Read question"
        const qBtn = document.getElementById('voiceQuestionBtn');
        if (qBtn) {
            qBtn.disabled = false;
            qBtn.textContent = '🔊 Read question';
            console.log("✅ voiceQuestionBtn reactivated");
        }
        
        // ✅ Button "Re-listen to feedback"
        const fBtn = document.getElementById('voiceFeedbackBtn');
        if (fBtn) {
            fBtn.disabled = false;
            fBtn.textContent = '🔊 Re-listen to feedback';
            console.log("✅ voiceFeedbackBtn reactivated");
        }
        
        // ✅ Button "Read explanation"
        const eBtn = document.getElementById('voiceExplanationBtn');
        if (eBtn) {
            eBtn.disabled = false;
            eBtn.textContent = '🔊 Read explanation';
            console.log("✅ voiceExplanationBtn reactivated");
        }
        
        // ✅ Button "Listen to your result"
        const rBtn = document.getElementById('voiceResultBtn');
        if (rBtn) {
            rBtn.disabled = false;
            rBtn.textContent = '🔊 Listen to your result';
            console.log("✅ voiceResultBtn reactivated");
        }
        
        // ✅ Reset isSpeaking
        isSpeaking = false;
        
        // ✅ Update indicator
        updateVoiceIndicator('active');
        
        console.log("✅ All voice buttons are now ACTIVE!");
    }

    // ============================================
    // 🔥 FUNCTION: STOP SPEAKING
    // ============================================
    function stopSpeaking() {
        console.log("🔊 stopSpeaking() called");
        
        // ✅ STOP on Android (Capacitor)
        try {
            if (window.Capacitor?.Plugins?.TextToSpeech) {
                window.Capacitor.Plugins.TextToSpeech.stop();
                console.log("✅ Android stop successful");
            }
        } catch(e) { console.log("⚠️ Android stop error:", e); }
        
        // ✅ STOP on PC (Web Speech)
        try {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                console.log("✅ Web Speech stop successful");
            }
        } catch(e) { console.log("⚠️ Web Speech stop error:", e); }
        
        // ✅ Reset isSpeaking
        isSpeaking = false;
        console.log("✅ isSpeaking reset to false");
        
        // ✅ 🔥 REACTIVATE ALL BUTTONS IMMEDIATELY
        resetAllVoiceButtons();
    }

    // ============================================
    // 🔥 FUNCTION: FALLBACK WEB SPEECH
    // ============================================
    function fallbackWebSpeech(text, lang, callback) {
        console.log("🔊 fallbackWebSpeech() called");
        
        if (!window.speechSynthesis) {
            console.error("❌ Web Speech not available");
            if (callback) callback();
            return;
        }
        
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            const voices = window.speechSynthesis.getVoices();
            const englishVoice = voices.find(v => v.lang.startsWith('en'));
            if (englishVoice) utterance.voice = englishVoice;
            
            let callbackExecuted = false;
            
            const safeCallback = function() {
                if (!callbackExecuted) {
                    callbackExecuted = true;
                    console.log("✅ Web Speech callback executed");
                    if (callback) callback();
                }
            };
            
            utterance.onend = function() {
                console.log("✅ Web Speech finished (onend)");
                safeCallback();
            };
            
            utterance.onerror = function(e) {
                console.error("❌ Web Speech error:", e);
                safeCallback();
            };
            
            window.speechSynthesis.speak(utterance);
            
            // ✅ SAFETY TIMEOUT (5 seconds max)
            setTimeout(function() {
                if (!callbackExecuted) {
                    console.warn("⚠️ Web Speech TIMEOUT - Forcing callback");
                    safeCallback();
                }
            }, 5000);
            
        } catch (error) {
            console.error("❌ Error in fallbackWebSpeech:", error);
            if (callback) callback();
        }
    }

    // ============================================
    // 🔥 FUNCTION: SPEAK (Capacitor + Web Speech)
    // ============================================
    function speak(text, lang, callback) {
        console.log("🔊 speak() called with:", text.substring(0, 50) + '...');
        
        if (!text) { 
            console.log("⚠️ Empty text, immediate callback");
            if (callback) callback(); 
            return; 
        }
        
        // ✅ DETECT ANDROID VIA CAPACITOR
        const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
        
        let callbackExecuted = false;
        
        // ✅ SAFETY FUNCTION FOR FORCED CALLBACK
        const safeCallback = function() {
            if (!callbackExecuted) {
                callbackExecuted = true;
                console.log("✅ safeCallback() executed");
                isSpeaking = false;
                if (callback) callback();
            }
        };
        
        try {
            // ✅ PRIORITY: CAPACITOR TTS ON ANDROID
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("🔊 Using Capacitor TTS plugin on Android");
                const TTS = window.Capacitor.Plugins.TextToSpeech;
                
                TTS.speak({ 
                    text: text, 
                    lang: lang || 'en-US', 
                    rate: 0.9, 
                    pitch: 1.0, 
                    volume: 1.0 
                }).then(() => {
                    console.log("✅ Capacitor TTS finished");
                    setTimeout(safeCallback, 300);
                }).catch((error) => {
                    console.error("❌ Capacitor TTS error:", error);
                    // ✅ Fallback to Web Speech on error
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback to Web Speech");
                        fallbackWebSpeech(text, lang, safeCallback);
                    } else {
                        safeCallback();
                    }
                });
                
                // ✅ SAFETY TIMEOUT (5 seconds max)
                setTimeout(function() {
                    if (!callbackExecuted) {
                        console.warn("⚠️ Capacitor TTS TIMEOUT - Forcing callback");
                        safeCallback();
                    }
                }, 5000);
                
            } else if (window.speechSynthesis) {
                console.log("🔊 Using Web Speech API");
                fallbackWebSpeech(text, lang, safeCallback);
                
            } else {
                console.error("❌ No TTS engine available");
                safeCallback();
            }
        } catch (error) {
            console.error("❌ ERROR in speak():", error);
            safeCallback();
        }
    }

    // ============================================
    // 🔥 ACTIVATE VOICE
    // ============================================
    function activateVoice() {
        console.log("🔊 activateVoice() called");
        if (!voiceActivated) {
            const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
            console.log("🔊 isAndroid =", isAndroid);
            
            if (isAndroid) {
                if (window.Capacitor?.Plugins?.TextToSpeech) {
                    console.log("✅ Capacitor TTS available on Android");
                    voiceReady = true;
                    voiceActivated = true;
                    updateVoiceIndicator('active');
                } else {
                    console.warn("⚠️ Capacitor TTS not found on Android");
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback to Web Speech");
                        voiceReady = true;
                        voiceActivated = true;
                        window.speechSynthesis.getVoices();
                        updateVoiceIndicator('active');
                    }
                }
            } else {
                if (window.speechSynthesis) {
                    console.log("✅ Web Speech available on PC");
                    voiceReady = true;
                    voiceActivated = true;
                    window.speechSynthesis.getVoices();
                    updateVoiceIndicator('active');
                }
            }
            console.log("✅ Voice activated, voiceReady =", voiceReady);
        } else {
            console.log("ℹ️ Voice already activated");
        }
    }

    function updateVoiceIndicator(status) {
        const indicator = document.getElementById('voiceIndicator');
        if (indicator) {
            if (status === 'active') {
                indicator.textContent = '🎙️ AI active';
                indicator.className = 'voice-indicator active';
            } else if (status === 'speaking') {
                indicator.textContent = '🎙️ Speaking...';
                indicator.className = 'voice-indicator speaking';
            } else {
                indicator.textContent = '🔇 AI inactive';
                indicator.className = 'voice-indicator inactive';
            }
        }
    }

    // ============================================
    // =========== VOICE FUNCTIONS ================
    // ============================================
    
    function speakQuestionOnly() {
        console.log("🔊 speakQuestionOnly() called");
        
        // ✅ 1. STOP any ongoing reading
        stopSpeaking();
        
        const q = questions[currentQuestion];
        const text = `Question ${currentQuestion + 1} of ${questions.length}: ${q.question}`;

        // ✅ 3. START SPEAKING

            console.log("✅ speakFeedback() finished");

    function speakExplanation() {
        console.log("🔊 speakExplanation() called");

            [array[i], array[j]] = [array[j], array[i]];

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

        lastAnswerCorrect = false;
        lastCorrectAnswer = "";
        lastPointsEarned = 0;
        
        // ✅ Auto-read question after 500ms
        setTimeout(() => {
            speakQuestionOnly();
        }, 500);
    }

    // ============================================
    // =========== ATTACH VOICE EVENTS ============
    // ============================================
    function attachVoiceEvents() {
        // ✅ Button "Read question"
        const voiceBtn = document.getElementById('voiceQuestionBtn');
        if (voiceBtn) {
            const newVoiceBtn = voiceBtn.cloneNode(true);
            voiceBtn.parentNode.replaceChild(newVoiceBtn, voiceBtn);
            newVoiceBtn.addEventListener('click', speakQuestionOnly);
            console.log("✅ Event attached to voiceQuestionBtn");
        }
        
        // ✅ Button "Read explanation" (if visible)
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn && explBtn.style.display !== 'none') {
            const newExplBtn = explBtn.cloneNode(true);
            explBtn.parentNode.replaceChild(newExplBtn, explBtn);
            newExplBtn.addEventListener('click', speakExplanation);
            console.log("✅ Event attached to voiceExplanationBtn");
        }
    }

    // ============================================
    // =========== CHECK ANSWER ===================
    // ============================================
    function checkAnswer(selectedIndex) {
        console.log("🔍 checkAnswer() - Option", String.fromCharCode(65 + selectedIndex));
        
        // ✅ STOP reading
        stopSpeaking();
        
        if (answerLocked) {
            console.log("⏳ Answer already locked");
            return;
        }

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        lastAnswerCorrect = isCorrect;
        lastCorrectAnswer = shuffledOptions[currentCorrectIndex];
        lastPointsEarned = pointsEarned;

        if (isCorrect) {
            score += pointsEarned;
            console.log("✅ Correct answer! +", pointsEarned, "points");
        } else {
            console.log("❌ Wrong answer. Correct answer:", shuffledOptions[currentCorrectIndex]);
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        const feedbackContainer = document.getElementById('feedbackContainer');
        if (feedbackContainer) {
            const feedbackClass = isCorrect ? 'feedback-container' : 'feedback-container wrong';
            feedbackContainer.style.display = 'block';
            feedbackContainer.className = feedbackClass;
            
            let pointsDisplay = '';
            if (isCorrect) {
                pointsDisplay = `<span class="points-badge correct">+${pointsEarned} points</span>`;
            } else {
                pointsDisplay = `<span class="points-badge wrong">(0 points)</span>`;
            }
            
            feedbackContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        ${isCorrect ? '✅ Correct answer!' : '❌ Wrong answer'}
                        ${pointsDisplay}
                    </div>
                    <button class="voice-btn feedback-btn-style" id="voiceFeedbackBtn">🔊 Re-listen to feedback</button>
                </div>
            `;
            
            // ✅ Attach event for feedback button
            const feedbackBtn = document.getElementById('voiceFeedbackBtn');
            if (feedbackBtn) {
                const newFeedbackBtn = feedbackBtn.cloneNode(true);
                feedbackBtn.parentNode.replaceChild(newFeedbackBtn, feedbackBtn);
                newFeedbackBtn.addEventListener('click', speakFeedback);
                console.log("✅ Event attached to voiceFeedbackBtn");
            }
        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Correct answer: ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn) {
            explBtn.style.display = 'inline-block';
            attachVoiceEvents();
        }
        
        document.querySelector('.score').innerHTML = `🏆 Current score: ${score}/${MAX_SCORE_WITH_BONUS}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
        
        // ✅ AUTO-READ FEEDBACK
        let feedbackText = "";
        if (isCorrect) {
            feedbackText = `Correct answer! +${pointsEarned} points.`;
        } else {
            feedbackText = `Wrong answer. The correct answer was: ${shuffledOptions[currentCorrectIndex]}.`;
        }
        
        console.log("🔊 Auto-reading feedback");
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(feedbackText, "en-US", function() {
            console.log("✅ Auto-feedback finished");
        });
    }

    // ============================================
    // =========== NEXT QUESTION ==================
    // ============================================
    function nextQuestion() {
        console.log("🔍 nextQuestion() called");
        
        // ✅ STOP reading
        stopSpeaking();
        
        if (!answerLocked) {
            console.log("⚠️ Please answer before continuing");
            return;
        }
        currentQuestion++;
        timeLeft = 30;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    // ============================================
    // =========== NAVIGATION =====================
    // ============================================
    
    function goToMenu() {
        window.location.href = "menu_en.html?t=" + Date.now();
    }

    function goToDashboard() {
        window.location.href = "../../../../classements_dashboard.html";
    }

    function goToRanking() {
        goToDashboard();
    }

    // ============================================
    // =========== endQuiz ========================
    // ============================================
    function endQuiz() {
        console.log("🔍 endQuiz() called");
        
        // ✅ STOP reading
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        
        saveScore(score, MAX_SCORE_WITH_BONUS);
        
        const isUnlocked = unlockLevel2(percentage);
        
        sauvegarderValidation('Prosthodontics', 'debutant1', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 Quiz completed!</h1>
                <div class="final-score">Score: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Percentage: <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${isUnlocked ? 
                        '<div class="unlock-badge">✅ Beginner Level 2 unlocked! 🎊</div>' : 
                        '<div class="locked-badge">⚠️ Insufficient score (minimum 60% required to unlock the next level)</div>'}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${isUnlocked ? 
                        '📚 Go to the menu to access Level 2.' : 
                        `💪 You need ${(60 - percentage).toFixed(1)}% more to unlock Level 2. Try again!`}
                </div>
                
                <div class="voice-btn-row">
                    <button class="voice-btn result-btn-style" id="voiceResultBtn">🔊 Listen to your result</button>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0;">
                    <button class="share-btn" onclick="shareScore()">📤 Share my score</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Give feedback</button>
                    <button class="ranking-btn" onclick="goToDashboard()">🏆 World ranking</button>
                </div>
                
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Main menu</button>
                    <button class="btn-progression" onclick="goToProgression()">📊 Check my progression</button>
                </div>
            </div>
        `;
        
        // ✅ Attach event for result button
        const resultBtn = document.getElementById('voiceResultBtn');
        if (resultBtn) {
            const newResultBtn = resultBtn.cloneNode(true);
            resultBtn.parentNode.replaceChild(newResultBtn, resultBtn);
            newResultBtn.addEventListener('click', speakFinalResult);
            console.log("✅ Event attached to voiceResultBtn");
        }
        
        // Auto-read result after 1 second
        setTimeout(() => {
            speakFinalResult();
        }, 1000);
        
        setTimeout(() => {
            openRankingModal();
        }, 2000);
    }

    // ============================================
    // =========== POPUP RANKING MODAL ============
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    // ============================================
    // =========== loadRankingInModal ============
    // ============================================
    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anonymous";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 No scores recorded for this level yet.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Your ranking</div>
                        <div class="rank-number">${userRank}e position</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} points (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 You are not yet in the ranking for this level</div>
                        <div>Take the quiz to appear!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 TOP 20 - Prosthodontics Beginner 1</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anonymous"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 No scores for this level</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Firestore error:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Unable to load ranking.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Unknown error'}</span></div>`;
        }
    }

    function abandonQuiz() {
        // ✅ STOP reading
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        localStorage.setItem("prothese_v1_debutant1_en", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE_WITH_BONUS, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel2(partialPercentage);
        sauvegarderValidation('Prosthodontics', 'debutant1', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>❌ Quiz abandoned</h1>
                <div class="final-score">Partial score: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div>Percentage: ${partialPercentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">🏆 This score has been recorded in the ranking.</div>
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Back to menu</button>
                    <button class="btn-progression" onclick="goToProgression()">📊 My progression</button>
                </div>
            </div>
        `;
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        const text = `🎓 ETEO - Prosthodontics Beginner 1\nMy score: ${score}/${MAX_SCORE_WITH_BONUS} (${percentage.toFixed(1)}%)\nChallenge me on ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Score', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Score copied to clipboard!");
            }).catch(() => {
                alert("📋 To share, copy this text:\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        console.log("🚀 startQuiz() called");
        saveUserInfo();
        console.log("🔊 Activating voice...");
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
        console.log("✅ Quiz started");
    }

    // ============================================
    // =========== INITIALIZATION ==================
    // ============================================
    console.log("🚀 Page loaded - ETEO Quiz Prosthodontics (EN)");
    console.log("📱 window.Capacitor =", window.Capacitor);
    
    if (window.Capacitor) {
        console.log("📱 Platform =", window.Capacitor.getPlatform());
        console.log("📱 Plugins =", Object.keys(window.Capacitor.Plugins || {}));
    }
    
    document.body.addEventListener('click', function firstClick() { 
        console.log("🖱️ First click - Activating voice");
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
