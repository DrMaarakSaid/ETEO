<body>

<div class="voice-indicator inactive" id="voiceIndicator">🔇 IA inactiva</div>

<div class="container" id="app"></div>

<!-- Modal de clasificación -->
<div id="rankingModal">

    </div>

<script>
    // ============================================
    // =========== CONFIGURACIÓN FIREBASE =========
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",
        projectId: "eteo-endo-to-every-one",
        storageBucket: "eteo-endo-to-every-one.firebasestorage.app",
        messagingSenderId: "511524282020",
        appId: "1:511524282020:web:5a25c021fd84f026969031"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================
    // LEVEL_ID PARA ESTE QUIZ
    // ============================================
    const LEVEL_ID = "materiaux_dentaires_v1_debutant1_es";

    // ============================================
    // =========== 1. SISTEMA DE VOZ ==============
    // ============================================
    
    let isSpeaking = false;
    let voiceReady = false;
    let voiceActivated = false;
    let lastAnswerCorrect = false;
    let lastCorrectAnswer = "";
    let lastPointsEarned = 0;

    // ============================================
    // 🔥 FUNCIÓN: REACTIVAR TODOS LOS BOTONES
    // ============================================
    function resetAllVoiceButtons() {
        console.log("🔄 resetAllVoiceButtons() - Reactivando TODOS los botones");
        
        const qBtn = document.getElementById('voiceQuestionBtn');
        if (qBtn) {
            qBtn.disabled = false;
            qBtn.textContent = '🔊 Leer pregunta';
            console.log("✅ voiceQuestionBtn reactivado");
        }
        
        const fBtn = document.getElementById('voiceFeedbackBtn');
        if (fBtn) {
            fBtn.disabled = false;
            fBtn.textContent = '🔊 Re-escuchar retroalimentación';
            console.log("✅ voiceFeedbackBtn reactivado");
        }
        
        const eBtn = document.getElementById('voiceExplanationBtn');
        if (eBtn) {
            eBtn.disabled = false;
            eBtn.textContent = '🔊 Leer explicación';
            console.log("✅ voiceExplanationBtn reactivado");
        }
        
        const rBtn = document.getElementById('voiceResultBtn');
        if (rBtn) {
            rBtn.disabled = false;
            rBtn.textContent = '🔊 Escuchar su resultado';
            console.log("✅ voiceResultBtn reactivado");
        }
        
        isSpeaking = false;
        updateVoiceIndicator('active');
        console.log("✅ Todos los botones de voz están ACTIVOS!");
    }

    // ============================================
    // 🔥 FUNCIÓN: DETENER LA VOZ
    // ============================================
    function stopSpeaking() {
        console.log("🔊 stopSpeaking() called");
        
        try {
            if (window.Capacitor?.Plugins?.TextToSpeech) {
                window.Capacitor.Plugins.TextToSpeech.stop();
                console.log("✅ Android stop performed");
            }
        } catch(e) { console.log("⚠️ Android stop error:", e); }
        
        try {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                console.log("✅ Web Speech stop performed");
            }
        } catch(e) { console.log("⚠️ Web Speech stop error:", e); }
        
        isSpeaking = false;
        console.log("✅ isSpeaking reset to false");
        resetAllVoiceButtons();
    }

    // ============================================
    // 🔥 FUNCIÓN: FALLBACK WEB SPEECH
    // ============================================
    function fallbackWebSpeech(text, lang, callback) {
        console.log("🔊 fallbackWebSpeech() called");
        
        if (!window.speechSynthesis) {
            console.error("❌ Web Speech not available");
            if (callback) callback();
            return;
        }
        
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            // ✅ NO FORZAR LA VOZ - Dejar que el sistema elija
            
            let callbackExecuted = false;
            
            const safeCallback = function() {
                if (!callbackExecuted) {
                    callbackExecuted = true;
                    console.log("✅ Web Speech callback executed");
                    if (callback) callback();
                }
            };
            
            utterance.onend = function() {
                console.log("✅ Web Speech finished (onend)");
                safeCallback();
            };
            
            utterance.onerror = function(e) {
                console.error("❌ Web Speech error:", e);
                safeCallback();
            };
            
            window.speechSynthesis.speak(utterance);
            
            setTimeout(function() {
                if (!callbackExecuted) {
                    console.warn("⚠️ TIMEOUT Web Speech - Forcing callback");
                    safeCallback();
                }
            }, 5000);
            
        } catch (error) {
            console.error("❌ Error in fallbackWebSpeech:", error);
            if (callback) callback();
        }
    }

    // ============================================
    // 🔥 FUNCIÓN: SPEAK (Capacitor + Web Speech)
    // ============================================
    function speak(text, lang, callback) {
        console.log("🔊 speak() called with:", text.substring(0, 50) + '...');
        
        if (!text) { 
            console.log("⚠️ Empty text, immediate callback");
            if (callback) callback(); 
            return; 
        }
        
        const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
        
        let callbackExecuted = false;
        
        const safeCallback = function() {
            if (!callbackExecuted) {
                callbackExecuted = true;
                console.log("✅ safeCallback() executed");
                isSpeaking = false;
                if (callback) callback();
            }
        };
        
        try {
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("🔊 Using Capacitor TTS plugin on Android");
                const TTS = window.Capacitor.Plugins.TextToSpeech;
                
                TTS.speak({ 
                    text: text, 
                    lang: lang || 'es-ES', 
                    rate: 0.9, 
                    pitch: 1.0, 
                    volume: 1.0 
                }).then(() => {
                    console.log("✅ Capacitor TTS finished");
                    setTimeout(safeCallback, 300);
                }).catch((error) => {
                    console.error("❌ Capacitor TTS error:", error);
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback to Web Speech");
                        fallbackWebSpeech(text, lang, safeCallback);
                    } else {
                        safeCallback();
                    }
                });
                
                setTimeout(function() {
                    if (!callbackExecuted) {
                        console.warn("⚠️ TIMEOUT Capacitor TTS - Forcing callback");
                        safeCallback();
                    }
                }, 5000);
                
            } else if (window.speechSynthesis) {
                console.log("🔊 Using Web Speech API");
                fallbackWebSpeech(text, lang, safeCallback);
                
            } else {
                console.error("❌ No TTS engine available");
                safeCallback();
            }
        } catch (error) {
            console.error("❌ ERROR in speak():", error);
            safeCallback();
        }
    }

    // ============================================
    // 🔥 ACTIVACIÓN DE VOZ
    // ============================================
    function activateVoice() {
        console.log("🔊 activateVoice() called");
        if (!voiceActivated) {
            const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
            console.log("🔊 isAndroid =", isAndroid);
            
            if (isAndroid) {
                if (window.Capacitor?.Plugins?.TextToSpeech) {
                    console.log("✅ Capacitor TTS available on Android");
                    voiceReady = true;
                    voiceActivated = true;
                    updateVoiceIndicator('active');
                } else {
                    console.warn("⚠️ Capacitor TTS not found on Android");
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback to Web Speech");
                        voiceReady = true;
                        voiceActivated = true;
                        window.speechSynthesis.getVoices();
                        updateVoiceIndicator('active');
                    }
                }
            } else {
                if (window.speechSynthesis) {
                    console.log("✅ Web Speech available on PC");
                    voiceReady = true;
                    voiceActivated = true;
                    window.speechSynthesis.getVoices();
                    updateVoiceIndicator('active');
                }
            }
            console.log("✅ Voice activated, voiceReady =", voiceReady);
        } else {
            console.log("ℹ️ Voice already activated");
        }
    }

    function updateVoiceIndicator(status) {
        const indicator = document.getElementById('voiceIndicator');
        if (indicator) {
            if (status === 'active') {
                indicator.textContent = '🎙️ IA activa';
                indicator.className = 'voice-indicator active';
            } else if (status === 'speaking') {
                indicator.textContent = '🎙️ Hablando...';
                indicator.className = 'voice-indicator speaking';
            } else {
                indicator.textContent = '🔇 IA inactiva';
                indicator.className = 'voice-indicator inactive';
            }
        }
    }

    // ============================================
    // =========== FUNCIONES DE VOZ ==============
    // ============================================
    
    function speakQuestionOnly() {
        console.log("🔊 speakQuestionOnly() called");
        stopSpeaking();
        
        const q = questions[currentQuestion];
        const text = `Pregunta ${currentQuestion + 1} de ${questions.length}: ${q.question}`;
        const btn = document.getElementById('voiceQuestionBtn');
        
        if (btn) {
            btn.disabled = true;
            btn.textContent = '🔊 Leyendo...';
            console.log("🔇 voiceQuestionBtn disabled");
        }
        
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(text, "es-ES", function() {
            console.log("✅ speakQuestionOnly() finished");
            resetAllVoiceButtons();
        });
    }

    function speakFeedback() {
        console.log("🔊 speakFeedback() called");
        stopSpeaking();
        
        let text = "";
        if (lastAnswerCorrect) {
            text = `¡Respuesta correcta! +${lastPointsEarned} puntos.`;
        } else {
            text = `Respuesta incorrecta. La respuesta correcta era: ${lastCorrectAnswer}.`;
        }
        
        const btn = document.getElementById('voiceFeedbackBtn');
        
        if (btn) {
            btn.disabled = true;
            btn.textContent = '🔊 Leyendo...';
            console.log("🔇 voiceFeedbackBtn disabled");
        }
        
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(text, "es-ES", function() {
            console.log("✅ speakFeedback() finished");
            resetAllVoiceButtons();
        });
    }

    function speakExplanation() {
        console.log("🔊 speakExplanation() called");
        stopSpeaking();
        
        const q = questions[currentQuestion];
        const text = `Explicación: ${q.explanation}`;
        const btn = document.getElementById('voiceExplanationBtn');
        
        if (btn) {
            btn.disabled = true;
            btn.textContent = '🔊 Leyendo...';
            console.log("🔇 voiceExplanationBtn disabled");
        }
        
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(text, "es-ES", function() {
            console.log("✅ speakExplanation() finished");
            resetAllVoiceButtons();
        });
    }

    function speakFinalResult() {
        console.log("🔊 speakFinalResult() called");
        stopSpeaking();
        
        const percentage = (score / MAX_SCORE) * 100;
        const isUnlocked = percentage >= 60;
        let text = `Su puntuación final es ${score} de ${MAX_SCORE}, lo que equivale al ${percentage.toFixed(1)} por ciento. `;
        if (isUnlocked) {
            text += "¡Felicitaciones! Has desbloqueado el Nivel 2. ¡Excelente trabajo!";
        } else {
            text += `Necesitas un ${(60 - percentage).toFixed(1)} por ciento más para desbloquear el Nivel 2. ¡Sigue practicando!`;
        }
        
        const btn = document.getElementById('voiceResultBtn');
        
        if (btn) {
            btn.disabled = true;
            btn.textContent = '🔊 Leyendo...';
            console.log("🔇 voiceResultBtn disabled");
        }
        
        isSpeaking = true;

    const MAX_SCORE = questions.length * 15; // 375 puntos
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("materiaux_dentaires_v1_debutant1_es", JSON.stringify({ score: finalScore, maxScore, percentage, date: new Date().toISOString() }));
        return percentage;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

        console.log("🔍 renderQuestion() - Pregunta", currentQuestion + 1);
        stopSpeaking();
        
        const q = questions[currentQuestion];

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);

    function attachVoiceEvents() {
        const voiceBtn = document.getElementById('voiceQuestionBtn');
        if (voiceBtn) {
            const newVoiceBtn = voiceBtn.cloneNode(true);
            voiceBtn.parentNode.replaceChild(newVoiceBtn, voiceBtn);
            newVoiceBtn.addEventListener('click', speakQuestionOnly);
            console.log("✅ Event attached to voiceQuestionBtn");
        }
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn && explBtn.style.display !== 'none') {
            const newExplBtn = explBtn.cloneNode(true);
            explBtn.parentNode.replaceChild(newExplBtn, explBtn);
            newExplBtn.addEventListener('click', speakExplanation);
            console.log("✅ Event attached to voiceExplanationBtn");
        }
    }

    function checkAnswer(selectedIndex) {
        console.log("🔍 checkAnswer() - Opción", String.fromCharCode(65 + selectedIndex));
        
        stopSpeaking();
        
        if (answerLocked) {
            console.log("⏳ Answer already locked");
            return;
        }

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        lastAnswerCorrect = isCorrect;
        lastCorrectAnswer = shuffledOptions[currentCorrectIndex];
        lastPointsEarned = pointsEarned;

        if (isCorrect) {
            score += pointsEarned;
            console.log("✅ Correct answer! +", pointsEarned, "points");
        } else {
            console.log("❌ Wrong answer. Correct answer:", shuffledOptions[currentCorrectIndex]);
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        const feedbackContainer = document.getElementById('feedbackContainer');
        if (feedbackContainer) {
            const feedbackClass = isCorrect ? 'feedback-container' : 'feedback-container wrong';

                pointsDisplay = `<span class="points-badge correct">+${pointsEarned} puntos</span>`;
            } else {
                pointsDisplay = `<span class="points-badge wrong">(0 puntos)</span>`;
            }
            
            feedbackContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">

                        ${pointsDisplay}

                </div>
            `;
            
            const feedbackBtn = document.getElementById('voiceFeedbackBtn');
            if (feedbackBtn) {
                const newFeedbackBtn = feedbackBtn.cloneNode(true);
                feedbackBtn.parentNode.replaceChild(newFeedbackBtn, feedbackBtn);
                newFeedbackBtn.addEventListener('click', speakFeedback);
                console.log("✅ Event attached to voiceFeedbackBtn");

        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Respuesta correcta : ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        
        const explBtn = document.getElementById('voiceExplanationBtn');

            explBtn.style.display = 'inline-block';
            attachVoiceEvents();
        }

        if (timerInterval) clearInterval(timerInterval);

        let feedbackText = "";
        if (isCorrect) {
            feedbackText = `¡Respuesta correcta! +${pointsEarned} puntos.`;
        } else {
            feedbackText = `Respuesta incorrecta. La respuesta correcta era: ${shuffledOptions[currentCorrectIndex]}.`;
        }
        
        console.log("🔊 Automatic feedback reading");
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(feedbackText, "es-ES", function() {
            console.log("✅ Automatic feedback finished");
            resetAllVoiceButtons();
        });
    }

    function nextQuestion() {
        console.log("🔍 nextQuestion() called");
        stopSpeaking();
        
        if (!answerLocked) {
            console.log("⚠️ Please answer before continuing");
            return;
        }
        currentQuestion++;
        timeLeft = 20;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    // ============================================
    // =========== NAVEGACIÓN ====================
    // ============================================
    
    function goToMenu() { 
        window.location.href = "menu_es.html?t=" + Date.now(); 
    }

    function goToDashboard() {
        window.location.href = "../../../../clasificaciones_dashboard_es.html";
    }

    function goToRanking() {
        goToDashboard();
    }

    // ============================================
    // =========== endQuiz CORREGIDO ==============
    // ============================================
    function endQuiz() {
        console.log("🔍 endQuiz() called");
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        
        const percentage = (score / MAX_SCORE) * 100;
        
        saveScore(score, MAX_SCORE);
        
        const isUnlocked = unlockLevel2(percentage);
        
        guardarValidacion('Ciencia de los Materiales Dentales', 'principiante1', score, MAX_SCORE);
        
        sendScoreToFirebase(score, MAX_SCORE, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 ¡Quiz terminado!</h1>
                <div class="final-score">Puntuación : ${score}/${MAX_SCORE}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Porcentaje : <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${isUnlocked ? 
                        '<div class="unlock-badge">✅ ¡Nivel Principiante 2 desbloqueado! 🎊</div>' : 
                        '<div class="locked-badge">⚠️ Puntuación insuficiente (mínimo 60% requerido para desbloquear el siguiente nivel)</div>'}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${isUnlocked ? 
                        '📚 Vaya al menú para acceder al nivel 2.' : 
                        `💪 Le falta un ${(60 - percentage).toFixed(1)}% para desbloquear el nivel 2. ¡Vuelva a intentarlo!`}
                </div>
                
                <div class="voice-btn-row">
                    <button class="voice-btn result-btn-style" id="voiceResultBtn">🔊 Escuchar su resultado</button>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0;">
                    <button class="share-btn" onclick="shareScore()">📤 Compartir mi puntuación</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Dar mi opinión</button>
                    <button class="ranking-btn" onclick="goToDashboard()">🏆 Clasificación mundial</button>
                </div>
                
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Menú principal</button>
                    <!-- ✅ SIEMPRE ACTIVO - El usuario puede ver su progresión -->
                    <button class="btn-progression" onclick="irAProgresion()">📊 Mi progresión</button>
                </div>
            </div>
        `;
        
        const resultBtn = document.getElementById('voiceResultBtn');
        if (resultBtn) {
            const newResultBtn = resultBtn.cloneNode(true);
            resultBtn.parentNode.replaceChild(newResultBtn, resultBtn);
            newResultBtn.addEventListener('click', speakFinalResult);
            console.log("✅ Event attached to voiceResultBtn");
        }
        
        setTimeout(() => {
            speakFinalResult();
        }, 1000);
        
        setTimeout(() => {
            openRankingModal();
        }, 2000);
    }

    // ============================================
    // =========== POPUP CLASIFICACIÓN MODAL =====
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anónimo";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 No hay puntuaciones registradas para este nivel por el momento.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Su clasificación</div>
                        <div class="rank-number">${userRank}e posición</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} puntos (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Todavía no está en la clasificación de este nivel</div>
                        <div>¡Vuelva a hacer el quiz para aparecer!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 TOP 20 - Ciencia de los Materiales Dentales Principiante 1</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anónimo"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 No hay puntuaciones para este nivel</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Error Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ No se pudo cargar la clasificación.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Error desconocido'}</span></div>`;
        }
    }

    // ============================================
    // =========== ABANDONO CORREGIDO =============
    // ============================================
    function abandonQuiz() {
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("materiaux_dentaires_v1_debutant1_es", JSON.stringify({ score, maxScore: MAX_SCORE, percentage: partialPercentage, date: new Date().toISOString(), abandoned: true }));
        
        unlockLevel2(partialPercentage);
        guardarValidacion('Ciencia de los Materiales Dentales', 'principiante1', score, MAX_SCORE);
        
        sendScoreToFirebase(score, MAX_SCORE, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>❌ Quiz abandonado</h1>
                <div class="final-score">Puntuación parcial : ${score}/${MAX_SCORE}</div>
                <div>Porcentaje : ${partialPercentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">🏆 Esta puntuación ha sido registrada en la clasificación.</div>
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Volver al menú</button>
                    <!-- ✅ SIEMPRE ACTIVO - El usuario puede ver su progresión -->
                    <button class="btn-progression" onclick="irAProgresion()">📊 Mi progresión</button>
                </div>
            </div>
        `;
        speak(`Quiz abandonado. Puntuación parcial : ${score} sobre ${MAX_SCORE}.`, "es-ES");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE) * 100;
        const text = `🎓 ETEO - Ciencia de los Materiales Dentales\nMi puntuación en el nivel Principiante 1 : ${score}/${MAX_SCORE} (${percentage.toFixed(1)}%)\n¡Desafíame en ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Puntuación', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ ¡Puntuación copiada al portapapeles!");
            }).catch(() => {
                alert("📋 Para compartir, copie este texto :\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        console.log("🚀 startQuiz() called");
        saveUserInfo();
        console.log("🔊 Activando voz...");
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
        console.log("✅ Quiz started");
    }

    // ============================================
    // =========== INICIALIZACIÓN ================
    // ============================================
    console.log("🚀 Página cargada - Quiz ETEO Materiales Dentales (ES)");
    console.log("📱 window.Capacitor =", window.Capacitor);
    
    if (window.Capacitor) {
        console.log("📱 Platform =", window.Capacitor.getPlatform());
        console.log("📱 Plugins =", Object.keys(window.Capacitor.Plugins || {}));
    }
    
    document.body.addEventListener('click', function firstClick() { 
        console.log("🖱️ Primer clic - Activando voz");
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
