<script>

    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",

    // ============================================
    // LEVEL_ID PARA ESTE QUIZ

    // ============================================
    // =========== 1. SISTEMA DE VOZ AVANZADO =====
    // ============================================
    
    let isSpeaking = false;
    let voiceReady = false;
    let voiceActivated = false;
    let lastAnswerCorrect = false;
    let lastCorrectAnswer = "";
    let lastPointsEarned = 0;

    // ============================================
    // 🔥 FUNCIÓN : REINICIAR TODOS LOS BOTONES DE VOZ
    // ============================================
    function resetAllVoiceButtons() {
        console.log("🔄 resetAllVoiceButtons() - Reactivando TODOS los botones");
        
        const qBtn = document.getElementById('voiceQuestionBtn');
        if (qBtn) {

            fBtn.disabled = false;
            fBtn.textContent = '🔊 Volver a escuchar feedback';
            console.log("✅ voiceFeedbackBtn reactivado");
        }
        
        const eBtn = document.getElementById('voiceExplanationBtn');
        if (eBtn) {
            eBtn.disabled = false;

            console.log("✅ voiceExplanationBtn reactivado");
        }

        if (rBtn) {
            rBtn.disabled = false;

        isSpeaking = false;

    // ============================================
    // 🔥 FUNCIÓN : DETENER LA VOZ
    // ============================================
    function stopSpeaking() {
        console.log("🔊 stopSpeaking() llamado");
        
        try {
            if (window.Capacitor?.Plugins?.TextToSpeech) {
                window.Capacitor.Plugins.TextToSpeech.stop();
                console.log("✅ Stop Android ejecutado");
            }
        } catch(e) { console.log("⚠️ Error al detener Android:", e); }
        
        try {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                console.log("✅ Web Speech stop ejecutado");
            }
        } catch(e) { console.log("⚠️ Error al detener Web Speech:", e); }
        
        isSpeaking = false;
        console.log("✅ isSpeaking reiniciado a false");
        resetAllVoiceButtons();
    }

    // ============================================
    // 🔥 FUNCIÓN : FALLBACK WEB SPEECH
    // ============================================
    function fallbackWebSpeech(text, lang, callback) {
        console.log("🔊 fallbackWebSpeech() llamado");
        
        if (!window.speechSynthesis) {
            console.error("❌ Web Speech no disponible");
            if (callback) callback();
            return;
        }
        
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            const voices = window.speechSynthesis.getVoices();
            let spanishVoice = voices.find(v => v.lang.startsWith('es') && v.localService === true);
            if (!spanishVoice) {
                spanishVoice = voices.find(v => v.lang.startsWith('es'));
            }
            if (spanishVoice) utterance.voice = spanishVoice;
            
            let callbackExecuted = false;
            
            const safeCallback = function() {
                if (!callbackExecuted) {
                    callbackExecuted = true;
                    console.log("✅ Web Speech callback ejecutado");
                    if (callback) callback();
                }
            };
            
            utterance.onend = function() {
                console.log("✅ Web Speech terminado (onend)");
                safeCallback();
            };
            
            utterance.onerror = function(e) {
                console.error("❌ Web Speech error:", e);
                safeCallback();
            };
            
            window.speechSynthesis.speak(utterance);
            
            setTimeout(function() {
                if (!callbackExecuted) {
                    console.warn("⚠️ TIMEOUT Web Speech - Forzando callback");
                    safeCallback();
                }
            }, 5000);
            
        } catch (error) {
            console.error("❌ Error en fallbackWebSpeech:", error);
            if (callback) callback();
        }
    }

    // ============================================
    // 🔥 FUNCIÓN : CORREGIR TEXTO PARA ESPAÑOL
    // ============================================
    function corregirTextoParaEspanol(text) {
        let corrected = text;
        corrected = corrected.replace(/Dr\.?\s+/g, 'Doctor ');
        corrected = corrected.replace(/Dra\.?\s+/g, 'Doctora ');
        corrected = corrected.replace(/\bDr\b/g, 'Doctor');
        corrected = corrected.replace(/\bDra\b/g, 'Doctora');
        return corrected;
    }

    // ============================================
    // 🔥 FUNCIÓN : SPEAK (con Capacitor + Web Speech)
    // ============================================
    function speak(text, lang, callback) {
        console.log("🔊 speak() llamado con:", text.substring(0, 50) + '...');
        
        if (!text) { 
            console.log("⚠️ Texto vacío, callback inmediato");
            if (callback) callback(); 
            return; 
        }
        
        // Corregir texto para español
        let correctedText = text;
        if (lang === 'es-ES' || lang === 'es') {
            correctedText = corregirTextoParaEspanol(text);
        }
        
        const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
        
        let callbackExecuted = false;
        
        const safeCallback = function() {
            if (!callbackExecuted) {
                callbackExecuted = true;
                console.log("✅ safeCallback() ejecutado");
                isSpeaking = false;
                if (callback) callback();
            }
        };
        
        try {
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("🔊 Usando plugin Capacitor TTS en Android");
                const TTS = window.Capacitor.Plugins.TextToSpeech;
                
                TTS.speak({ 
                    text: correctedText, 
                    lang: lang || 'es-ES', 
                    rate: 0.9, 
                    pitch: 1.0, 
                    volume: 1.0 
                }).then(() => {
                    console.log("✅ Capacitor TTS completado");
                    setTimeout(safeCallback, 300);
                }).catch((error) => {
                    console.error("❌ Error Capacitor TTS:", error);
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback a Web Speech");
                        fallbackWebSpeech(correctedText, lang, safeCallback);
                    } else {
                        safeCallback();
                    }
                });
                
                setTimeout(function() {
                    if (!callbackExecuted) {
                        console.warn("⚠️ TIMEOUT Capacitor TTS - Forzando callback");
                        safeCallback();
                    }
                }, 5000);
                
            } else if (window.speechSynthesis) {
                console.log("🔊 Usando Web Speech API");
                fallbackWebSpeech(correctedText, lang, safeCallback);
            } else {
                console.error("❌ No hay motor TTS disponible");
                safeCallback();
            }
        } catch (error) {
            console.error("❌ ERROR en speak():", error);
            safeCallback();
        }
    }

    // ============================================
    // 🔥 ACTIVAR VOZ
    // ============================================
    function activateVoice() {

        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    // ============================================
    // =========== RENDER QUESTION ================
    // ============================================
    function renderQuestion() {
        console.log("🔍 renderQuestion() - Pregunta", currentQuestion + 1);
        isSpeaking = false;
        
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${letter}. ${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header"><h1>🧪 Materiales Dentales - Principiante 2</h1><p>Pregunta ${currentQuestion + 1}/${questions.length}</p></div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                
                <div class="voice-btn-row">
                    <button class="voice-btn" id="voiceQuestionBtn">🔊 Leer la pregunta</button>
                </div>
                
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                
                <div id="feedbackContainer" style="display: none;"></div>
                
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Explicación :</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                    <div class="voice-btn-row">
                        <button class="voice-btn explanation-btn-style" id="voiceExplanationBtn" style="display: none;">🔊 Leer explicación</button>
                    </div>
                </div>
                
                <div class="timer">⏱️ Tiempo restante : <span id="timer">${timeLeft}</span> segundos</div>
                <div class="score">🏆 Puntuación actual : ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandonar</button>
                    <button class="nav-btn" onclick="nextQuestion()">Siguiente →</button>
                </div>
            </div>
        `;
        
        attachVoiceEvents();
        answerLocked = false;
        startTimer();
        lastAnswerCorrect = false;
        lastCorrectAnswer = "";
        lastPointsEarned = 0;
        
        setTimeout(() => {
            speakQuestionOnly();
        }, 500);
    }

    // ============================================
    // =========== CHECK ANSWER ===================
    // ============================================
    function checkAnswer(selectedIndex) {
        console.log("🔍 checkAnswer() - Opción", String.fromCharCode(65 + selectedIndex));
        
        stopSpeaking();
        
        if (answerLocked) {
            console.log("⏳ Respuesta ya bloqueada");
            return;
        }

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        lastAnswerCorrect = isCorrect;
        lastCorrectAnswer = shuffledOptions[currentCorrectIndex];
        lastPointsEarned = pointsEarned;

        if (isCorrect) {
            score += pointsEarned;
            console.log("✅ ¡Respuesta correcta! +", pointsEarned, "puntos");
        } else {
            console.log("❌ Respuesta incorrecta. Respuesta correcta:", shuffledOptions[currentCorrectIndex]);
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        const feedbackContainer = document.getElementById('feedbackContainer');
        if (feedbackContainer) {
            const feedbackClass = isCorrect ? 'feedback-container' : 'feedback-container wrong';
            feedbackContainer.style.display = 'block';
            feedbackContainer.className = feedbackClass;
            
            let pointsDisplay = '';
            if (isCorrect) {
                pointsDisplay = `<span class="points-badge correct">+${pointsEarned} puntos</span>`;
            } else {
                pointsDisplay = `<span class="points-badge wrong">(0 puntos)</span>`;
            }
            
            feedbackContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        ${isCorrect ? '✅ ¡Respuesta correcta!' : '❌ Respuesta incorrecta'}
                        ${pointsDisplay}
                    </div>
                    <button class="voice-btn feedback-btn-style" id="voiceFeedbackBtn">🔊 Volver a escuchar feedback</button>
                </div>
            `;
            
            const feedbackBtn = document.getElementById('voiceFeedbackBtn');
            if (feedbackBtn) {
                const newFeedbackBtn = feedbackBtn.cloneNode(true);
                feedbackBtn.parentNode.replaceChild(newFeedbackBtn, feedbackBtn);
                newFeedbackBtn.addEventListener('click', speakFeedback);
                console.log("✅ Evento asignado para voiceFeedbackBtn");
            }
        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Respuesta correcta : ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn) {
            explBtn.style.display = 'inline-block';
            attachVoiceEvents();
        }
        
        document.querySelector('.score').innerHTML = `🏆 Puntuación actual : ${score}/${MAX_SCORE_WITH_BONUS}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
        
        let feedbackText = "";
        if (isCorrect) {
            feedbackText = `¡Respuesta correcta! +${pointsEarned} puntos.`;
        } else {
            feedbackText = `Respuesta incorrecta. La respuesta correcta era: ${shuffledOptions[currentCorrectIndex]}.`;
        }
        
        console.log("🔊 Auto-lectura del feedback");
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(feedbackText, "es-ES", function() {
            console.log("✅ Auto-feedback completado");
        });
    }

    // ============================================
    // =========== NEXT QUESTION ==================
    // ============================================
    function nextQuestion() {
        console.log("🔍 nextQuestion() llamado");
        
        stopSpeaking();
        
        if (!answerLocked) {
            console.log("⚠️ Por favor, seleccione una respuesta antes de continuar");
            return;
        }
        currentQuestion++;
        timeLeft = 30;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    // ============================================
    // =========== NAVEGACIÓN =====================
    // ============================================
    
    function goToMenu() {
        window.location.href = "menu_es.html?t=" + Date.now();
    }

    function goToDashboard() {
        window.location.href = "../../../../classements_dashboard.html";
    }

    function goToRanking() {
        goToDashboard();
    }

    // ============================================
    // =========== endQuiz ========================
    // ============================================
    function endQuiz() {
        console.log("🔍 endQuiz() llamado");
        
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        
        saveScore(score, MAX_SCORE_WITH_BONUS);
        
        const isUnlocked = unlockLevel3(percentage);
        
        guardarValidacion('Ciencia_de_los_Materiales_Dentales', 'principiante2', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 ¡Quiz terminado!</h1>
                <div class="final-score">Puntuación : ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Porcentaje : <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${isUnlocked ?
                        `<div class="unlock-badge">✅ ¡Nivel Intermedio 1 desbloqueado! 🎊</div>
                         <div class="beta-info-badge">🔒 BETA: El nivel Experto llegará tras 6 meses de evaluación.</div>` :
                        `<div class="locked-badge">⚠️ Puntuación insuficiente (mínimo 60% requerido para desbloquear el siguiente nivel)</div>`}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${isUnlocked ?
                        '📚 Ve al menú para acceder al Nivel Intermedio 1.' :
                        `💪 Te falta un ${(60 - percentage).toFixed(1)}% más para desbloquear el siguiente nivel. ¡Vuelve a intentarlo!`}
                </div>
                
                <div class="voice-btn-row">
                    <button class="voice-btn result-btn-style" id="voiceResultBtn">🔊 Escuchar tu resultado</button>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0;">
                    <button class="share-btn" onclick="shareScore()">📤 Compartir mi puntuación</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Dar mi opinión</button>
                    <button class="ranking-btn" onclick="goToDashboard()">🏆 Clasificación mundial</button>
                </div>
                
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Menú principal</button>
                    <button class="btn-progression" onclick="goToProgression()">📊 Ver mi progresión</button>
                </div>
            </div>
        `;
        
        const resultBtn = document.getElementById('voiceResultBtn');
        if (resultBtn) {
            const newResultBtn = resultBtn.cloneNode(true);
            resultBtn.parentNode.replaceChild(newResultBtn, resultBtn);
            newResultBtn.addEventListener('click', speakFinalResult);
            console.log("✅ Evento asignado para voiceResultBtn");
        }
        
        if (isUnlocked) {
            setTimeout(() => {
                speakFinalResult();
            }, 1000);
            
            setTimeout(() => {
                openBetaEvaluationPopup();
            }, 2000);
        } else {
            setTimeout(() => {
                speakFinalResult();
            }, 1000);
        }
        
        setTimeout(() => {
            openRankingModal();
        }, 2000);
    }

    // ============================================
    // =========== POPUP CLASIFICACIÓN MODAL =====
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anónimo";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 No hay puntuaciones registradas para este nivel por el momento.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Su clasificación</div>
                        <div class="rank-number">${userRank}${userRank === 1 ? 'ª' : userRank === 2 ? 'ª' : userRank === 3 ? 'ª' : 'ª'} posición</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} puntos (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Todavía no estás en la clasificación de este nivel</div>
                        <div>¡Vuelve a hacer el quiz para aparecer!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 TOP 20 - Ciencia de los Materiales Dentales Principiante 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anónimo"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 No hay puntuaciones para este nivel</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Error Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ No se pudo cargar la clasificación.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Error desconocido'}</span></div>`;
        }
    }

    // ============================================
    // =========== POPUP BETA - OPCIÓN 2 (ES) ====
    // ============================================
    function openBetaEvaluationPopup() {
        if (document.getElementById('betaPopup')) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Doctor";
        
        const modal = document.createElement('div');
        modal.id = 'betaPopup';
        modal.className = 'beta-popup-overlay';
        modal.innerHTML = `
            <div class="beta-popup-content">
                <div class="big-icon">🎉🏆🎉</div>
                <h2>¡Felicidades ${userName}!</h2>
                <p>Has validado los <strong>dos niveles Principiantes</strong> con éxito.<br>¡Qué recorrido tan impresionante!</p>
                
                <div style="margin: 25px 0;">
                    <p style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">🌟 Evalúa la versión BETA 🌟</p>
                    <div class="stars" id="starRating">
                        <span data-rating="1" style="color: #ccc;">☆</span>
                        <span data-rating="2" style="color: #ccc;">☆</span>
                        <span data-rating="3" style="color: #ccc;">☆</span>
                        <span data-rating="4" style="color: #ccc;">☆</span>
                        <span data-rating="5" style="color: #ccc;">☆</span>
                    </div>
                    <p class="rating-message" id="ratingMessage"></p>
                </div>
                
                <div class="beta-info">
                    <p>🚀 <strong>La continuación (Intermedio & Experto)</strong> llegará tras <strong>6 meses de evaluación</strong> de esta versión Beta.<br><br>
                    Tu opinión nos ayuda a mejorar ETEO. ¡Gracias por tu confianza, <strong>${userName}</strong>!</p>
                </div>
                
                <button class="beta-btn" onclick="closeBetaPopup()">Volver al menú</button>
            </div>
        `;
        
        document.body.appendChild(modal);
        
        // ✅ OPCIÓN 2 : Lectura automática del mensaje (en español)
        stopSpeaking();
        
        setTimeout(() => {
            const fullMessage = `¡Felicidades ${userName}! Has validado los dos niveles Principiantes con éxito. ` +
                               `Por favor, evalúa la versión BETA haciendo clic en las estrellas. ` +
                               `La continuación, Intermedio y Experto, llegará tras seis meses de evaluación. ` +
                               `Gracias por tu confianza.`;
            
            isSpeaking = true;
            updateVoiceIndicator('speaking');
            speak(fullMessage, "es-ES", function() {
                console.log("✅ Mensaje BETA leído automáticamente");
                isSpeaking = false;
                updateVoiceIndicator('active');
            });
        }, 600);
        
        // Gestión de estrellas
        const stars = modal.querySelectorAll('#starRating span');
        stars.forEach(function(star) {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                sendBetaEvaluation(rating);
                
                stars.forEach(function(s, idx) {
                    if (idx < rating) {
                        s.innerHTML = '★';
                        s.style.color = '#ffc107';
                    } else {
                        s.innerHTML = '☆';
                        s.style.color = '#ccc';
                    }
                });
                
                const messageDiv = document.getElementById('ratingMessage');
                messageDiv.innerHTML = '✅ ¡Gracias por tu evaluación! Tu opinión ha sido registrada.';
                messageDiv.style.color = '#4caf50';
                messageDiv.style.fontWeight = 'bold';
                
                // ✅ Confirmación vocal de la evaluación (en español)
                const confirmationMessage = `Gracias por tu evaluación de ${rating} sobre 5. Tu opinión ha sido registrada.`;
                
                stopSpeaking();
                isSpeaking = true;
                updateVoiceIndicator('speaking');
                speak(confirmationMessage, "es-ES", function() {
                    console.log("✅ Confirmación de evaluación leída");
                    isSpeaking = false;
                    updateVoiceIndicator('active');
                });
            });
        });
    }

    function closeBetaPopup() {
        var modal = document.getElementById('betaPopup');
        if (modal) modal.remove();
        goToMenu();
    }

    async function sendBetaEvaluation(rating) {
        const userName = localStorage.getItem("eteo_userName") || "Anónimo";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        
        try {
            await db.collection('evaluations_beta').add({
                nom: userName,
                pays: userCountry,
                note: rating,
                langue: 'es',
                nivel: 'principiante2',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("✅ Evaluación Beta enviada !");
        } catch (error) {
            console.error("❌ Error evaluación Beta:", error);
        }
    }

    // ============================================
    // =========== OTRAS FUNCIONES ===============
    // ============================================
    function abandonQuiz() {
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        localStorage.setItem("materiaux_dentaires_v1_debutant2_es", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE_WITH_BONUS, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel3(partialPercentage);
        
        guardarValidacion('Ciencia_de_los_Materiales_Dentales', 'principiante2', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>❌ Quiz abandonado</h1>
                <div class="final-score">Puntuación parcial : ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div>Porcentaje : ${partialPercentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">🏆 Esta puntuación ha sido registrada en la clasificación.</div>
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Volver al menú</button>
                    <button class="btn-progression" onclick="goToProgression()">📊 Ver mi progresión</button>
                </div>
            </div>
        `;
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        const text = `🎓 ETEO - Ciencia de los Materiales Dentales\nMi puntuación en el nivel Principiante 2 : ${score}/${MAX_SCORE_WITH_BONUS} (${percentage.toFixed(1)}%)\n¡Desafíame en ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Puntuación', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ ¡Puntuación copiada al portapapeles!");
            }).catch(() => {
                alert("📋 Para compartir, copia este texto :\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        console.log("🚀 startQuiz() llamado");
        saveUserInfo();
        console.log("🔊 Activando voz...");
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
        console.log("✅ Quiz iniciado");
    }

    // ============================================
    // =========== INICIALIZACIÓN ================
    // ============================================
    console.log("🚀 Página cargada - ETEO Quiz Materiales Dentales (ES) - Principiante 2");
    console.log("📱 window.Capacitor =", window.Capacitor);
    
    if (window.Capacitor) {
        console.log("📱 Plataforma =", window.Capacitor.getPlatform());
        console.log("📱 Plugins =", Object.keys(window.Capacitor.Plugins || {}));
    }
    
    document.body.addEventListener('click', function firstClick() { 
        console.log("🖱️ Primer clic - Activando voz");
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
