<script>
    // ============================================
    // =========== FIREBASE CONFIGURATION =========
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",
        projectId: "eteo-endo-to-every-one",
        storageBucket: "eteo-endo-to-every-one.firebasestorage.app",

        appId: "1:511524282020:web:5a25c021fd84f026969031"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================
    // LEVEL_ID FOR THIS QUIZ
    // ============================================
    const LEVEL_ID = "future_docteur_v1_debutant2_en";

    // ============================================
    // =========== 1. VOICE SYSTEM ================
    // ============================================
    let speechSynthesisObj = null;
    let voiceReady = false;

    function initVoice() {
        if ('speechSynthesis' in window) {
            speechSynthesisObj = window.speechSynthesis;
            voiceReady = true;
            return true;
        }
        return false;
    }

    function speak(text, lang) {
        if (!voiceReady || !speechSynthesisObj) return;
        try {
            speechSynthesisObj.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            speechSynthesisObj.speak(utterance);
        } catch(e) {}
    }

    function stopSpeaking() {
        if (voiceReady && speechSynthesisObj) {
            speechSynthesisObj.cancel();
        }
    }

    let voiceActivated = false;

    function activateVoice() {
        if (!voiceActivated) {
            initVoice();
            voiceActivated = true;
            const indicator = document.getElementById('voiceIndicator');
            if (indicator) {
                indicator.textContent = "🎙️ AI activated";
                indicator.style.background = "#8a4aaa";
                setTimeout(() => {
                    indicator.style.opacity = "0.5";
                }, 2000);
            }
        }
        return true;
    }

    // ============================================
    // =========== 2. USER INFO ===================
    // ============================================
    function getUserName() { return localStorage.getItem("eteo_userName") || ""; }
    function getUserCountry() { return localStorage.getItem("eteo_userCountry") || "MA"; }

    function saveUserInfo() {
        const name = document.getElementById("userName").value.trim();
        const select = document.getElementById("userCountry");
        const otherInput = document.getElementById("otherCountry");
        let country = select.value;
        
        if (otherInput.value.trim() !== "") {
            country = otherInput.value.trim();
        }
        
        localStorage.setItem("eteo_userName", name === "" ? "Anonymous" : name);
        localStorage.setItem("eteo_userCountry", country);
    }

    // ============================================
    // =========== UNLOCK FUNCTION ================
    // ============================================
    // 🔒 BETA : Intermediate Level 1 locked for 6 months
    function unlockLevel3(percentage) {
        return false;
    }

    // ================================================================
    // 🔥 SAVE VALIDATION FOR PROGRESSION.HTML
    // ================================================================
    function sauvegarderValidation(specialite, niveau, score, total) {
        const percentage = (score / total) * 100;
        
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: specialite,
                niveau: niveau,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progression = JSON.parse(localStorage.getItem('eteo_progression')) || {};
            const key = specialite + '_' + niveau;
            progression[key] = true;
            localStorage.setItem('eteo_progression', JSON.stringify(progression));
            
            console.log('✅ Validation saved for progression.html');
        }
    }

    // ============================================
    // =========== 3. SCENARIO POPUP ==============
    // ============================================
    let scenarioPlaying = false;
    let scenarioStarted = false;

    function showScenarioPopup() {
        const modal = document.createElement('div');
        modal.id = 'scenarioModal';
        modal.innerHTML = `
            <div class="modal-content">
                <button class="modal-close" onclick="closeScenarioPopup()">✕</button>
                <div class="modal-icon">📊</div>
                <div class="modal-title">📖 The first month review</div>
                <div class="modal-text" id="scenarioText">
                    <span class="serious">🔴 Context:</span> Dr. Karim has finally opened his practice after months of preparation. But at the end of his first month of activity, the reality hits hard: patients don't always show up, bills are piling up, and his bank loan is starting to weigh heavily. Doubt sets in.<br><br>
                    <span class="serious">💬 Exchange:</span> Dr. Leila, who went through exactly the same period a year ago, visits him to help analyze his first results and adjust his strategy.<br><br>
                    <span class="serious">📋 Objective:</span> Understand the real difficulties of the first months of activity, managing missed appointments, cash flow, legal aspects, and the importance of rigorous follow-up.
                </div>
                <div class="modal-status waiting" id="scenarioStatus">👆 Click anywhere to listen to the scenario</div>
                <div class="modal-footer">
                    <button class="modal-btn" id="btnEcouterScenario">🔊 Re-listen</button>
                    <button class="modal-btn secondary" onclick="closeScenarioPopup()">✅ Understood, let's start!</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        
        // 🔥 START READING ON FIRST CLICK
        const startScenario = function() {
            if (scenarioStarted) return;
            scenarioStarted = true;
            
            activateVoice();
            
            const scenarioText = document.getElementById('scenarioText');
            if (scenarioText) {
                const text = scenarioText.textContent;
                const cleanText = text.replace(/[🔴💬📋📊]/g, '').trim();
                speak(cleanText, 'en-US');
                const statusEl = document.getElementById('scenarioStatus');
                if (statusEl) {
                    statusEl.textContent = '🔊 Reading in progress...';
                    statusEl.className = 'modal-status playing';
                }
                scenarioPlaying = true;
                
                setTimeout(() => {
                    const statusEl2 = document.getElementById('scenarioStatus');
                    if (statusEl2 && scenarioPlaying) {
                        statusEl2.textContent = '✅ Scenario read. Ready to start!';
                        statusEl2.className = 'modal-status';
                    }
                }, 28000);
            }
            
            document.removeEventListener('click', startScenario);
        };
        
        document.addEventListener('click', startScenario);
        
        document.getElementById('btnEcouterScenario').addEventListener('click', function() {
            stopSpeaking();
            const scenarioText = document.getElementById('scenarioText');
            if (scenarioText) {
                const text = scenarioText.textContent;
                const cleanText = text.replace(/[🔴💬📋📊]/g, '').trim();
                speak(cleanText, 'en-US');
                const statusEl = document.getElementById('scenarioStatus');
                if (statusEl) {
                    statusEl.textContent = '🔊 Re-reading in progress...';
                    statusEl.className = 'modal-status playing';
                }
            }
        });
    }

    function closeScenarioPopup() {
        stopSpeaking();
        const modal = document.getElementById('scenarioModal');
        if (modal) {
            modal.remove();
        }
        scenarioPlaying = false;
        scenarioStarted = true;
    }

                <div class="scenario-box">

                    <div class="text" id="scenarioTextDisplay">

                        <span class="serious">💬 Exchange:</span> Dr. Leila, who went through exactly the same period a year ago, visits him to help analyze his first results and adjust his strategy.
                    </div>
                </div>
                <div class="input-group">

                </div>

    const MAX_SCORE = questions.length * 15;
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("future_docteur_v1_debutant2_en", JSON.stringify({ 
            score: finalScore, 
            maxScore: maxScore,
            percentage: percentage,
            date: new Date().toISOString() 
        }));
        return percentage;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    speak("Time's up! Moving to the next question.", "en-US");
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function speakCurrentQuestion() {
        speak(`Question ${currentQuestion + 1}: ${questions[currentQuestion].question}`, "en-US");
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header">
                <h1>📊 Future Doctor - Beginner Level 2</h1>
                <div class="subtitle">Question ${currentQuestion + 1}/${questions.length}</div>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Explanation:</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                </div>
                <div class="timer">⏱️ Time remaining: <span id="timer">${timeLeft}</span> seconds</div>
                <div class="score">🏆 Current score: ${score}/${MAX_SCORE}</div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandon</button>
                    <button class="nav-btn" onclick="nextQuestion()">Next →</button>
                </div>
            </div>
        `;
        answerLocked = false;
        startTimer();
        setTimeout(() => speakCurrentQuestion(), 500);
    }

    function checkAnswer(selectedIndex) {
        if (answerLocked) return;

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        if (isCorrect) {
            score += pointsEarned;
            speak(`Correct answer! +${pointsEarned} points.`, "en-US");
        } else {
            speak(`Wrong answer. The correct answer was: ${shuffledOptions[currentCorrectIndex]}.`, "en-US");
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Correct answer: ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        document.querySelector('.score').innerHTML = `🏆 Current score: ${score}/${MAX_SCORE}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
    }

    function nextQuestion() {
        if (!answerLocked) { 
            speak("Please select an answer.", "en-US"); 
            return; 
        }
        currentQuestion++;
        timeLeft = 30;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

        const container = document.getElementById('modalRankingContent');

        const userName = localStorage.getItem("eteo_userName") || "Anonymous";

            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();

                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 No scores recorded for this level yet.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {

                    userRank = i + 1;
                    userScore = scores[i];

                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} points (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 You are not yet in the ranking for this level</div>
                        <div>Take the quiz to appear!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #8a4aaa;">🏆 TOP 20 - Future Doctor Beginner 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(138,74,170,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anonymous"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 No scores for this level</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Firestore error:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Unable to load ranking.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Unknown error'}</span></div>`;
        }
    }

    function abandonQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("future_docteur_v1_debutant2_en", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel3(partialPercentage);
        sauvegarderValidation('Future Doctor', 'debutant2', score, MAX_SCORE);
        sendScoreToFirebase(score, MAX_SCORE, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `<div class="result-container"><h1>❌ Quiz abandoned</h1><div class="final-score">Partial score: ${score}/${MAX_SCORE}</div><div>Percentage: ${partialPercentage.toFixed(1)}%</div><div style="margin:20px 0;">🏆 This score has been recorded in the ranking.</div><button class="menu-btn" onclick="goToMenu()">🏠 Back to menu</button></div>`;
        speak(`Quiz abandoned. Partial score: ${score} out of ${MAX_SCORE}.`, "en-US");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE) * 100;
        const text = `🎓 ETEO - Future Doctor\nMy score in Beginner Level 2: ${score}/${MAX_SCORE} (${percentage.toFixed(1)}%)\nChallenge me on ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Score', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Score copied to clipboard!");
            }).catch(() => {
                alert("📋 To share, copy this text:\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        closeScenarioPopup();
        saveUserInfo();
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
    }

    // ============================================
    // =========== INITIALISATION ================
    // ============================================
    showWelcomeScreen();

    setTimeout(() => {
        showScenarioPopup();
    }, 800);

    document.body.addEventListener('click', function firstClick() {
        activateVoice();
        document.body.removeEventListener('click', firstClick);
    });
</script>
</body>
</html>
