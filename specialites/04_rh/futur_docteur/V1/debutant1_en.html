<script>
    // ============================================
    // =========== FIREBASE CONFIGURATION =========
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",
        projectId: "eteo-endo-to-every-one",
        storageBucket: "eteo-endo-to-every-one.firebasestorage.app",
        messagingSenderId: "511524282020",
        appId: "1:511524282020:web:5a25c021fd84f026969031"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================
    // LEVEL_ID FOR THIS QUIZ
    // ============================================
    const LEVEL_ID = "future_docteur_v1_debutant1_es";

    // ============================================
    // =========== 1. VOICE SYSTEM ===============
    // ============================================
    
    let isSpeaking = false;
    let voiceReady = false;
    let voiceActivated = false;
    let lastAnswerCorrect = false;
    let lastCorrectAnswer = "";
    let lastPointsEarned = 0;
    let scenarioTextClean = "";

    // ============================================
    // 🔥 FUNCTION: REACTIVATE ALL BUTTONS
    // ============================================
    function resetAllVoiceButtons() {
        console.log("🔄 resetAllVoiceButtons() - Reactivating ALL buttons");
        
        const qBtn = document.getElementById('voiceQuestionBtn');
        if (qBtn) {
            qBtn.disabled = false;
            qBtn.textContent = '🔊 Read question';
            console.log("✅ voiceQuestionBtn reactivated");
        }
        
        const fBtn = document.getElementById('voiceFeedbackBtn');
        if (fBtn) {
            fBtn.disabled = false;
            fBtn.textContent = '🔊 Re-listen to feedback';
            console.log("✅ voiceFeedbackBtn reactivated");
        }
        
        const eBtn = document.getElementById('voiceExplanationBtn');
        if (eBtn) {
            eBtn.disabled = false;
            eBtn.textContent = '🔊 Read explanation';
            console.log("✅ voiceExplanationBtn reactivated");
        }
        
        const rBtn = document.getElementById('voiceResultBtn');
        if (rBtn) {
            rBtn.disabled = false;
            rBtn.textContent = '🔊 Listen to your result';
            console.log("✅ voiceResultBtn reactivated");
        }
        
        isSpeaking = false;
        updateVoiceIndicator('active');
        console.log("✅ All voice buttons are ACTIVE!");
    }

    // ============================================
    // 🔥 FUNCTION: STOP VOICE
    // ============================================
    function stopSpeaking() {
        console.log("🔊 stopSpeaking() called");
        
        // 1. Capacitor TTS (Android)
        try {
            if (window.Capacitor?.Plugins?.TextToSpeech) {
                window.Capacitor.Plugins.TextToSpeech.stop();
                console.log("✅ Android stop performed");
            }
        } catch(e) { 
            console.log("⚠️ Android stop error:", e); 
        }
        
        // 2. Web Speech API
        try {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                console.log("✅ Web Speech stop performed");
            }
        } catch(e) { 
            console.log("⚠️ Web Speech stop error:", e); 
        }
        
        // 3. Reset state
        isSpeaking = false;
        console.log("✅ isSpeaking reset to false");
        
        // 4. Update indicator
        updateVoiceIndicator('active');
        
        // 5. Reactivate ALL buttons
        resetAllVoiceButtons();
    }

    // ============================================
    // 🔥 FUNCTION: WEB SPEECH FALLBACK
    // ============================================
    function fallbackWebSpeech(text, lang, callback) {
        console.log("🔊 fallbackWebSpeech() called");
        
        if (!window.speechSynthesis) {
            console.error("❌ Web Speech not available");
            if (callback) callback();
            return;
        }
        
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'en-US';  // ✅ ENGLISH VOICE
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            let callbackExecuted = false;
            
            const safeCallback = function() {
                if (!callbackExecuted) {
                    callbackExecuted = true;
                    console.log("✅ Web Speech callback executed");
                    if (callback) callback();
                }
            };
            
            utterance.onend = function() {
                console.log("✅ Web Speech finished (onend)");
                safeCallback();
            };
            
            utterance.onerror = function(e) {
                console.error("❌ Web Speech error:", e);
                safeCallback();
            };
            
            window.speechSynthesis.speak(utterance);
            
            setTimeout(function() {
                if (!callbackExecuted) {
                    console.warn("⚠️ TIMEOUT Web Speech - Forcing callback");
                    safeCallback();
                }
            }, 5000);
            
        } catch (error) {
            console.error("❌ Error in fallbackWebSpeech:", error);
            if (callback) callback();
        }
    }

    // ============================================
    // 🔥 FUNCTION: SPEAK (Capacitor + Web Speech)
    // ============================================
    function speak(text, lang, callback) {
        console.log("🔊 speak() called with:", text.substring(0, 50) + '...');
        
        if (!text) { 
            console.log("⚠️ Empty text, immediate callback");
            if (callback) callback(); 
            return; 
        }
        
        const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
        
        let callbackExecuted = false;
        
        const safeCallback = function() {
            if (!callbackExecuted) {
                callbackExecuted = true;
                console.log("✅ safeCallback() executed");
                isSpeaking = false;
                if (callback) callback();
            }
        };
        
        try {
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("🔊 Using Capacitor TTS plugin on Android");
                const TTS = window.Capacitor.Plugins.TextToSpeech;
                
                TTS.speak({ 
                    text: text, 
                    lang: lang || 'en-US',  // ✅ ENGLISH VOICE
                    rate: 0.9, 
                    pitch: 1.0, 
                    volume: 1.0 
                }).then(() => {
                    console.log("✅ Capacitor TTS finished");
                    setTimeout(safeCallback, 300);
                }).catch((error) => {
                    console.error("❌ Capacitor TTS error:", error);
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback to Web Speech");
                        fallbackWebSpeech(text, lang || 'en-US', safeCallback);
                    } else {
                        safeCallback();
                    }
                });
                
                setTimeout(function() {
                    if (!callbackExecuted) {
                        console.warn("⚠️ TIMEOUT Capacitor TTS - Forcing callback");
                        safeCallback();
                    }
                }, 5000);
                
            } else if (window.speechSynthesis) {
                console.log("🔊 Using Web Speech API");
                fallbackWebSpeech(text, lang || 'en-US', safeCallback);
                
            } else {
                console.error("❌ No TTS engine available");
                safeCallback();
            }
        } catch (error) {
            console.error("❌ ERROR in speak():", error);
            safeCallback();
        }
    }

    function activateVoice() {
        console.log("🔊 activateVoice() called");
        if (!voiceActivated) {
            const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
            console.log("🔊 isAndroid =", isAndroid);
            
            // First check if Capacitor TTS is available
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("✅ Capacitor TTS available on Android");
                voiceReady = true;
                voiceActivated = true;
                updateVoiceIndicator('active');
            } 
            // Web Speech fallback
            else if (window.speechSynthesis) {
                console.log("✅ Web Speech available");
                voiceReady = true;
                voiceActivated = true;
                // Force voice loading
                window.speechSynthesis.getVoices();
                updateVoiceIndicator('active');
            } else {
                console.warn("⚠️ No speech synthesis available");
                voiceReady = false;
                voiceActivated = true;
                updateVoiceIndicator('inactive');
            }
            console.log("✅ Voice activated, voiceReady =", voiceReady);
        } else {
            console.log("ℹ️ Voice already activated");
        }
    }

    function updateVoiceIndicator(status) {
        const indicator = document.getElementById('voiceIndicator');
        const statusText = document.getElementById('voiceStatus');
        
        if (!indicator) return;
        
        indicator.classList.remove('active', 'speaking');
        
        if (status === 'inactive') {
            indicator.style.display = 'none';
            return;
        }
        
        indicator.style.display = 'flex';
        
        if (status === 'active') {
            indicator.classList.add('active');
            if (statusText) statusText.textContent = '🔊 Ready';
        } else if (status === 'speaking') {
            indicator.classList.add('speaking');
            if (statusText) statusText.textContent = '🔊 Speaking...';
        }
    }

            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: especialidad,
                niveau: nivel,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()

            speak(scenarioTextClean, 'en-US', function() {
                console.log("✅ Scenario auto-read finished");

                updateVoiceIndicator('active');

                resetAllVoiceButtons();

        document.getElementById('btnEscucharEscenario').addEventListener('click', function() {
            const btn = this;
            const statusEl = document.getElementById('scenarioStatus');
            
            if (isSpeaking) {
                // ⏹️ STOP
                stopSpeaking();
                // stopSpeaking() already calls resetAllVoiceButtons()
                btn.textContent = '🔊 Re-listen';
                if (statusEl) {
                    statusEl.textContent = '⏸️ Paused';
                    statusEl.className = 'modal-status';
                }
            } else {
                // ▶️ PLAY
                if (scenarioTextClean) {
                    btn.textContent = '⏹️ Stop';
                    if (statusEl) {
                        statusEl.textContent = '🔊 Reading...';
                        statusEl.className = 'modal-status playing';
                    }
                    isSpeaking = true;
                    updateVoiceIndicator('speaking');
                    
                    speak(scenarioTextClean, 'en-US', function() {
                        console.log("✅ Scenario re-read finished");
                        isSpeaking = false;
                        updateVoiceIndicator('active');
                        
                        const statusEl2 = document.getElementById('scenarioStatus');
                        const btn2 = document.getElementById('btnEscucharEscenario');
                        
                        if (statusEl2) {
                            statusEl2.textContent = '✅ Scenario read. Ready to start!';
                            statusEl2.className = 'modal-status';
                        }
                        if (btn2) {
                            btn2.textContent = '🔊 Re-listen';
                        }
                        
                        // ✅ CRUCIAL: Reactivate all voice buttons
                        resetAllVoiceButtons();
                    });
                }
            }
        });
    }

    async function sendScoreToFirebase(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Anonymous";
        const userCountry = localStorage.getItem("eteo_userCountry") || "MA";
        
        const scoreData = {
            nom: userName,
            pays: userCountry,
            score: score,
            maxScore: maxScore,
            percentage: percentage,
            levelId: LEVEL_ID,
            date: new Date().toISOString(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection('scores').add(scoreData);
            console.log("✅ Score sent to Firebase!");
            return true;
        } catch (error) {

            return false;
        }
    }

            "Lower prices",
            "Call every day"
        ],
        correct: 1,
        explanation: "Dr. Leila: 'Karim, loyalty is built on quality care, listening, regular follow-up, and a relationship of trust. No gifts, just rigor and empathy.'"
    },

    // ============================================
    // PATIENT BASE AND COMMUNICATION (4 questions)
    // ============================================
    {
        question: "To attract your first patients, you should prioritize:",
        options: [
            "Paid advertising",
            "Word of mouth",
            "Social media",
            "Price reductions"
        ],
        correct: 1,
        explanation: "Dr. Leila: 'Karim, word of mouth and networking with colleagues are the most effective ways to attract your first patients. A satisfied patient brings another.'"
    },

            "Regular gifts",
            "Extended hours"
        ],
        correct: 0,
        explanation: "Dr. Leila: 'Karim, loyalty is built on quality care, listening, regular follow-up, and a trusting relationship.'"
    },
    {
        question: "Communication with patients should be:",
        options: [
            "Very technical and precise",
            "Clear and understandable",
            "Minimal and quick",
            "Only visual"
        ],
        correct: 1,
        explanation: "Dr. Leila: 'Karim, clear communication with simple words is essential. The patient must understand their treatment, options, and costs. This builds trust.'"
    },

    // ============================================
    // BALANCE AND RESILIENCE (4 questions)
    // ============================================
    {
        question: "To avoid burnout, you should:",
        options: [
            "Work non-stop",
            "Set clear boundaries",
            "Accept all patients",
            "Take medication"
        ],
        correct: 1,
        explanation: "Dr. Leila: 'Karim, burnout is a real risk. Set boundaries, take breaks, delegate certain tasks, and don't hesitate to consult a colleague if you feel exhausted.'"
    },
    {
        question: "To manage first-year stress:",
        options: [
            "Isolate completely",
            "Accept imperfection",
            "Work more",
            "Read motivational books"
        ],
        correct: 1,
        explanation: "Dr. Leila: 'Karim, the first year is demanding. Accept that not everything will be perfect. Learn from your mistakes and celebrate your small victories. Stress decreases with experience.'"
    },
    {
        question: "To preserve your social life, you must:",
        options: [
            "Work without rest",
            "Organize free time",
            "Wait until you're established",
            "See friends only on weekends"
        ],
        correct: 1,
        explanation: "Dr. Leila: 'Karim, maintaining balance is essential. Organizing time for personal life, hobbies, and loved ones allows you to last over time. Don't sacrifice everything for work.'"
    },
    {
        question: "The key to success for a young doctor is:",
        options: [
            "Making a lot of money",
            "Lifelong learning",
            "Having self-confidence",
            "Finding a good location"
        ],
        correct: 2,
        explanation: "Dr. Leila: 'Karim, self-confidence is the key. Accept that you're not perfect, surround yourself with kind people, and keep learning. The road is long, but you will succeed.'"
    }
];

    // ============================================
    // =========== CRUCIAL FIX ===================
    // ============================================
    const MAX_SCORE = questions.length * 15;
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("future_docteur_v1_debutant1_es", JSON.stringify({ 
            score: finalScore, 
            maxScore: maxScore,
            percentage: percentage,
            date: new Date().toISOString() 
        }));
        return percentage;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function renderQuestion() {
        console.log("🔍 renderQuestion() - Question", currentQuestion + 1);
        stopSpeaking();
        
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${letter}. ${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header">
                <h1>🎓 Future Doctor - Beginner Level 1</h1>
                <div class="subtitle">Question ${currentQuestion + 1}/${questions.length}</div>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                
                <div class="voice-btn-row">
                    <button class="voice-btn" id="voiceQuestionBtn">🔊 Read question</button>
                </div>
                
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                
                <div id="feedbackContainer" style="display: none;"></div>
                
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Explanation:</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                    <div class="voice-btn-row">
                        <button class="voice-btn explanation-btn-style" id="voiceExplanationBtn" style="display: none;">🔊 Read explanation</button>
                    </div>
                </div>
                
                <div class="timer">⏱️ Time remaining: <span id="timer">${timeLeft}</span> seconds</div>
                <div class="score">🏆 Current score: ${score}/${MAX_SCORE}</div>
                
                <div style="margin: 10px 0;">
                    <button class="btn-progression" onclick="irAProgresion()">📊 My progress</button>
                </div>
                
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandon</button>
                    <button class="nav-btn" onclick="nextQuestion()">Next →</button>
                </div>
            </div>
        `;
        
        attachVoiceEvents();
        answerLocked = false;
        startTimer();
        lastAnswerCorrect = false;
        lastCorrectAnswer = "";
        lastPointsEarned = 0;
        
        setTimeout(() => {
            speakQuestionOnly();
        }, 500);
    }

    // ============================================
    // =========== ATTACH VOICE EVENTS ============
    // ============================================
    function attachVoiceEvents() {
        const voiceBtn = document.getElementById('voiceQuestionBtn');
        if (voiceBtn) {
            const newVoiceBtn = voiceBtn.cloneNode(true);
            voiceBtn.parentNode.replaceChild(newVoiceBtn, voiceBtn);
            newVoiceBtn.addEventListener('click', speakQuestionOnly);
            console.log("✅ Event attached to voiceQuestionBtn");
        }
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn && explBtn.style.display !== 'none') {
            const newExplBtn = explBtn.cloneNode(true);
            explBtn.parentNode.replaceChild(newExplBtn, explBtn);
            newExplBtn.addEventListener('click', speakExplanation);
            console.log("✅ Event attached to voiceExplanationBtn");
        }
    }

    function checkAnswer(selectedIndex) {
        console.log("🔍 checkAnswer() - Option", String.fromCharCode(65 + selectedIndex));
        
        stopSpeaking();
        
        if (answerLocked) {
            console.log("⏳ Answer already locked");
            return;
        }

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        lastAnswerCorrect = isCorrect;
        lastCorrectAnswer = shuffledOptions[currentCorrectIndex];
        lastPointsEarned = pointsEarned;

        if (isCorrect) {
            score += pointsEarned;
            console.log("✅ Correct answer! +", pointsEarned, "points");
        } else {
            console.log("❌ Wrong answer. Correct answer:", shuffledOptions[currentCorrectIndex]);
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        const feedbackContainer = document.getElementById('feedbackContainer');
        if (feedbackContainer) {
            const feedbackClass = isCorrect ? 'feedback-container' : 'feedback-container wrong';
            feedbackContainer.style.display = 'block';
            feedbackContainer.className = feedbackClass;
            
            let pointsDisplay = '';
            if (isCorrect) {
                pointsDisplay = `<span class="points-badge correct">+${pointsEarned} points</span>`;
            } else {
                pointsDisplay = `<span class="points-badge wrong">(0 points)</span>`;
            }
            
            feedbackContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        ${isCorrect ? '✅ Correct answer!' : '❌ Incorrect answer'}
                        ${pointsDisplay}
                    </div>
                    <button class="voice-btn feedback-btn-style" id="voiceFeedbackBtn">🔊 Re-listen to feedback</button>
                </div>
            `;
            
            const feedbackBtn = document.getElementById('voiceFeedbackBtn');
            if (feedbackBtn) {
                const newFeedbackBtn = feedbackBtn.cloneNode(true);
                feedbackBtn.parentNode.replaceChild(newFeedbackBtn, feedbackBtn);
                newFeedbackBtn.addEventListener('click', speakFeedback);
                console.log("✅ Event attached to voiceFeedbackBtn");
            }
        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Correct answer: ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn) {
            explBtn.style.display = 'inline-block';
            attachVoiceEvents();
        }
        
        document.querySelector('.score').innerHTML = `🏆 Current score: ${score}/${MAX_SCORE}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
        
        let feedbackText = "";
        if (isCorrect) {
            feedbackText = `Correct answer! +${pointsEarned} points.`;
        } else {
            feedbackText = `Incorrect answer. The correct answer was: ${shuffledOptions[currentCorrectIndex]}.`;
        }
        
        console.log("🔊 Automatic feedback reading");
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(feedbackText, "en-US", function() {
            console.log("✅ Automatic feedback finished");
            resetAllVoiceButtons();
        });
    }

    function nextQuestion() {
        console.log("🔍 nextQuestion() called");
        stopSpeaking();
        
        if (!answerLocked) {
            console.log("⚠️ Please answer before continuing");
            return;
        }
        currentQuestion++;
        timeLeft = 30;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    // ============================================
    // =========== NAVIGATION ====================
    // ============================================
    
    function goToMenu() {
        stopSpeaking();
        window.location.href = "menu_es.html";
    }

    function goToDashboard() {
        stopSpeaking();
        window.location.href = "../../../../clasificaciones_dashboard_es.html";
    }

    function goToRanking() {
        goToDashboard();
    }

    // ============================================
    // =========== endQuiz ========================
    // ============================================
    function endQuiz() {
        console.log("🔍 endQuiz() called");
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        
        const percentage = (score / MAX_SCORE) * 100;
        
        saveScore(score, MAX_SCORE);
        
        const isUnlocked = unlockLevel2(percentage);
        
        guardarValidacion('Futuro_Doctor', 'principiante1', score, MAX_SCORE);
        
        sendScoreToFirebase(score, MAX_SCORE, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 Quiz completed!</h1>
                <div class="final-score">Score: ${score}/${MAX_SCORE}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Percentage: <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${isUnlocked ? 
                        '<div class="unlock-badge">✅ Beginner Level 2 unlocked! 🎊</div>' : 
                        '<div class="locked-badge">⚠️ Insufficient score (minimum 60% required to unlock the next level)</div>'}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${isUnlocked ? 
                        '📚 Go to the menu to access Level 2.' : 
                        `💪 You need ${(60 - percentage).toFixed(1)}% more to unlock Level 2. Try again!`}
                </div>
                
                <div class="voice-btn-row">
                    <button class="voice-btn result-btn-style" id="voiceResultBtn">🔊 Listen to your result</button>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0;">
                    <button class="share-btn" onclick="shareScore()">📤 Share my score</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Give feedback</button>
                    <button class="ranking-btn" onclick="goToDashboard()">🏆 World ranking</button>
                </div>
                
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Main menu</button>
                    <button class="btn-progression" onclick="irAProgresion()">📊 My progress</button>
                </div>
            </div>
        `;
        
        const resultBtn = document.getElementById('voiceResultBtn');
        if (resultBtn) {
            const newResultBtn = resultBtn.cloneNode(true);
            resultBtn.parentNode.replaceChild(newResultBtn, resultBtn);
            newResultBtn.addEventListener('click', speakFinalResult);
            console.log("✅ Event attached to voiceResultBtn");
        }
        
        setTimeout(() => {
            speakFinalResult();
        }, 1000);
        
        setTimeout(() => {
            openRankingModal();
        }, 2000);
    }

    // ============================================
    // =========== RANKING MODAL ==================
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anonymous";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 No scores recorded for this level yet.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Your ranking</div>
                        <div class="rank-number">${userRank}th position</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} points (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 You're not in the ranking for this level yet</div>
                        <div>Take the quiz again to appear!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #8a4aaa;">🏆 TOP 20 - Future Doctor Beginner 1</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(138,74,170,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anonymous"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 No scores for this level</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Firestore error:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Could not load ranking.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Unknown error'}</span></div>`;
        }
    }

    function abandonQuiz() {
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("future_docteur_v1_debutant1_es", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel2(partialPercentage);
        guardarValidacion('Futuro_Doctor', 'principiante1', score, MAX_SCORE);
        
        sendScoreToFirebase(score, MAX_SCORE, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>❌ Quiz abandoned</h1>
                <div class="final-score">Partial score: ${score}/${MAX_SCORE}</div>
                <div>Percentage: ${partialPercentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">🏆 This score has been recorded in the ranking.</div>
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Back to menu</button>
                    <button class="btn-progression" onclick="irAProgresion()">📊 My progress</button>
                </div>
            </div>
        `;
        speak(`Quiz abandoned. Partial score: ${score} out of ${MAX_SCORE}.`, "en-US");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE) * 100;
        const text = `🎓 ETEO - Future Doctor\nMy score in Beginner Level 1: ${score}/${MAX_SCORE} (${percentage.toFixed(1)}%)\nChallenge me on ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Score', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Score copied to clipboard!");
            }).catch(() => {
                alert("📋 To share, copy this text:\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        console.log("🚀 startQuiz() called");
        closeScenarioPopup();
        saveUserInfo();
        console.log("🔊 Activating voice...");
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
        console.log("✅ Quiz started");
    }

    // ============================================
    // =========== INITIALIZATION ================
    // ============================================
    console.log("🚀 Page loaded - ETEO Future Doctor Quiz (EN)");
    console.log("📱 window.Capacitor =", window.Capacitor);
    
    if (window.Capacitor) {
        console.log("📱 Platform =", window.Capacitor.getPlatform());
        console.log("📱 Plugins =", Object.keys(window.Capacitor.Plugins || {}));
    }
    
    showWelcomeScreen();

    // ✅ Show scenario after a short delay
    setTimeout(() => {
        showScenarioPopup();
    }, 800);

    // ✅ ACTIVATE VOICE IMMEDIATELY
    setTimeout(() => {
        activateVoice();
    }, 100);
</script>
