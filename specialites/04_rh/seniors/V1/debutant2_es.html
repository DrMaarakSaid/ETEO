<script>
    // ============================================
    // =========== CONFIGURACIÓN FIREBASE =========

    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",

    // ============================================
    // LEVEL_ID PARA ESTE QUIZ
    // ============================================
    const LEVEL_ID = "seniors_v1_debutant2_es";

    // ============================================
    // =========== 1. SISTEMA DE VOZ ==============
    // ============================================
    let speechSynthesisObj = null;
    let voiceReady = false;

    function initVoice() {
        if ('speechSynthesis' in window) {
            speechSynthesisObj = window.speechSynthesis;
            voiceReady = true;
            return true;
        }
        return false;
    }

    function speak(text, lang) {
        if (!voiceReady || !speechSynthesisObj) return;
        try {
            speechSynthesisObj.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            
            const voices = speechSynthesisObj.getVoices();
            let selectedVoice = voices.find(v => v.lang.startsWith('es') && v.localService === true);
            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.startsWith('es'));
            }
            if (selectedVoice) utterance.voice = selectedVoice;
            
            speechSynthesisObj.speak(utterance);
        } catch(e) {}
    }

    function stopSpeaking() {
        if (voiceReady && speechSynthesisObj) {
            speechSynthesisObj.cancel();
        }
    }

    let voiceActivated = false;

    function activateVoice() {
        if (!voiceActivated) {
            initVoice();
            voiceActivated = true;
            const indicator = document.getElementById('voiceIndicator');
            if (indicator) {
                indicator.textContent = "🎙️ IA activada";
                indicator.style.background = "#daa520";
                indicator.style.color = "#2a4a6a";
                setTimeout(() => {
                    indicator.style.opacity = "0.5";
                }, 2000);
            }
        }
        return true;
    }

    // ============================================
    // =========== 2. INFO USUARIO ===============
    // ============================================
    function getUserName() { return localStorage.getItem("eteo_userName") || ""; }
    function getUserCountry() { return localStorage.getItem("eteo_userCountry") || "MA"; }

    function saveUserInfo() {
        const name = document.getElementById("userName").value.trim();
        const select = document.getElementById("userCountry");
        const otherInput = document.getElementById("otherCountry");
        let country = select.value;
        
        if (otherInput.value.trim() !== "") {
            country = otherInput.value.trim();
        }
        
        localStorage.setItem("eteo_userName", name === "" ? "Anónimo" : name);
        localStorage.setItem("eteo_userCountry", country);
    }

    // ============================================
    // =========== FUNCIÓN DESBLOQUEO ============
    // ============================================
    function unlockLevel3(percentage) {
        if (percentage >= 60) {
            localStorage.setItem("seniors_v1_intermediaire1_es_unlocked", "true");
            return true;
        }
        return false;
    }

    // ================================================================
    // 🔥 GUARDAR VALIDACIÓN PARA PROGRESO.HTML
    // ================================================================
    function guardarValidacion(especialidad, nivel, score, total) {
        const percentage = (score / total) * 100;
        
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: especialidad,
                niveau: nivel,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progreso = JSON.parse(localStorage.getItem('eteo_progreso')) || {};
            const key = especialidad + '_' + nivel;
            progreso[key] = true;
            localStorage.setItem('eteo_progreso', JSON.stringify(progreso));
            
            console.log('✅ Validación guardada para progreso.html');
        }
    }

    // ============================================
    // =========== 3. POPUP ESCENARIO ============
    // ============================================
    let scenarioPlaying = false;
    let scenarioStarted = false;

    function showScenarioPopup() {
        const modal = document.createElement('div');
        modal.id = 'scenarioModal';
        modal.innerHTML = `
            <div class="modal-content">
                <button class="modal-close" onclick="closeScenarioPopup()">✕</button>
                <div class="modal-icon">💔</div>
                <div class="modal-title">📖 La ausencia imprevista</div>
                <div class="modal-text" id="scenarioText">
                    <span class="serious">🔴 Contexto :</span> El Doctor Ahmed (62 años) ha fallecido bruscamente. No había preparado nada. Su esposa Nadia, sus hijos Karim y Salma están perdidos.<br><br>
                    <span class="serious">🌸 Apoyo :</span> La Doctora Sofia, la amiga de Ahmed, los acompaña en esta prueba.<br><br>
                    <span class="serious">📋 Objetivo :</span> Comprender cómo gestionar un consultorio tras el fallecimiento del dentista, los aspectos legales, y la importancia de preparar la sucesión.
                </div>
                <div class="modal-status waiting" id="scenarioStatus">👆 Haga clic en cualquier lugar para escuchar el escenario</div>
                <div class="modal-footer">
                    <button class="modal-btn" id="btnEscucharEscenario">🔊 Re-escuchar</button>
                    <button class="modal-btn secondary" onclick="closeScenarioPopup()">✅ ¡Entendido, comencemos!</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        
        // 🔥 INICIAR LECTURA AL PRIMER CLIC
        const startScenario = function() {
            if (scenarioStarted) return;
            scenarioStarted = true;
            
            activateVoice();
            
            const scenarioText = document.getElementById('scenarioText');
            if (scenarioText) {
                const text = scenarioText.textContent;
                const cleanText = text.replace(/[🔴🌸📋💔]/g, '').trim();
                speak(cleanText, 'es-ES');
                const statusEl = document.getElementById('scenarioStatus');
                if (statusEl) {
                    statusEl.textContent = '🔊 Lectura en curso...';
                    statusEl.className = 'modal-status playing';
                }
                scenarioPlaying = true;
                
                setTimeout(() => {
                    const statusEl2 = document.getElementById('scenarioStatus');
                    if (statusEl2 && scenarioPlaying) {
                        statusEl2.textContent = '✅ Escenario leído. ¡Listo para comenzar!';
                        statusEl2.className = 'modal-status';
                    }
                }, 30000);
            }
            
            document.removeEventListener('click', startScenario);
        };
        
        document.addEventListener('click', startScenario);
        
        document.getElementById('btnEscucharEscenario').addEventListener('click', function() {
            stopSpeaking();
            const scenarioText = document.getElementById('scenarioText');
            if (scenarioText) {
                const text = scenarioText.textContent;
                const cleanText = text.replace(/[🔴🌸📋💔]/g, '').trim();
                speak(cleanText, 'es-ES');
                const statusEl = document.getElementById('scenarioStatus');
                if (statusEl) {
                    statusEl.textContent = '🔊 Re-escuchando...';
                    statusEl.className = 'modal-status playing';
                }
            }
        });
    }

    function closeScenarioPopup() {
        stopSpeaking();
        const modal = document.getElementById('scenarioModal');
        if (modal) {
            modal.remove();
        }
        scenarioPlaying = false;
        scenarioStarted = true;
    }

    const MAX_SCORE = questions.length * 15;
    let currentQuestion = 0;
    let score = 0;

    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("seniors_v1_debutant2_es", JSON.stringify({ 
            score: finalScore, 
            maxScore: maxScore,
            percentage: percentage,
            date: new Date().toISOString() 
        }));
        return percentage;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    speak("¡Tiempo agotado! Pasamos a la siguiente pregunta.", "es-ES");
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function speakCurrentQuestion() {
        const correctedText = `Pregunta ${currentQuestion + 1} : ${questions[currentQuestion].question}`;
        speak(correctedText, "es-ES");
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header">
                <h1>👴 Seniors - Principiante Nivel 2</h1>
                <div class="subtitle">Pregunta ${currentQuestion + 1}/${questions.length}</div>
            </div>

            <div class="question-container">

        answerLocked = false;
        startTimer();
        setTimeout(() => speakCurrentQuestion(), 500);

    function checkAnswer(selectedIndex) {
        if (answerLocked) return;

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        if (isCorrect) {
            score += pointsEarned;
            speak(`¡Respuesta correcta! +${pointsEarned} puntos.`, "es-ES");
        } else {
            speak(`Respuesta incorrecta. La respuesta correcta era : ${shuffledOptions[currentCorrectIndex]}.`, "es-ES");
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Respuesta correcta : ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        document.querySelector('.score').innerHTML = `🏆 Puntuación actual : ${score}/${MAX_SCORE}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
    }

    function nextQuestion() {

    function openBetaEvaluationPopup() {
        if (document.getElementById('betaPopup')) return;
        const userName = localStorage.getItem("eteo_userName") || "Doctor";
        
        const popup = document.createElement('div');
        popup.id = 'betaPopup';
        popup.className = 'beta-popup-overlay';
        popup.innerHTML = `
            <div class="beta-popup-content">
                <div class="big-icon">🎉🏆🎉</div>
                <h2>¡Felicitaciones ${userName}!</h2>
                <p>Ha validado los dos niveles Principiantes con éxito.</p>
                <div style="margin:25px 0;">
                    <p style="font-weight:bold;">🌟 Evalúe la versión BETA 🌟</p>
                    <div class="stars" id="starRating">
                        <span data-rating="1">☆</span>
                        <span data-rating="2">☆</span>
                        <span data-rating="3">☆</span>
                        <span data-rating="4">☆</span>
                        <span data-rating="5">☆</span>
                    </div>
                    <div class="rating-message" id="ratingMessage"></div>
                </div>
                <div class="beta-info">
                    <p>🚀 La continuación (Intermedio & Experto) llegará después de 6 meses de evaluación.</p>
                </div>
                <button class="beta-btn" onclick="closeBetaPopup()">Volver al menú</button>
            </div>
        `;
        document.body.appendChild(popup);
        
        const stars = popup.querySelectorAll('#starRating span');
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                sendBetaEvaluation(rating);
                stars.forEach((s, idx) => { 
                    s.innerHTML = idx < rating ? '★' : '☆'; 
                    s.style.color = idx < rating ? '#ffc107' : '#ccc'; 
                });
                document.getElementById('ratingMessage').innerHTML = '✅ ¡Gracias por su evaluación!';
            });
        });
    }

    function closeBetaPopup() {
        const modal = document.getElementById('betaPopup');
        if (modal) modal.remove();
        goToMenu();
    }

    async function sendBetaEvaluation(rating) {
        const userName = localStorage.getItem("eteo_userName") || "Anónimo";
        const userCountry = localStorage.getItem("eteo_userCountry") || "MA";
        try {
            await db.collection('evaluations_beta').add({
                nom: userName,
                pays: userCountry,
                note: rating,
                langue: 'es',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("✅ ¡Evaluación BETA enviada!");
        } catch(error) {
            console.error("Error Beta:", error);
        }
    }

    // ============================================
    // =========== RANKING MODAL ==================
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anónimo";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 No hay puntuaciones registradas para este nivel por el momento.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Su clasificación</div>
                        <div class="rank-number">${userRank}e posición</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} puntos (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Todavía no está en la clasificación de este nivel</div>
                        <div>¡Vuelva a hacer el quiz para aparecer!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #daa520;">🏆 TOP 20 - Seniors Principiante 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(218,165,32,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anónimo"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 No hay puntuaciones para este nivel</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Error Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ No se pudo cargar la clasificación.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Error desconocido'}</span></div>`;
        }
    }

    function abandonQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("seniors_v1_debutant2_es", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        unlockLevel3(partialPercentage);
        guardarValidacion('Seniors', 'principiante2', score, MAX_SCORE);
        sendScoreToFirebase(score, MAX_SCORE, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `<div class="result-container"><h1>❌ Quiz abandonado</h1><div class="final-score">Puntuación parcial : ${score}/${MAX_SCORE}</div><div>Porcentaje : ${partialPercentage.toFixed(1)}%</div><div style="margin:20px 0;">🏆 Esta puntuación ha sido registrada en la clasificación.</div><button class="menu-btn" onclick="goToMenu()">🏠 Volver al menú</button></div>`;
        speak(`Quiz abandonado. Puntuación parcial : ${score} sobre ${MAX_SCORE}.`, "es-ES");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE) * 100;
        const text = `🎓 ETEO - Seniors\nMi puntuación en el nivel Principiante 2 : ${score}/${MAX_SCORE} (${percentage.toFixed(1)}%)\n¡Desafíame en ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Puntuación', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ ¡Puntuación copiada al portapapeles!");
            }).catch(() => {
                alert("📋 Para compartir, copie este texto :\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        closeScenarioPopup();
        saveUserInfo();
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
    }

    // ============================================
    // =========== INICIALIZACIÓN ================
    // ============================================
    showWelcomeScreen();

    setTimeout(() => {
        showScenarioPopup();
    }, 800);

    document.body.addEventListener('click', function firstClick() {
        activateVoice();
        document.body.removeEventListener('click', firstClick);
    });
</script>
