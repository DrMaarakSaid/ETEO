<script>

    // =========== КОНФИГУРАЦИЯ FIREBASE =========

    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",

    // ============================================
    // LEVEL_ID ДЛЯ ЭТОГО ВИКТОРИНЫ
    // ============================================
    const LEVEL_ID = "ethique_deontologie_v1_debutant1_fr";

    // ============================================
    // =========== 1. ГОЛОСОВАЯ СИСТЕМА ==========
    // ============================================
    
    let isSpeaking = false;
    let voiceReady = false;
    let voiceActivated = false;
    let lastAnswerCorrect = false;
    let lastCorrectAnswer = "";
    let lastPointsEarned = 0;

    // ============================================
    // 🔥 ФУНКЦИЯ: РЕАКТИВИРОВАТЬ ВСЕ КНОПКИ
    // ============================================
    function resetAllVoiceButtons() {
        console.log("🔄 resetAllVoiceButtons() - Реактивация ВСЕХ кнопок");
        
        const qBtn = document.getElementById('voiceQuestionBtn');
        if (qBtn) {
            qBtn.disabled = false;
            qBtn.textContent = '🔊 Прочитать вопрос';
            console.log("✅ voiceQuestionBtn реактивирован");
        }
        
        const fBtn = document.getElementById('voiceFeedbackBtn');
        if (fBtn) {
            fBtn.disabled = false;
            fBtn.textContent = '🔊 Прослушать ответ снова';
            console.log("✅ voiceFeedbackBtn реактивирован");
        }
        
        const eBtn = document.getElementById('voiceExplanationBtn');
        if (eBtn) {
            eBtn.disabled = false;
            eBtn.textContent = '🔊 Прочитать объяснение';
            console.log("✅ voiceExplanationBtn реактивирован");
        }
        
        const rBtn = document.getElementById('voiceResultBtn');
        if (rBtn) {
            rBtn.disabled = false;
            rBtn.textContent = '🔊 Прослушать результат';
            console.log("✅ voiceResultBtn реактивирован");
        }
        
        isSpeaking = false;
        updateVoiceIndicator('active');
        console.log("✅ Все голосовые кнопки теперь АКТИВНЫ!");
    }

    // ============================================
    // 🔥 ФУНКЦИЯ: ОСТАНОВИТЬ ВОСПРОИЗВЕДЕНИЕ
    // ============================================
    function stopSpeaking() {
        console.log("🔊 stopSpeaking() вызван");
        
        try {
            if (window.Capacitor?.Plugins?.TextToSpeech) {
                window.Capacitor.Plugins.TextToSpeech.stop();
                console.log("✅ Остановка Android выполнена");
            }
        } catch(e) { console.log("⚠️ Ошибка остановки Android:", e); }
        
        try {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                console.log("✅ Остановка Web Speech выполнена");
            }
        } catch(e) { console.log("⚠️ Ошибка остановки Web Speech:", e); }
        
        isSpeaking = false;
        console.log("✅ isSpeaking сброшен на false");
        resetAllVoiceButtons();
    }

    // ============================================
    // 🔥 ФУНКЦИЯ: РЕЗЕРВНЫЙ WEB SPEECH
    // ============================================
    function fallbackWebSpeech(text, lang, callback) {
        console.log("🔊 fallbackWebSpeech() вызван");
        
        if (!window.speechSynthesis) {
            console.error("❌ Web Speech недоступен");
            if (callback) callback();
            return;
        }
        
        try {
            window.speechSynthesis.cancel();
            
            // Исправление сокращений для русского языка
            let correctedText = text;
            if (lang === 'ru-RU' || lang === 'ru') {
                correctedText = correctedText.replace(/Dr\.?\s+/g, 'Доктор ');
                correctedText = correctedText.replace(/Pr\.?\s+/g, 'Профессор ');
            }
            
            const utterance = new SpeechSynthesisUtterance(correctedText);
            utterance.lang = lang || 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            // ✅ НЕ ПРИНУЖДАТЬ ГОЛОС - Позволить системе выбрать
            
            let callbackExecuted = false;
            
            const safeCallback = function() {
                if (!callbackExecuted) {
                    callbackExecuted = true;
                    console.log("✅ Callback Web Speech выполнен");
                    if (callback) callback();
                }
            };
            
            utterance.onend = function() {
                console.log("✅ Web Speech завершен (onend)");
                safeCallback();
            };
            
            utterance.onerror = function(e) {
                console.error("❌ Ошибка Web Speech:", e);
                safeCallback();
            };
            
            window.speechSynthesis.speak(utterance);
            
            setTimeout(function() {
                if (!callbackExecuted) {
                    console.warn("⚠️ ТАЙМАУТ Web Speech - Принудительный вызов callback");
                    safeCallback();
                }
            }, 5000);
            
        } catch (error) {
            console.error("❌ Ошибка в fallbackWebSpeech:", error);
            if (callback) callback();
        }
    }

    // ============================================
    // 🔥 ФУНКЦИЯ: SPEAK (Capacitor + Web Speech)
    // ============================================
    function speak(text, lang, callback) {
        console.log("🔊 speak() вызван с текстом:", text.substring(0, 50) + '...');
        
        if (!text) { 
            console.log("⚠️ Пустой текст, немедленный callback");
            if (callback) callback(); 
            return; 
        }
        
        const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
        
        let callbackExecuted = false;
        
        const safeCallback = function() {
            if (!callbackExecuted) {
                callbackExecuted = true;
                console.log("✅ safeCallback() выполнен");
                isSpeaking = false;
                if (callback) callback();
            }
        };
        
        try {
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("🔊 Использование плагина Capacitor TTS на Android");
                const TTS = window.Capacitor.Plugins.TextToSpeech;
                
                TTS.speak({ 
                    text: text, 
                    lang: lang || 'ru-RU', 
                    rate: 0.9, 
                    pitch: 1.0, 
                    volume: 1.0 
                }).then(() => {
                    console.log("✅ Capacitor TTS завершен");
                    setTimeout(safeCallback, 300);
                }).catch((error) => {
                    console.error("❌ Ошибка Capacitor TTS:", error);
                    if (window.speechSynthesis) {
                        console.log("⚠️ Резервный Web Speech");
                        fallbackWebSpeech(text, lang, safeCallback);
                    } else {
                        safeCallback();
                    }
                });
                
                setTimeout(function() {
                    if (!callbackExecuted) {
                        console.warn("⚠️ ТАЙМАУТ Capacitor TTS - Принудительный вызов callback");
                        safeCallback();
                    }
                }, 5000);
                
            } else if (window.speechSynthesis) {
                console.log("🔊 Использование Web Speech API");
                fallbackWebSpeech(text, lang, safeCallback);
                
            } else {
                console.error("❌ Нет доступного TTS движка");
                safeCallback();
            }
        } catch (error) {
            console.error("❌ ОШИБКА в speak():", error);
            safeCallback();
        }
    }

    // ============================================
    // 🔥 АКТИВАЦИЯ ГОЛОСА
    // ============================================
    function activateVoice() {
        console.log("🔊 activateVoice() вызван");
        if (!voiceActivated) {
            const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
            console.log("🔊 isAndroid =", isAndroid);
            
            if (isAndroid) {
                if (window.Capacitor?.Plugins?.TextToSpeech) {
                    console.log("✅ Capacitor TTS доступен на Android");
                    voiceReady = true;
                    voiceActivated = true;
                    updateVoiceIndicator('active');
                } else {
                    console.warn("⚠️ Capacitor TTS не найден на Android");
                    if (window.speechSynthesis) {
                        console.log("⚠️ Резервный Web Speech");
                        voiceReady = true;
                        voiceActivated = true;
                        window.speechSynthesis.getVoices();
                        updateVoiceIndicator('active');
                    }
                }
            } else {
                if (window.speechSynthesis) {
                    console.log("✅ Web Speech доступен на ПК");
                    voiceReady = true;
                    voiceActivated = true;
                    window.speechSynthesis.getVoices();
                    updateVoiceIndicator('active');
                }
            }
            console.log("✅ Голос активирован, voiceReady =", voiceReady);
        } else {
            console.log("ℹ️ Голос уже активирован");
        }
    }

    function updateVoiceIndicator(status) {
        const indicator = document.getElementById('voiceIndicator');
        if (indicator) {
            if (status === 'active') {
                indicator.textContent = '🎙️ ИИ активирован';
                indicator.className = 'voice-indicator active';
            } else if (status === 'speaking') {
                indicator.textContent = '🎙️ Говорит...';
                indicator.className = 'voice-indicator speaking';
            } else {
                indicator.textContent = '🔇 ИИ неактивен';
                indicator.className = 'voice-indicator inactive';
            }
        }
    }

    // ============================================
    // =========== ГОЛОСОВЫЕ ФУНКЦИИ =============
    // ============================================
    
    function speakQuestionOnly() {
        console.log("🔊 speakQuestionOnly() вызван");
        stopSpeaking();
        
        const q = questions[currentQuestion];
        const text = `Вопрос ${currentQuestion + 1} из ${questions.length}: ${q.question}`;
        const btn = document.getElementById('voiceQuestionBtn');
        
        if (btn) {
            btn.disabled = true;
            btn.textContent = '🔊 Чтение...';
            console.log("🔇 voiceQuestionBtn отключен");
        }
        
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(text, "ru-RU", function() {

    // 🔥 СОХРАНЕНИЕ ПРОВЕРКИ ДЛЯ PROGRESSION.HTML
    // ================================================================
    function sauvegarderValidation(specialite, niveau, score, total) {
        const percentage = (score / total) * 100;
        
        // ✅ ТОЛЬКО ЕСЛИ >= 60% - Галочка установлена
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: specialite,
                niveau: niveau,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progression = JSON.parse(localStorage.getItem('eteo_progression') || '{}');
            const key = specialite + '_' + niveau;
            progression[key] = true;
            localStorage.setItem('eteo_progression', JSON.stringify(progression));
            
            console.log('✅ Проверка сохранена для progression.html (>= 60%)');
            return true;
        } else {
            console.log('❌ Проверка НЕ сохранена (результат < 60%)');
            return false;
        }
    }

    async function sendScoreToFirebase(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        
        const scoreData = {
            nom: userName,
            pays: userCountry,
            score: score,
            maxScore: maxScore,
            percentage: percentage,
            levelId: LEVEL_ID,
            date: new Date().toISOString(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection('scores').add(scoreData);
            console.log("✅ Баллы отправлены в Firebase!");
            return true;
        } catch (error) {
            console.error("❌ Ошибка Firebase:", error);
            return false;
        }
    }

    // ============================================
    // =========== ВАЖНАЯ КОРРЕКЦИЯ ==============

    const MAX_SCORE = questions.length * 15; // 375 баллов
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("ethique_deontologie_v1_debutant1_fr", JSON.stringify({ score: finalScore, maxScore, percentage, date: new Date().toISOString() }));
        return percentage;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function renderQuestion() {
        console.log("🔍 renderQuestion() - Вопрос", currentQuestion + 1);
        stopSpeaking();
        
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${letter}. ${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header"><h1>📜 Этика и деонтология - Начинающий 1</h1><p>Вопрос ${currentQuestion + 1}/${questions.length}</p></div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                
                <div class="voice-btn-row">
                    <button class="voice-btn" id="voiceQuestionBtn">🔊 Прочитать вопрос</button>
                </div>
                
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                
                <div id="feedbackContainer" style="display: none;"></div>
                
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Объяснение:</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                    <div class="voice-btn-row">
                        <button class="voice-btn explanation-btn-style" id="voiceExplanationBtn" style="display: none;">🔊 Прочитать объяснение</button>
                    </div>
                </div>
                
                <div class="timer">⏱️ Осталось времени: <span id="timer">${timeLeft}</span> секунд</div>
                <div class="score">🏆 Текущий счет: ${score}/${MAX_SCORE}</div>
                
                <!-- ✅ КНОПКА МОЙ ПРОГРЕСС - ВСЕГДА АКТИВНА -->
                <div style="margin: 10px 0;">
                    <button class="btn-progression" onclick="goToProgression()">📊 Мой прогресс</button>
                </div>
                
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Прервать</button>
                    <button class="nav-btn" onclick="nextQuestion()">Далее →</button>
                </div>
            </div>
        `;
        
        attachVoiceEvents();
        answerLocked = false;
        startTimer();
        lastAnswerCorrect = false;
        lastCorrectAnswer = "";
        lastPointsEarned = 0;
        
        setTimeout(() => {
            speakQuestionOnly();
        }, 500);
    }

    // ============================================
    // =========== ПРИВЯЗКА ГОЛОСОВЫХ СОБЫТИЙ =====
    // ============================================
    function attachVoiceEvents() {
        const voiceBtn = document.getElementById('voiceQuestionBtn');
        if (voiceBtn) {
            const newVoiceBtn = voiceBtn.cloneNode(true);
            voiceBtn.parentNode.replaceChild(newVoiceBtn, voiceBtn);
            newVoiceBtn.addEventListener('click', speakQuestionOnly);
            console.log("✅ Событие привязано к voiceQuestionBtn");
        }
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn && explBtn.style.display !== 'none') {
            const newExplBtn = explBtn.cloneNode(true);
            explBtn.parentNode.replaceChild(newExplBtn, explBtn);
            newExplBtn.addEventListener('click', speakExplanation);
            console.log("✅ Событие привязано к voiceExplanationBtn");
        }
    }

    function checkAnswer(selectedIndex) {
        console.log("🔍 checkAnswer() - Вариант", String.fromCharCode(65 + selectedIndex));
        
        stopSpeaking();
        
        if (answerLocked) {
            console.log("⏳ Ответ уже заблокирован");
            return;
        }

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        lastAnswerCorrect = isCorrect;
        lastCorrectAnswer = shuffledOptions[currentCorrectIndex];
        lastPointsEarned = pointsEarned;

        if (isCorrect) {
            score += pointsEarned;
            console.log("✅ Правильный ответ! +", pointsEarned, "баллов");
        } else {
            console.log("❌ Неправильный ответ. Правильный ответ:", shuffledOptions[currentCorrectIndex]);
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        const feedbackContainer = document.getElementById('feedbackContainer');
        if (feedbackContainer) {
            const feedbackClass = isCorrect ? 'feedback-container' : 'feedback-container wrong';
            feedbackContainer.style.display = 'block';
            feedbackContainer.className = feedbackClass;
            
            let pointsDisplay = '';
            if (isCorrect) {
                pointsDisplay = `<span class="points-badge correct">+${pointsEarned} баллов</span>`;
            } else {
                pointsDisplay = `<span class="points-badge wrong">(0 баллов)</span>`;
            }
            
            feedbackContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        ${isCorrect ? '✅ Правильный ответ!' : '❌ Неправильный ответ'}
                        ${pointsDisplay}
                    </div>
                    <button class="voice-btn feedback-btn-style" id="voiceFeedbackBtn">🔊 Прослушать ответ снова</button>
                </div>
            `;
            
            const feedbackBtn = document.getElementById('voiceFeedbackBtn');
            if (feedbackBtn) {
                const newFeedbackBtn = feedbackBtn.cloneNode(true);
                feedbackBtn.parentNode.replaceChild(newFeedbackBtn, feedbackBtn);
                newFeedbackBtn.addEventListener('click', speakFeedback);
                console.log("✅ Событие привязано к voiceFeedbackBtn");
            }
        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Правильный ответ: ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn) {
            explBtn.style.display = 'inline-block';
            attachVoiceEvents();
        }
        
        document.querySelector('.score').innerHTML = `🏆 Текущий счет: ${score}/${MAX_SCORE}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
        
        let feedbackText = "";
        if (isCorrect) {
            feedbackText = `Правильный ответ! +${pointsEarned} баллов.`;
        } else {
            feedbackText = `Неправильный ответ. Правильный ответ был: ${shuffledOptions[currentCorrectIndex]}.`;
        }
        
        console.log("🔊 Автоматическое чтение ответа");
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(feedbackText, "ru-RU", function() {
            console.log("✅ Автоматический ответ завершен");
            resetAllVoiceButtons();
        });
    }

    function nextQuestion() {
        console.log("🔍 nextQuestion() вызван");
        stopSpeaking();
        
        if (!answerLocked) { 
            speak("Пожалуйста, выберите ответ.", "ru-RU");
            return; 
        }
        currentQuestion++;
        timeLeft = 20;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }

    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Аноним";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 Нет сохраненных результатов для этого уровня.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Ваше место</div>
                        <div class="rank-number">${userRank}-е место</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} баллов (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Вы еще не в рейтинге этого уровня</div>
                        <div>Пройдите викторину снова, чтобы появиться!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 ТОП-20 - Этика и деонтология Начинающий 1</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Аноним"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 Нет результатов для этого уровня</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Ошибка Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Невозможно загрузить рейтинг.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Неизвестная ошибка'}</span></div>`;
        }
    }

        setTimeout(() => {
            openRankingModal();
        }, 2000);
    }

    // ============================================
    // =========== ABANDON ИСПРАВЛЕННЫЙ ===========
    // ============================================
    function abandonQuiz() {
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("ethique_deontologie_v1_debutant1_fr", JSON.stringify({ score, maxScore: MAX_SCORE, percentage: partialPercentage, date: new Date().toISOString(), abandoned: true }));
        
        // 🔥 Сохранить проверку даже при прерывании (если результат ≥ 60%)
        sauvegarderValidation('Этика и деонтология', 'debutant1', score, MAX_SCORE);
        
        sendScoreToFirebase(score, MAX_SCORE, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>❌ Викторина прервана</h1>
                <div class="final-score">Частичный результат: ${score}/${MAX_SCORE}</div>
                <div>Процент: ${partialPercentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">🏆 Этот результат сохранен в рейтинге.</div>
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Вернуться в меню</button>
                    <!-- ✅ ВСЕГДА АКТИВНО - Пользователь может видеть свой прогресс -->
                    <button class="btn-progression" onclick="goToProgression()">📊 Мой прогресс</button>
                </div>
            </div>
        `;
        speak(`Викторина прервана. Частичный результат: ${score} из ${MAX_SCORE}.`, "ru-RU");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE) * 100;
        const text = `🎓 ETEO - Этика и деонтология\nМой результат на уровне Начинающий 1: ${score}/${MAX_SCORE} (${percentage.toFixed(1)}%)\nПроверь меня на ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Результат', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Результат скопирован в буфер обмена!");
            }).catch(() => {
                alert("📋 Чтобы поделиться, скопируйте этот текст:\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    // ============================================
    // =========== goToMenu С TIMESTAMP ===========
    // ============================================
    function goToMenu() { 
        window.location.href = "menu_ru.html?t=" + Date.now(); 
    }

    function startQuiz() {
        console.log("🚀 startQuiz() вызван");
        saveUserInfo();
        console.log("🔊 Активация голоса...");
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
        console.log("✅ Викторина запущена");
    }

    // ============================================
    // =========== ИНИЦИАЛИЗАЦИЯ ==================
    // ============================================
    console.log("🚀 Страница загружена - ETEO Викторина Этика и деонтология (RU)");
    console.log("📱 window.Capacitor =", window.Capacitor);
    
    if (window.Capacitor) {
        console.log("📱 Платформа =", window.Capacitor.getPlatform());
        console.log("📱 Плагины =", Object.keys(window.Capacitor.Plugins || {}));
    }
    
    document.body.addEventListener('click', function firstClick() { 
        console.log("🖱️ Первый клик - Активация голоса");
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
</body>
</html>
