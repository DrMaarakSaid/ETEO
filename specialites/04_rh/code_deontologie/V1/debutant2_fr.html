<body>

<!-- ===== INDICATEUR VOCAL MODIFIÉ ===== -->
<div class="voice-indicator inactive" id="voiceIndicator">🔇 IA inactive</div>

<div class="container" id="app"></div>

<!-- Modal de classement -->
<div id="rankingModal">

        <button class="modal-footer-btn" onclick="closeRankingModal()">Fermer</button>
    </div>
</div>

<script>
    // ============================================
    // =========== CONFIGURATION FIREBASE =========
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",
        projectId: "eteo-endo-to-every-one",
        storageBucket: "eteo-endo-to-every-one.firebasestorage.app",
        messagingSenderId: "511524282020",
        appId: "1:511524282020:web:5a25c021fd84f026969031"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================
    // LEVEL_ID POUR CE QUIZ
    // ============================================
    const LEVEL_ID = "code_deontologie_v1_debutant2_fr";

    // ============================================
    // =========== 1. SYSTÈME VOCAL AVANCÉ =======
    // ============================================
    
    let isSpeaking = false;
    let voiceReady = false;
    let voiceActivated = false;
    let lastAnswerCorrect = false;
    let lastCorrectAnswer = "";
    let lastPointsEarned = 0;

    // ============================================
    // 🔥 FONCTION : RÉACTIVER TOUS LES BOUTONS
    // ============================================
    function resetAllVoiceButtons() {
        console.log("🔄 resetAllVoiceButtons() - Réactivation de tous les boutons");
        
        const qBtn = document.getElementById('voiceQuestionBtn');
        if (qBtn) {
            qBtn.disabled = false;
            qBtn.textContent = '🔊 Lire la question';
            console.log("✅ voiceQuestionBtn réactivé");
        }
        
        const fBtn = document.getElementById('voiceFeedbackBtn');
        if (fBtn) {
            fBtn.disabled = false;
            fBtn.textContent = '🔊 Réécouter le retour';
            console.log("✅ voiceFeedbackBtn réactivé");
        }
        
        const eBtn = document.getElementById('voiceExplanationBtn');
        if (eBtn) {
            eBtn.disabled = false;
            eBtn.textContent = '🔊 Lire l\'explication';
            console.log("✅ voiceExplanationBtn réactivé");
        }
        
        const rBtn = document.getElementById('voiceResultBtn');
        if (rBtn) {
            rBtn.disabled = false;
            rBtn.textContent = '🔊 Écouter votre résultat';
            console.log("✅ voiceResultBtn réactivé");
        }
        
        isSpeaking = false;
        updateVoiceIndicator('active');
        console.log("✅ Tous les boutons vocaux sont ACTIFS !");
    }

    // ============================================
    // 🔥 FONCTION : ARRÊTER LA PAROLE
    // ============================================
    function stopSpeaking() {
        console.log("🔊 stopSpeaking() appelé");
        
        try {
            if (window.Capacitor?.Plugins?.TextToSpeech) {
                window.Capacitor.Plugins.TextToSpeech.stop();
                console.log("✅ Arrêt Android exécuté");
            }
        } catch(e) { console.log("⚠️ Erreur arrêt Android:", e); }
        
        try {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                console.log("✅ Arrêt Web Speech exécuté");
            }
        } catch(e) { console.log("⚠️ Erreur arrêt Web Speech:", e); }
        
        isSpeaking = false;
        console.log("✅ isSpeaking réinitialisé à false");
        
        resetAllVoiceButtons();
    }

    // ============================================
    // 🔥 FONCTION : FALLBACK WEB SPEECH
    // ============================================
    function fallbackWebSpeech(text, lang, callback) {
        console.log("🔊 fallbackWebSpeech() appelé");
        
        if (!window.speechSynthesis) {
            console.error("❌ Web Speech non disponible");
            if (callback) callback();
            return;
        }
        
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'fr-FR';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            const voices = window.speechSynthesis.getVoices();
            const frenchVoice = voices.find(v => v.lang.startsWith('fr'));
            if (frenchVoice) utterance.voice = frenchVoice;
            
            let callbackExecuted = false;
            
            const safeCallback = function() {
                if (!callbackExecuted) {
                    callbackExecuted = true;
                    console.log("✅ Callback Web Speech exécuté");
                    if (callback) callback();
                }
            };
            
            utterance.onend = function() {
                console.log("✅ Web Speech terminé (onend)");
                safeCallback();
            };
            
            utterance.onerror = function(e) {
                console.error("❌ Erreur Web Speech:", e);
                safeCallback();
            };
            
            window.speechSynthesis.speak(utterance);
            
            setTimeout(function() {
                if (!callbackExecuted) {
                    console.warn("⚠️ TIMEOUT Web Speech - Forçage du callback");
                    safeCallback();
                }
            }, 5000);
            
        } catch (error) {
            console.error("❌ Erreur dans fallbackWebSpeech:", error);
            if (callback) callback();
        }
    }

    // ============================================
    // 🔥 FONCTION : PARLER (avec Capacitor + Web Speech)
    // ============================================
    function speak(text, lang, callback) {
        console.log("🔊 speak() appelé avec:", text.substring(0, 50) + '...');
        
        if (!text) { 
            console.log("⚠️ Texte vide, callback immédiat");
            if (callback) callback(); 
            return; 
        }
        
        const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
        
        let callbackExecuted = false;
        
        const safeCallback = function() {
            if (!callbackExecuted) {
                callbackExecuted = true;
                console.log("✅ safeCallback() exécuté");
                isSpeaking = false;
                if (callback) callback();
            }
        };
        
        try {
            if (isAndroid && window.Capacitor?.Plugins?.TextToSpeech) {
                console.log("🔊 Utilisation du plugin Capacitor TTS sur Android");
                const TTS = window.Capacitor.Plugins.TextToSpeech;
                
                TTS.speak({ 
                    text: text, 
                    lang: lang || 'fr-FR', 
                    rate: 0.9, 
                    pitch: 1.0, 
                    volume: 1.0 
                }).then(() => {
                    console.log("✅ Capacitor TTS terminé");
                    setTimeout(safeCallback, 300);
                }).catch((error) => {
                    console.error("❌ Erreur Capacitor TTS:", error);
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback vers Web Speech");
                        fallbackWebSpeech(text, lang, safeCallback);
                    } else {
                        safeCallback();
                    }
                });
                
                setTimeout(function() {
                    if (!callbackExecuted) {
                        console.warn("⚠️ TIMEOUT Capacitor TTS - Forçage du callback");
                        safeCallback();
                    }
                }, 5000);
                
            } else if (window.speechSynthesis) {
                console.log("🔊 Utilisation de Web Speech API");
                fallbackWebSpeech(text, lang, safeCallback);
            } else {
                console.error("❌ Aucun moteur TTS disponible");
                safeCallback();
            }
        } catch (error) {
            console.error("❌ ERREUR dans speak():", error);
            safeCallback();
        }
    }

    // ============================================
    // 🔥 ACTIVATION DE LA VOIX
    // ============================================
    function activateVoice() {
        console.log("🔊 activateVoice() appelé");
        if (!voiceActivated) {
            const isAndroid = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
            console.log("🔊 isAndroid =", isAndroid);
            
            if (isAndroid) {
                if (window.Capacitor?.Plugins?.TextToSpeech) {
                    console.log("✅ Capacitor TTS disponible sur Android");
                    voiceReady = true;
                    voiceActivated = true;
                    updateVoiceIndicator('active');
                } else {
                    console.warn("⚠️ Capacitor TTS non trouvé sur Android");
                    if (window.speechSynthesis) {
                        console.log("⚠️ Fallback vers Web Speech");
                        voiceReady = true;
                        voiceActivated = true;
                        window.speechSynthesis.getVoices();
                        updateVoiceIndicator('active');
                    }
                }
            } else {
                if (window.speechSynthesis) {
                    console.log("✅ Web Speech disponible sur PC");
                    voiceReady = true;
                    voiceActivated = true;
                    window.speechSynthesis.getVoices();
                    updateVoiceIndicator('active');
                }
            }
            console.log("✅ Voix activée, voiceReady =", voiceReady);
        } else {
            console.log("ℹ️ Voix déjà activée");
        }
    }

    function updateVoiceIndicator(status) {
        const indicator = document.getElementById('voiceIndicator');
        if (indicator) {
            if (status === 'active') {
                indicator.textContent = '🎙️ IA active';
                indicator.className = 'voice-indicator active';
            } else if (status === 'speaking') {
                indicator.textContent = '🎙️ Parle...';
                indicator.className = 'voice-indicator speaking';
            } else {
                indicator.textContent = '🔇 IA inactive';
                indicator.className = 'voice-indicator inactive';

    function speakFinalResult() {
        console.log("🔊 speakFinalResult() appelé");
        stopSpeaking();
        
        const percentage = (score / MAX_SCORE) * 100;
        const isUnlocked = percentage >= 60;
        let text = `Votre score final est de ${score} sur ${MAX_SCORE}, ce qui fait ${percentage.toFixed(1)} pourcent. `;
        if (isUnlocked) {
            text += "Félicitations ! Vous avez validé le niveau Débutant 2. Bravo !";

            voiceBtn.parentNode.replaceChild(newVoiceBtn, voiceBtn);
            newVoiceBtn.addEventListener('click', speakQuestionOnly);

        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn && explBtn.style.display !== 'none') {
            const newExplBtn = explBtn.cloneNode(true);
            explBtn.parentNode.replaceChild(newExplBtn, explBtn);
            newExplBtn.addEventListener('click', speakExplanation);
            console.log("✅ Événement attaché pour voiceExplanationBtn");
        }
    }

    function sauvegarderValidation(specialite, niveau, score, total) {
        const percentage = (score / total) * 100;
        
        if (percentage >= 60) {
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: specialite,
                niveau: niveau,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            const progression = JSON.parse(localStorage.getItem('eteo_progression')) || {};
            const key = specialite + '_' + niveau;
            progression[key] = true;
            localStorage.setItem('eteo_progression', JSON.stringify(progression));
            
            console.log('✅ Validation sauvegardée pour progression.html');
        }
    }

    async function sendScoreToFirebase(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Anonyme";
        const userCountry = localStorage.getItem("eteo_userCountry") || "MA";
        
        const scoreData = {
            nom: userName,
            pays: userCountry,
            score: score,
            maxScore: maxScore,
            percentage: percentage,
            levelId: LEVEL_ID,
            date: new Date().toISOString(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection('scores').add(scoreData);
            console.log("✅ Score envoyé à Firebase !");
            return true;
        } catch (error) {
            console.error("❌ Erreur Firebase:", error);
            return false;
        }
    }

        options: [

        correct: 1,

];

    // ============================================
    // =========== CORRECTION CRUCIALE ============
    // ============================================
    const MAX_SCORE = questions.length * 15; // 375 points
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("code_deontologie_v1_debutant2_fr", JSON.stringify({ score: finalScore, maxScore, percentage, date: new Date().toISOString() }));
        return percentage;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    // === MODIFICATION VOCALE ===
                    speak("Temps écoulé ! Passage à la question suivante.", "fr-FR");
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header"><h1>⚖️ Code de déontologie - Débutant 2</h1><p>Question ${currentQuestion + 1}/${questions.length}</p></div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                
                <!-- ===== BOUTON VOCAL QUESTION AJOUTÉ ===== -->
                <div class="voice-btn-row">
                    <button class="voice-btn" id="voiceQuestionBtn">🔊 Lire la question</button>
                </div>
                
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                
                <!-- ===== FEEDBACK CONTAINER AJOUTÉ ===== -->
                <div id="feedbackContainer" style="display: none;"></div>
                
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Explication :</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                    
                    <!-- ===== BOUTON VOCAL EXPLICATION AJOUTÉ ===== -->
                    <div class="voice-btn-row">
                        <button class="voice-btn explanation-btn-style" id="voiceExplanationBtn" style="display: none;">🔊 Lire l'explication</button>
                    </div>
                </div>
                
                <div class="timer">⏱️ Temps restant : <span id="timer">${timeLeft}</span> secondes</div>
                <div class="score">🏆 Score actuel : ${score}/${MAX_SCORE}</div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandonner</button>
                    <button class="nav-btn" onclick="nextQuestion()">Suivant →</button>
                </div>
            </div>
        `;
        
        // ===== ATTACHER LES ÉVÉNEMENTS VOCAUX =====
        attachVoiceEvents();
        
        answerLocked = false;
        startTimer();
        
        // ===== LECTURE AUTO DE LA QUESTION =====
        setTimeout(() => {
            speakQuestionOnly();
        }, 1500);
    }

    function checkAnswer(selectedIndex) {
        // === MODIFICATION VOCALE ===
        stopSpeaking();
        
        if (answerLocked) return;

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        // === VARIABLES POUR LE FEEDBACK VOCAL ===
        lastAnswerCorrect = isCorrect;
        lastCorrectAnswer = shuffledOptions[currentCorrectIndex];
        lastPointsEarned = pointsEarned;

        if (isCorrect) {
            score += pointsEarned;
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        // ===== FEEDBACK CONTAINER DYNAMIQUE =====
        const feedbackContainer = document.getElementById('feedbackContainer');
        if (feedbackContainer) {
            const feedbackClass = isCorrect ? 'feedback-container' : 'feedback-container wrong';
            feedbackContainer.style.display = 'block';
            feedbackContainer.className = feedbackClass;
            
            let pointsDisplay = '';
            if (isCorrect) {
                pointsDisplay = `<span class="points-badge correct">+${pointsEarned} points</span>`;
            } else {
                pointsDisplay = `<span class="points-badge wrong">(0 point)</span>`;
            }
            
            feedbackContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        ${isCorrect ? '✅ Bonne réponse !' : '❌ Mauvaise réponse'}
                        ${pointsDisplay}
                    </div>
                    <button class="voice-btn feedback-btn-style" id="voiceFeedbackBtn">🔊 Réécouter le retour</button>
                </div>
            `;
            
            const feedbackBtn = document.getElementById('voiceFeedbackBtn');
            if (feedbackBtn) {
                const newFeedbackBtn = feedbackBtn.cloneNode(true);
                feedbackBtn.parentNode.replaceChild(newFeedbackBtn, feedbackBtn);
                newFeedbackBtn.addEventListener('click', speakFeedback);
                console.log("✅ Événement attaché pour voiceFeedbackBtn");
            }
        }

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Bonne réponse : ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        
        // ===== AFFICHER LE BOUTON EXPLICATION =====
        const explBtn = document.getElementById('voiceExplanationBtn');
        if (explBtn) {
            explBtn.style.display = 'inline-block';
            attachVoiceEvents();
        }
        
        document.querySelector('.score').innerHTML = `🏆 Score actuel : ${score}/${MAX_SCORE}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
        
        // ===== LECTURE AUTO DU FEEDBACK =====
        let feedbackText = "";
        if (isCorrect) {
            feedbackText = `Bonne réponse ! +${pointsEarned} points.`;
        } else {
            feedbackText = `Mauvaise réponse. La bonne réponse était : ${shuffledOptions[currentCorrectIndex]}.`;
        }
        
        console.log("🔊 Lecture auto du feedback");
        isSpeaking = true;
        updateVoiceIndicator('speaking');
        speak(feedbackText, "fr-FR", function() {
            console.log("✅ Auto-feedback terminé");
        });
    }

    function nextQuestion() {
        // === MODIFICATION VOCALE ===
        if (!answerLocked) { 
            speak("Veuillez sélectionner une réponse.", "fr-FR"); 
            return; 
        }
        currentQuestion++;
        timeLeft = 30;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    // ============================================
    // =========== POPUP CLASSEMENT MODAL ========
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anonyme";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 Aucun score enregistré pour ce niveau pour le moment.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Votre classement</div>
                        <div class="rank-number">${userRank}e position</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} points (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 Vous n'êtes pas encore dans le classement de ce niveau</div>
                        <div>Refaites le quiz pour apparaître !</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 TOP 20 - Code de déontologie Débutant 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anonyme"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 Aucun score pour ce niveau</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Erreur Firestore:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Impossible de charger le classement.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Erreur inconnue'}</span></div>`;
        }
    }

    // ============================================
    // =========== endQuiz CORRIGÉ ================
    // ============================================
    function endQuiz() {
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const percentage = (score / MAX_SCORE) * 100;
        saveScore(score, MAX_SCORE);
        
        // === VERSION BETA : Le niveau suivant est verrouillé ===
        const isUnlocked = unlockLevel3(percentage); // Toujours false en BETA
        
        // 🔥 Sauvegarder la validation pour progression.html
        sauvegarderValidation('Code_de_déontologie', 'debutant2', score, MAX_SCORE);
        
        sendScoreToFirebase(score, MAX_SCORE, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 Quiz terminé !</h1>
                <div class="final-score">Score : ${score}/${MAX_SCORE}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Pourcentage : <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${percentage >= 60 ?
                        `<div class="unlock-badge">✅ Niveau Débutant 2 validé ! 🎊</div>
                         <div class="locked-badge">🔒 BETA : La suite (Intermédiaire & Expert) arrivera après 6 mois d'évaluation.</div>` :
                        `<div class="locked-badge">⚠️ Score insuffisant (minimum 60% requis pour valider le niveau)</div>`}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${percentage >= 60 ?
                        '📚 Vous avez validé les deux niveaux Débutants. Merci pour votre participation !' :
                        `💪 Il vous manque ${(60 - percentage).toFixed(1)}% pour valider le niveau. Réessayez !`}
                </div>
                
                <!-- ===== BOUTON VOCAL RÉSULTAT ===== -->
                <div class="voice-btn-row">
                    <button class="voice-btn result-btn-style" id="voiceResultBtn">🔊 Écouter votre résultat</button>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0;">
                    <button class="share-btn" onclick="shareScore()">📤 Partager mon score</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Donner mon avis</button>
                    <button class="ranking-btn" onclick="openRankingModal()">🏆 Classement mondial</button>
                </div>
                
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Menu principal</button>
                    <button class="btn-progression" onclick="goToProgression()">📊 Voir ma progression</button>
                </div>
            </div>
        `;
        
        // ===== ATTACHER ÉVÉNEMENT BOUTON RÉSULTAT =====
        const resultBtn = document.getElementById('voiceResultBtn');
        if (resultBtn) {
            const newResultBtn = resultBtn.cloneNode(true);
            resultBtn.parentNode.replaceChild(newResultBtn, resultBtn);
            newResultBtn.addEventListener('click', speakFinalResult);
            console.log("✅ Événement attaché pour voiceResultBtn");
        }
        
        // ===== LECTURE AUTO DU RÉSULTAT =====
        if (percentage >= 60) {
            setTimeout(() => {
                speakFinalResult();
            }, 1000);
            
            // 🆕 POPUP D'ÉVALUATION BETA - OPTION 2
            setTimeout(function() {
                openBetaEvaluationPopup();
            }, 2000);
        } else {
            setTimeout(() => {
                speakFinalResult();
            }, 1000);
        }
        
        setTimeout(() => {
            openRankingModal();
        }, 2500);
    }

    // ============================================
    // =========== BETA EVALUATION POPUP ==========
    // ============================================
    function openBetaEvaluationPopup() {
        if (document.getElementById('betaPopup')) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Docteur";
        
        const modal = document.createElement('div');
        modal.id = 'betaPopup';
        modal.className = 'beta-popup-overlay';
        modal.innerHTML = `
            <div class="beta-popup-content">
                <div class="big-icon">🎉🏆🎉</div>
                <h2>Félicitations ${userName} !</h2>
                <p>Vous avez validé avec succès <strong>les deux niveaux Débutants</strong>.<br>Quel parcours impressionnant !</p>
                
                <div style="margin: 25px 0;">
                    <p style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">🌟 Évaluez la version BETA 🌟</p>
                    <div class="stars" id="starRating">
                        <span data-rating="1" style="color: #ccc;">☆</span>
                        <span data-rating="2" style="color: #ccc;">☆</span>
                        <span data-rating="3" style="color: #ccc;">☆</span>
                        <span data-rating="4" style="color: #ccc;">☆</span>
                        <span data-rating="5" style="color: #ccc;">☆</span>
                    </div>
                    <p class="rating-message" id="ratingMessage"></p>
                </div>
                
                <div class="beta-info">
                    <p>🚀 <strong>Le niveau Expert</strong> arrivera après <strong>6 mois d'évaluation</strong> de cette version Beta.<br><br>
                    Vos retours nous aident à améliorer ETEO. Merci pour votre confiance, <strong>${userName}</strong> !</p>
                </div>
                
                <button class="beta-btn" onclick="closeBetaPopup()">Retour au menu</button>
            </div>
        `;
        
        document.body.appendChild(modal);
        
        // ✅ OPTION 2 : Lecture automatique du message complet (en français)
        stopSpeaking();
        
        setTimeout(() => {
            const fullMessage = `Félicitations ${userName} ! Vous avez validé les deux niveaux Débutants avec succès. ` +
                               `Merci d'évaluer la version BETA en cliquant sur les étoiles. ` +
                               `Le niveau Expert arrivera après six mois d'évaluation. ` +
                               `Merci pour votre confiance.`;
            
            isSpeaking = true;
            updateVoiceIndicator('speaking');
            speak(fullMessage, "fr-FR", function() {
                console.log("✅ Message du popup BETA lu automatiquement");
                isSpeaking = false;
                updateVoiceIndicator('active');
            });
        }, 600);
        
        // Gestion des étoiles avec confirmation vocale
        const stars = modal.querySelectorAll('#starRating span');
        stars.forEach(function(star) {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                sendBetaEvaluation(rating);
                
                stars.forEach(function(s, idx) {
                    if (idx < rating) {
                        s.innerHTML = '★';
                        s.style.color = '#ffc107';
                    } else {
                        s.innerHTML = '☆';
                        s.style.color = '#ccc';
                    }
                });
                
                const messageDiv = document.getElementById('ratingMessage');
                messageDiv.innerHTML = '✅ Merci pour votre évaluation ! Votre avis a été enregistré.';
                messageDiv.style.color = '#4caf50';
                messageDiv.style.fontWeight = 'bold';
                
                // ✅ Confirmation vocale de l'évaluation (en français)
                const confirmationMessage = `Merci pour votre évaluation de ${rating} sur 5. Votre avis a été enregistré.`;
                
                stopSpeaking();
                isSpeaking = true;
                updateVoiceIndicator('speaking');
                speak(confirmationMessage, "fr-FR", function() {
                    console.log("✅ Confirmation d'évaluation lue");
                    isSpeaking = false;
                    updateVoiceIndicator('active');
                });
            });
        });
    }

    function closeBetaPopup() {
        var modal = document.getElementById('betaPopup');
        if (modal) modal.remove();
        goToMenu();
    }

    async function sendBetaEvaluation(rating) {
        const userName = localStorage.getItem("eteo_userName") || "Anonyme";
        const userCountry = localStorage.getItem("eteo_userCountry") || "MA";
        
        try {
            await db.collection('evaluations_beta').add({
                nom: userName,
                pays: userCountry,
                note: rating,
                langue: 'fr',
                nivel: 'debutant2',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("✅ Évaluation Beta envoyée !");
        } catch (error) {
            console.error("❌ Erreur évaluation Beta:", error);
        }
    }

    // ============================================
    // =========== ABANDON CORRIGÉ ================
    // ============================================
    function abandonQuiz() {
        // === MODIFICATION VOCALE ===
        stopSpeaking();
        
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE) * 100;
        localStorage.setItem("code_deontologie_v1_debutant2_fr", JSON.stringify({ score, maxScore: MAX_SCORE, percentage: partialPercentage, date: new Date().toISOString(), abandoned: true }));
        
        // 🔥 Sauvegarder la validation même en cas d'abandon
        sauvegarderValidation('Code_de_déontologie', 'debutant2', score, MAX_SCORE);
        
        sendScoreToFirebase(score, MAX_SCORE, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>❌ Quiz abandonné</h1>
                <div class="final-score">Score partiel : ${score}/${MAX_SCORE}</div>
                <div>Pourcentage : ${partialPercentage.toFixed(1)}%</div>
                <div style="margin:20px 0;">🏆 Ce score a été enregistré dans le classement.</div>
                <div class="btn-group">
                    <button class="btn-menu" onclick="goToMenu()">🏠 Retour au menu</button>
                    <button class="btn-progression" onclick="goToProgression()">📊 Voir ma progression</button>
                </div>
            </div>
        `;
        speak(`Quiz abandonné. Score partiel : ${score} sur ${MAX_SCORE}.`, "fr-FR");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE) * 100;
        const text = `🎓 ETEO - Code de déontologie\nMon score au niveau Débutant 2 : ${score}/${MAX_SCORE} (${percentage.toFixed(1)}%)\nDéfie-moi sur ETEO !`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Score', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Score copié dans le presse-papier !");
            }).catch(() => {
                alert("📋 Pour partager, copiez ce texte :\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    // ============================================
    // =========== goToMenu AVEC TIMESTAMP ========
    // ============================================
    function goToMenu() { 
        window.location.href = "menu_fr.html?t=" + Date.now();

        saveUserInfo();
        // === ACTIVATION DE LA VOIX ===
        console.log("🔊 Activation de la voix...");
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
        console.log("✅ Quiz démarré");

    // ===== PREMIER CLIC POUR ACTIVER LA VOIX =====
    document.body.addEventListener('click', function firstClick() { 
        console.log("🖱️ Premier clic - Activation de la voix");
        activateVoice(); 
        document.body.removeEventListener('click', firstClick);

    showWelcomeScreen();
</script>
