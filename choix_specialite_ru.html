<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ETEO - Выбор специальности</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- ============================================ -->
    <!-- =========== TTS MANAGER ==================== -->
    <!-- ============================================ -->
    <script src="js/tts-manager.js"></script>
    
    <style>
        /* ============================================ */
        /* =========== 1. RESET & BASE =============== */
        /* ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 20px;
        }

        body.dark {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ============================================ */
        /* =========== 2. HEADER ===================== */
        /* ============================================ */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 5px;
            display: inline-block;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.3));
        }

        .header h1 .letter-e {
            color: #2196F3;
            -webkit-text-stroke: 2px #0d47a1;
            text-shadow: 
                -1px -1px 0 #000000,
                1px -1px 0 #000000,
                -1px 1px 0 #000000,
                1px 1px 0 #000000;
        }

        .header h1 .letter-t {
            color: #4CAF50;
            -webkit-text-stroke: 2px #1b5e20;
            text-shadow: 
                -1px -1px 0 #000000,
                1px -1px 0 #000000,
                -1px 1px 0 #000000,
                1px 1px 0 #000000;
        }

        .header h1 .letter-o {
            color: #FF9800;
            -webkit-text-stroke: 2px #e65100;
            text-shadow: 
                -1px -1px 0 #000000,
                1px -1px 0 #000000,
                -1px 1px 0 #000000,
                1px 1px 0 #000000;
        }

        body.dark .header h1 .letter-e {
            color: #42a5f5;
            -webkit-text-stroke: 2px #1565c0;
        }

        body.dark .header h1 .letter-t {
            color: #66bb6a;
            -webkit-text-stroke: 2px #2e7d32;
        }

        body.dark .header h1 .letter-o {
            color: #ffa726;
            -webkit-text-stroke: 2px #ef6c00;
        }

        .header p {
            color: #aaa;
            font-size: 1rem;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        body.dark .header p {
            color: #888;
        }

        /* ============================================ */
        /* =========== 3. NAV BAR ==================== */
        /* ============================================ */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .theme-btn {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 60px;
            padding: 12px 24px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.05);
        }

        body.dark .theme-btn {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.1);
        }

        body.dark .theme-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        /* ============================================ */
        /* =========== 4. BOUTON ÉCOUTER ============= */
        /* ============================================ */
        .btn-listen {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
            padding: 16px 24px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            border: 2px solid #1976D2;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-listen:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 6px 30px rgba(33, 150, 243, 0.5);
            background: linear-gradient(135deg, #42a5f5, #1976D2);
        }

        .btn-listen:active {
            transform: scale(0.96);
        }

        .btn-listen.listening {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            border-color: #F57C00;
            animation: pulseListen 1s infinite;
        }

        @keyframes pulseListen {
            0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 152, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }

        body.dark .btn-listen {
            background: linear-gradient(135deg, #42a5f5, #1565c0);
            border-color: #1565c0;
        }

        body.dark .btn-listen:hover {
            background: linear-gradient(135deg, #64b5f6, #1565c0);
        }

        /* ============================================ */
        /* =========== 5. GRILLE SPÉCIALITÉS ========= */
        /* ============================================ */
        .specialty-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        box-shadow 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .category-card:hover {
            transform: translateY(-10px) scale(1.01);
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }

        body.dark .category-card {
            background: rgba(30, 30, 46, 0.95);
            color: #eee;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .category-header {
            padding: 18px 20px;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .category-card:nth-child(1) .category-header {
            background: linear-gradient(135deg, #2196F3, #1565C0);
        }
        .category-card:nth-child(2) .category-header {
            background: linear-gradient(135deg, #4CAF50, #1B5E20);
        }
        .category-card:nth-child(3) .category-header {
            background: linear-gradient(135deg, #FF9800, #E65100);
        }
        .category-card:nth-child(4) .category-header {
            background: linear-gradient(135deg, #9C27B0, #4A148C);
        }
        .category-card:nth-child(5) .category-header {
            background: linear-gradient(135deg, #E91E63, #880E4F);
        }

        .category-header::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .category-header h2 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .category-content {
            padding: 18px;
            max-height: 500px;
            overflow-y: auto;
        }

        .category-content::-webkit-scrollbar {
            width: 6px;
        }

        .category-content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
        }

        .category-content::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        body.dark .category-content::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        .specialty-item {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            transition: background 0.3s ease;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 4px;
        }

        .specialty-item:hover {
            background: rgba(102, 126, 234, 0.06);
        }

        body.dark .specialty-item {
            border-bottom-color: rgba(255,255,255,0.06);
        }

        body.dark .specialty-item:hover {
            background: rgba(102, 126, 234, 0.12);
        }

        .specialty-name {
            font-weight: 700;
            font-size: 1rem;
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        body.dark .specialty-name {
            color: #eee;
        }

        .version-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .version-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.25);
        }

        .version-btn:hover:not(.disabled) {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.4);
        }

        .version-btn:active:not(.disabled) {
            transform: scale(0.92);
        }

        .version-btn.disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }

        body.dark .version-btn.disabled {
            background: #444;
        }

        .version-btn[data-version="V1"] {
            background: linear-gradient(135deg, #2196F3, #1565C0);
        }

        .version-btn[data-version="V2"] {
            background: linear-gradient(135deg, #4CAF50, #1B5E20);
        }

        .version-btn[data-version="V3"] {
            background: linear-gradient(135deg, #FF9800, #E65100);
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .status-available {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.12);
            padding: 2px 14px;
            border-radius: 20px;
        }

        .status-coming {
            color: #ff9800;
            background: rgba(255, 152, 0, 0.12);
            padding: 2px 14px;
            border-radius: 20px;
        }

        /* ============================================ */
        /* =========== 6. FOOTER ==================== */
        /* ============================================ */
        .footer {
            text-align: center;
            color: #888;
            font-size: 0.7rem;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        body.dark .footer {
            color: #666;
        }

        .footer p {
            margin: 4px 0;
        }

        /* ============================================ */
        /* =========== 7. VOICE INDICATOR =========== */
        /* ============================================ */
        .voice-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 10px;
            z-index: 999;
            opacity: 0.8;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .voice-indicator.capacitor {
            background: #2196F3;
        }

        .voice-indicator.web {
            background: #FF9800;
        }

        .voice-indicator.error {
            background: #f44336;
        }

        /* ============================================ */
        /* =========== 8. TOAST ====================== */
        /* ============================================ */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .toast.show {
            opacity: 1;
        }

        /* ============================================ */
        /* =========== 9. RESPONSIVE ================= */
        /* ============================================ */
        @media (max-width: 768px) {
            .specialty-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .header h1 {
                font-size: 2.2rem;
            }

            .nav-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .back-btn, .theme-btn {
                text-align: center;
                justify-content: center;
            }

            .category-content {
                max-height: 300px;
            }

            .btn-listen {
                max-width: 100%;
                font-size: 0.95rem;
                padding: 14px 20px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .category-header h2 {
                font-size: 1rem;
            }

            .specialty-name {
                font-size: 0.85rem;
            }

            .version-btn {
                font-size: 0.65rem;
                padding: 4px 12px;
            }

            .toast {
                font-size: 0.75rem;
                padding: 10px 20px;
                white-space: normal;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

<!-- ============================================ -->
<!-- =========== INDICATEUR VOCAL =============== -->
<!-- ============================================ -->
<div class="voice-indicator" id="voiceIndicator">🎙️ Инициализация...</div>

<!-- ============================================ -->
<!-- =========== TOAST ========================== -->
<!-- ============================================ -->
<div class="toast" id="toast"></div>

<div class="container">
    <!-- ============================================ -->
    <!-- =========== NAV BAR ======================== -->
    <!-- ============================================ -->
    <div class="nav-bar">
        <button class="back-btn" onclick="goBack()">← Назад</button>
        <button class="theme-btn" onclick="toggleTheme()">🌙 Тёмный режим</button>
    </div>

    <!-- ============================================ -->
    <!-- =========== HEADER ========================== -->
    <!-- ============================================ -->
    <div class="header">
        <h1>
            <span class="letter-e">E</span>
            <span class="letter-t">T</span>
            <span class="letter-e">E</span>
            <span class="letter-o">O</span>
        </h1>
        <p>Выберите вашу специальность</p>
    </div>

    <!-- ============================================ -->
    <!-- =========== BOUTON ÉCOUTER ================= -->
    <!-- ============================================ -->
    <button class="btn-listen" id="btnListen" onclick="listenInstructions()">
        🔊 Слушать инструкции
    </button>

    <!-- ============================================ -->
    <!-- =========== GRILLE SPÉCIALITÉS ============= -->
    <!-- ============================================ -->
    <div class="specialty-grid" id="specialtyGrid"></div>

    <!-- ============================================ -->
    <!-- =========== FOOTER ========================== -->
    <!-- ============================================ -->
    <div class="footer">
        <p>📚 Доступно несколько версий для каждой специальности (V1, V2, V3...)</p>
        <p>🎙️ Голосовой помощник ИИ | ⏱️ 20 секунд на вопрос | ⚡ Бонус за скорость +5 баллов</p>
        <p>© 2026 - Др. САИД МААРАК 🇲🇦</p>
    </div>
</div>

<!-- ============================================ -->
<!-- =========== SCRIPT PRINCIPAL =============== -->
<!-- ============================================ -->
<script>
    // ============================================
    // =========== 1. THÈME ======================
    // ============================================
    function toggleTheme() {
        document.body.classList.toggle('dark');
        const btn = document.querySelector('.theme-btn');
        btn.textContent = document.body.classList.contains('dark') ? '☀️ Светлый режим' : '🌙 Тёмный режим';
        localStorage.setItem('eteo_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    // ============================================
    // =========== 2. TOAST ======================
    // ============================================
    function showToast(message, duration = 2500) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.remove('show');
        }, duration);
    }

    // ============================================
    // =========== 3. BOUTON ÉCOUTER =============
    // ============================================
    function listenInstructions() {
        const btn = document.getElementById('btnListen');
        
        // Vérifier que le TTS est disponible
        if (!window.ETEO || !window.ETEO.TTS) {
            showToast('❌ Голосовая система недоступна', 3000);
            return;
        }

        // Message d'instructions en russe
        const message = `Добро пожаловать в выбор специальностей ETEO. ` +
                       `Здесь вы найдете несколько категорий стоматологических специальностей. ` +
                       `Каждая специальность предлагает несколько версий: V1, V2 и V3. ` +
                       `Доступные версии отмечены зеленым цветом. ` +
                       `Нажмите на версию, чтобы получить доступ к 6 уровням обучения. ` +
                       `После завершения всех 6 уровней вы сможете сдать персональный экзамен. ` +
                       `В случае успешной сдачи вы получите сертификат о прохождении. ` +
                       `Желаем удачи, Доктор!`;

        // Désactiver le bouton pendant la lecture
        btn.disabled = true;
        btn.classList.add('listening');
        btn.innerHTML = '🔊 Слушаю...';

        // Lire le message
        window.ETEO.TTS.speak(message, 'ru-RU')
            .then(() => {
                btn.disabled = false;
                btn.classList.remove('listening');
                btn.innerHTML = '🔊 Слушать инструкции';
                showToast('✅ Инструкции прочитаны успешно', 2000);
            })
            .catch((error) => {
                console.error('Ошибка при чтении:', error);
                btn.disabled = false;
                btn.classList.remove('listening');
                btn.innerHTML = '🔊 Слушать инструкции';
                showToast('❌ Ошибка при чтении инструкций', 3000);
            });

        // Fallback
        setTimeout(() => {
            if (btn.disabled) {
                btn.disabled = false;
                btn.classList.remove('listening');
                btn.innerHTML = '🔊 Слушать инструкции';
            }
        }, 15000);
    }

    // ============================================
    // =========== 4. REDIRECTION (SANS VOIX) =====
    // ============================================
    function redirectToSpecialty(path, name, version) {
        if (!path || path === "") {
            showToast('❌ Версия недоступна', 2000);
            return;
        }

        // Désactiver temporairement tous les boutons
        const allBtns = document.querySelectorAll('.version-btn:not(.disabled)');
        allBtns.forEach(btn => {
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';
        });

        // Feedback
        showToast(`⏳ Загрузка ${name} ${version}...`, 2000);

        // Redirection UNIQUEMENT (SANS voix)
        setTimeout(() => {
            window.location.href = path;
        }, 1500);
    }

    // ============================================
    // =========== 5. NAVIGATION =================
    // ============================================
    function goBack() {
        window.location.href = "index.html";
    }

    // ============================================
    // =========== 6. DONNÉES SPÉCIALITÉS ========
    // ============================================
    const categories = [
        {
            name: "📚 КЛИНИКА",
            specialties: [
                { 
                    name: "Хирургическая стоматология", 
                    versions: [
                        { num: "V1", available: true, path: "./specialites/01_clinique/chirurgie/V1/menu_ru.html" },
                        { num: "V2", available: false, path: "" },
                        { num: "V3", available: false, path: "" }
                    ]
                },
                { 
                    name: "Эндодонтия", 
                    versions: [
                        { num: "V1", available: true, path: "./specialites/01_clinique/endo/V1/menu_ru.html" },
                        { num: "V2", available: false, path: "" },
                        { num: "V3", available: false, path: "" }
                    ]
                },
                { 
                    name: "Эстетическая стоматология", 
                    versions: [
                        { num: "V1", available: true, path: "./specialites/01_clinique/esthetique/V1/menu_ru.html" },
                        { num: "V2", available: false, path: "" },
                        { num: "V3", available: false, path: "" }
                    ]
                },
                { 
                    name: "Имплантология", 
                    versions: [
                        { num: "V1", available: true, path: "./specialites/01_clinique/implantologie/V1/menu_ru.html" },
                        { num: "V2", available: false, path: "" },
                        { num: "V3", available: false, path: "" }
                    ]
                },
                { 
                    name: "Медицина полости рта", 
                    versions: [
                        { num: "V1", available: true, path: "./specialites/01_clinique/Médecine_buccale/V1/menu_ru.html" },
                        { num: "V2", available: false, path: "" },
                        { num: "V3", available: false, path: "" }
                    ]
                },
                { 
                    name: "Ортодонтия", 
                    versions: [
                        { num: "V1", available: true, path: "./specialites/01_clinique/orthodontie/V1/menu_ru.html" },
                        { num: "V2", available: false, path: "" },
                        { num: "V3", available: false, path: "" }
                    ]
                },
                { 
                    name: "Пародонтология", 
                    versions: [
                        { num: "V1", available: true, path: "./specialites/01_clinique/parodontologie/V1/menu_ru.html" },
                        { num: "V2", available: false, path: "" },
                        { num: "V3", available: false, path: "" }
                    ]
                },
                { 
                    name: "Детская стоматология", 
                    versions: [

    // ============================================
    // =========== 7. RENDU DES SPÉCIALITÉS ======
    // ============================================
    function renderSpecialties() {
        const grid = document.getElementById('specialtyGrid');
        if (!grid) return;
        grid.innerHTML = '';

        for (let i = 0; i < categories.length; i++) {
            const category = categories[i];
            const card = document.createElement('div');
            card.className = 'category-card';

            let specialtiesHtml = '';
            for (let j = 0; j < category.specialties.length; j++) {
                const spec = category.specialties[j];
                
                let versionButtonsHtml = '';
                for (let v = 0; v < spec.versions.length; v++) {
                    const ver = spec.versions[v];
                    const isAvailable = ver.available;
                    versionButtonsHtml += `
                        <button class="version-btn ${!isAvailable ? 'disabled' : ''}" 
                                data-path="${ver.path || ''}" 
                                data-name="${spec.name}" 
                                data-version="${ver.num}"
                                ${!isAvailable ? 'disabled' : ''}>
                            ${ver.num} ${isAvailable ? '✅' : '🔜'}
                        </button>
                    `;
                }
                
                specialtiesHtml += `
                    <div class="specialty-item">
                        <div class="specialty-name">${spec.name}</div>
                        <div class="version-buttons">
                            ${versionButtonsHtml}
                        </div>
                        <div class="status-badge status-available">✅ Доступна (V1)</div>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="category-header">
                    <h2>${category.name}</h2>
                </div>
                <div class="category-content">
                    ${specialtiesHtml}
                </div>
            `;

            grid.appendChild(card);
        }

        // ============================================
        // =========== ATTACHER LES ÉVÉNEMENTS =======
        // ============================================
        const buttons = document.querySelectorAll('.version-btn:not(.disabled)');
        for (let i = 0; i < buttons.length; i++) {
            const btn = buttons[i];
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const path = btn.getAttribute('data-path');
                const name = btn.getAttribute('data-name');
                const version = btn.getAttribute('data-version');
                
                if (path && path !== "") {
                    // Redirection UNIQUEMENT (SANS voix)
                    redirectToSpecialty(path, name, version);
                }
            });
        }
    }

    // ============================================
    // =========== 8. INITIALISATION =============
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        // --- THÈME ---
        if (localStorage.getItem('eteo_theme') === 'dark') {
            document.body.classList.add('dark');
            document.querySelector('.theme-btn').textContent = '☀️ Светлый режим';
        }

        // --- INITIALISATION DU TTS MANAGER (AUDIT SEULEMENT) ---
        if (window.ETEO && window.ETEO.TTS) {
            window.ETEO.TTS.init();
            
            const indicator = document.getElementById('voiceIndicator');
            if (window.ETEO.TTS.engine === 'capacitor') {
                indicator.textContent = '🎙️';
                indicator.className = 'voice-indicator capacitor';
                console.log('✅ НАТИВНЫЙ ГОЛОС CAPACITOR ОБНАРУЖЕН!');
            } else if (window.ETEO.TTS.engine === 'web') {
                indicator.textContent = '🎙️';
                indicator.className = 'voice-indicator web';
                console.log('⚠️ Резервный Web Speech активирован');
            } else {
                indicator.textContent = '❌';
                indicator.className = 'voice-indicator error';
                console.error('❌ Нет доступного TTS движка');
            }
        } else {
            console.error('❌ TTS Manager не загружен!');
            const indicator = document.getElementById('voiceIndicator');
            indicator.textContent = '❌ Ошибка TTS';
            indicator.className = 'voice-indicator error';
        }

        // --- RENDRE LES SPÉCIALITÉS ---
        renderSpecialties();

        console.log('🚀 ETEO Выбор специальностей готов!');
        console.log('🔈 Нажмите "Слушать инструкции", чтобы услышать объяснения.');
    });

    // ⚠️ PAS DE VOIX AUTOMATIQUE - L'utilisateur décide !
</script>
