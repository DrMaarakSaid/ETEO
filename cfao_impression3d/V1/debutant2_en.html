<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ETEO - CAD/CAM & 3D Printing - Beginner 2</title>
    <link rel="manifest" href="../../../../manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 20px;
        }
        body.dark { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        body.dark .container { background: #1e1e2e; color: #eee; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 1.5rem; color: #667eea; }
        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
        }
        body.dark .progress-bar { background: #333; }
        .progress-fill {
            background: #4caf50;
            border-radius: 10px;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .question-container { text-align: center; }
        .question-text { font-size: 1.2rem; margin-bottom: 25px; font-weight: bold; }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .option-btn {
            background: #f0f0f0;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        body.dark .option-btn { background: #2a2a3e; color: #eee; }
        .option-btn:hover:not(.disabled) { background: #e0e0e0; }
        .option-btn.correct { background: #4caf50; color: white; }
        .option-btn.wrong { background: #f44336; color: white; }
        .option-btn.disabled { cursor: not-allowed; opacity: 0.8; }
        .explanation-box {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            display: none;
        }
        body.dark .explanation-box { background: #2a2a3e; }
        .explanation-box.show { display: block; }
        .explanation-title { font-weight: bold; color: #667eea; margin-bottom: 5px; }
        .correct-answer { color: #4caf50; font-weight: bold; margin-top: 5px; }
        .timer { font-size: 1.2rem; font-weight: bold; color: #ff5722; margin: 15px 0; }
        .score { font-size: 1rem; margin: 10px 0; }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 20px;
        }
        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        .result-container { text-align: center; }
        .final-score { font-size: 2rem; font-weight: bold; color: #667eea; margin: 20px 0; }
        .share-btn, .feedback-btn, .menu-btn, .ranking-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
        }
        .voice-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            z-index: 999;
        }
        .welcome-screen { text-align: center; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }
        body.dark .input-group input, body.dark .input-group select {
            background: #2a2a3e;
            color: #eee;
            border-color: #444;
        }
        .start-quiz-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .note {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
        }
        .unlock-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            margin: 10px 0;
        }
        .locked-badge {
            display: inline-block;
            background: #f44336;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            margin: 10px 0;
        }
        #rankingModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        #rankingModal .modal-content {
            background: white;
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            overflow: auto;
            padding: 20px;
            position: relative;
        }
        body.dark #rankingModal .modal-content {
            background: #1e1e2e;
            color: #eee;
        }
        #rankingModal .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        #rankingModal .modal-title {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
        }
        #rankingModal .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        body.dark #rankingModal .ranking-item {
            border-bottom-color: #444;
        }
        .user-rank-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .user-rank-card .rank-number {
            font-size: 2rem;
            font-weight: bold;
        }
        .user-rank-card .rank-label {
            font-size: 1.2rem;
        }
        .modal-footer-btn {
            display: block;
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="voice-indicator" id="voiceIndicator">🎙️ AI waiting</div>

<div class="container" id="app"></div>

<!-- Modal de classement -->
<div id="rankingModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeRankingModal()">✕</button>
        <h2 class="modal-title">🏆 YOUR POSITION</h2>
        <div id="modalRankingContent" style="text-align: center;">⏳ Loading ranking...</div>
        <button class="modal-footer-btn" onclick="closeRankingModal()">Close</button>
    </div>
</div>

<script>
    // ============================================
    // =========== FIREBASE CONFIGURATION =========
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
        authDomain: "eteo-endo-to-every-one.firebaseapp.com",
        projectId: "eteo-endo-to-every-one",
        storageBucket: "eteo-endo-to-every-one.firebasestorage.app",
        messagingSenderId: "511524282020",
        appId: "1:511524282020:web:5a25c021fd84f026969031"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================
    // LEVEL_ID POUR CE QUIZ
    // ============================================
    const LEVEL_ID = "cfao_impression3d_v1_debutant2_en";


    // ============================================
    // =========== 1. VOICE SYSTEM ===============
    // ============================================
    let speechSynthesisObj = null;
    let voiceReady = false;

    function initVoice() {
        if ('speechSynthesis' in window) {
            speechSynthesisObj = window.speechSynthesis;
            voiceReady = true;
            return true;
        }
        return false;
    }

    function speak(text, lang) {
        if (!voiceReady || !speechSynthesisObj) return;
        try {
            speechSynthesisObj.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            speechSynthesisObj.speak(utterance);
        } catch(e) {}
    }

    let voiceActivated = false;

    function activateVoice() {
        if (!voiceActivated) {
            initVoice();
            voiceActivated = true;
            const indicator = document.getElementById('voiceIndicator');
            if (indicator) {
                indicator.textContent = "🎙️ AI activated";
                indicator.style.background = "#4caf50";
                setTimeout(() => {
                    indicator.style.opacity = "0.5";
                }, 2000);
            }
        }
    }

    // ============================================
    // =========== 2. USER INFO ==================
    // ============================================
    function getUserName() { return localStorage.getItem("eteo_userName") || ""; }
    function getUserCountry() { return localStorage.getItem("eteo_userCountry") || "FR"; }

    function saveUserInfo() {
        const name = document.getElementById("userName").value.trim();
        const select = document.getElementById("userCountry");
        const otherInput = document.getElementById("otherCountry");
        let country = select.value;
        
        if (otherInput.value.trim() !== "") {
            country = otherInput.value.trim();
        }
        
        localStorage.setItem("eteo_userName", name === "" ? "Anonymous" : name);
        localStorage.setItem("eteo_userCountry", country);
    }

    function showWelcomeScreen() {
        const app = document.getElementById("app");

        app.innerHTML = `
            <div class="welcome-screen">
                <div class="header"><h1>🖥️ CAD/CAM & 3D Printing - Beginner Level 2</h1><p>Welcome Doctor!</p></div>
                <div class="input-group">
                    <label>👤 Your name (optional):</label>
                    <input type="text" id="userName" placeholder="Ex: Dr. Smith" value="${getUserName()}">
                </div>
                <div class="input-group">
                    <label>🌍 Your country (required):</label>
                    <select id="userCountry">
                        <option value="FR">🇫🇷 France</option>
                        <option value="MA">🇲🇦 Morocco</option>
                        <option value="CH">🇨🇭 Switzerland</option>
                        <option value="CA">🇨🇦 Canada</option>
                        <option value="BE">🇧🇪 Belgium</option>
                        <option value="SN">🇸🇳 Senegal</option>
                        <option value="CI">🇨🇮 Ivory Coast</option>
                        <option value="CM">🇨🇲 Cameroon</option>
                        <option value="DZ">🇩🇿 Algeria</option>
                        <option value="TN">🇹🇳 Tunisia</option>
                        <option value="US">🇺🇸 USA</option>
                        <option value="GB">🇬🇧 United Kingdom</option>
                        <option value="DE">🇩🇪 Germany</option>
                        <option value="ES">🇪🇸 Spain</option>
                        <option value="IT">🇮🇹 Italy</option>
                        <option value="PT">🇵🇹 Portugal</option>
                        <option value="TR">🇹🇷 Turkiye</option>
                    </select>
                    <div style="margin-top: 10px; font-size: 0.8rem; color: #888;">or</div>
                    <input type="text" id="otherCountry" placeholder="Enter your country (e.g., Brazil, Japan...)" style="margin-top:5px;">
                </div>
                <button class="start-quiz-btn" onclick="startQuiz()">🚀 Start Quiz</button>
                <div class="note">
                    ⚠️ Rule: 60% minimum (225/375 points) to unlock <strong>Intermediate Level 1</strong>.<br>
                    🎁 Speed bonus: +5 points if you answer before the timer ends.<br>
                    📊 Maximum possible score with bonus: 375 points (25 questions × 15 points)
                </div>
            </div>
        `;
        
        const savedCountry = getUserCountry();
        const countrySelect = document.getElementById("userCountry");
        if (countrySelect) countrySelect.value = savedCountry;
    }

    // ============================================
    // =========== 3. FIREBASE SCORE =============
    // ============================================
    async function sendScoreToFirebase(score, maxScore, percentage) {
        const userName = localStorage.getItem("eteo_userName") || "Anonymous";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        
        const scoreData = {
            nom: userName,
            pays: userCountry,
            score: score,
            maxScore: maxScore,
            percentage: percentage,
            levelId: LEVEL_ID,
            date: new Date().toISOString(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection('scores').add(scoreData);
            console.log("✅ Score sent to Firebase!");
            return true;
        } catch (error) {
            console.error("❌ Firebase error:", error);
            return false;
        }
    }

    // ============================================
    // =========== 4. QUESTIONS (25) =============
    // ============================================
    const questions = [
        { question: "What is the principle of CAD/CAM milling for ceramic blocks?", options: ["Milling a pre-sintered or hard block", "3D printing", "Pressure molding", "High-temperature pressing"], correct: 0, explanation: "Zirconia is usually milled in a semi-sintered (white) state before final firing." },
        { question: "Why is zirconia milled in the 'white' (pre-sintered) state?", options: ["To compensate for firing shrinkage (20-25%)", "To avoid future discoloration", "To harden the material before milling", "To facilitate adhesive bonding"], correct: 0, explanation: "The software compensates for volumetric shrinkage during sintering." },
        { question: "What is a monolithic zirconia crown?", options: ["A crown tinted in the mass without veneer", "A sintered opaque zirconia crown", "An invisible metal-based crown", "A multi-layer crown without firing"], correct: 0, explanation: "Monolithic zirconia eliminates the risk of veneer chipping." },
        { question: "What is the particularity of milled lithium disilicate?", options: ["Milling in glassy state then crystallization", "Milling after full sintering", "3D printing from powder", "Firing at 1500°C for 24h"], correct: 0, explanation: "Thermal crystallization confers the material's final properties." },
        { question: "Milled composites are distinguished by:", options: ["Intraoral clinical repairability", "Hardness superior to zirconia", "Need for 1200°C firing", "Inability to be polished"], correct: 0, explanation: "Unlike ceramics, composite blocks are reparable in the mouth." },
        { question: "What is the primary use of PMMA in CAD/CAM?", options: ["Production of provisional prostheses", "Fabrication of permanent crowns", "Inlays on damaged teeth", "Screwed metal frameworks"], correct: 0, explanation: "PMMA is ideal for long-term temporary restorations." },
        { question: "What is a hybrid material (e.g., Vita Enamic)?", options: ["Polymer matrix impregnated with ceramic", "High-density pure ceramic", "Composite loaded with metal particles", "Gradient shade zirconia"], correct: 0, explanation: "These blocks combine polymer elasticity with ceramic strength." },
        { question: "What is the average resistance of lithium disilicate (after crystallization)?", options: ["300-400 MPa", "100-200 MPa", "800-1000 MPa", "1500 MPa"], correct: 0, explanation: "It offers an excellent balance between aesthetics and resistance." },
        { question: "Why perform a final polish after milling?", options: ["Reduce wear of antagonist tooth", "Speed up ceramic firing", "Modify anatomical shape", "Increase surface porosity"], correct: 0, explanation: "A smooth surface is paramount for the longevity of the antagonist." },
        { question: "Shade (staining) of CAD/CAM blocks can be achieved by:", options: ["Applying stains pre-firing", "Using surface resins", "Acid bath after firing", "Intense abrasive sandblasting"], correct: 0, explanation: "Pre-shaded blocks or stain infiltration are used." },
        { question: "What is the function of zirconia sintering?", options: ["Thermal densification (1500°C)", "External surface polishing", "Elimination of milling errors", "Shade coloring"], correct: 0, explanation: "Sintering transforms the porous block into a dense ceramic structure." },
        { question: "How does CAD/CAM software handle zirconia shrinkage?", options: ["Expansion coefficient applied to CAD", "Manual adjustment by practitioner", "Reduction of sintering temperature", "Use of fixed oversized blocks"], correct: 0, explanation: "The software applies a scaling factor to the digital design." },
        { question: "A 4-axis milling machine allows:", options: ["Effective milling for most cases", "Only flat shapes", "Complex movement in 6 directions", "Liquid 3D printing"], correct: 0, explanation: "It is sufficient for standard crowns and bridges." },
        { question: "What are the advantages of a 5-axis machine?", options: ["Execution of very complex geometries", "Doubled milling speed", "Major energy savings", "Pure metal printing"], correct: 0, explanation: "5 axes allow access to undercuts." },
        { question: "Why use 'wet' milling?", options: ["Cool the bur and the part", "Reduce rotation speed", "Eliminate need for polishing", "Increase block hardness"], correct: 0, explanation: "Coolant prevents micro-cracks due to overheating." },
        { question: "Chairside CAD/CAM is defined by:", options: ["Prosthesis made in a single session", "Milling in a distant laboratory", "Scan sent by postal mail", "Milling delayed by 48 hours"], correct: 0, explanation: "It allows completing the treatment without a temporary prosthesis." },
        { question: "Major advantage of chairside CAD/CAM?", options: ["Clinical time saved for the patient", "Reduced material cost", "Aesthetics superior to laboratories", "Maximum strength on bridges"], correct: 0, explanation: "Single-appointment management is the key benefit." },
        { question: "Disadvantage of chairside CAD/CAM?", options: ["High investment cost", "Too high material hardness", "Requires two physical impressions", "Complexity of scanning"], correct: 0, explanation: "Equipment and training represent a heavy investment." },
        { question: "The role of external laboratory CAD/CAM is:", options: ["Enabling complex prostheses", "Doing treatment in one hour", "Eliminating the CAD stage", "Replacing optical impression"], correct: 0, explanation: "It allows for extensive bridges and a diversity of materials." },
        { question: "What is a complete digital workflow?", options: ["Scan, CAD, and CAM without physical impressions", "Mixed digital/physical procedure", "Manual milling assisted by scan", "Optical impression processed by hand"], correct: 0, explanation: "The 100% digital workflow optimizes precision and time." },
        { question: "Bonding of CAD/CAM restorations uses:", options: ["Adhesive resin cements", "Zinc oxide cement", "Wax-based cement", "Laser welding"], correct: 0, explanation: "Resin bonding ensures longevity of vitreous ceramics." },
        { question: "Surface treatment for bonding vitreous ceramic:", options: ["HF etching and silanization", "Aluminum oxide sandblasting", "Application of pure MDP", "Diamond polishing"], correct: 0, explanation: "Hydrofluoric acid creates micro-retentions for the silane." },
        { question: "Surface treatment for bonding zirconia:", options: ["Sandblasting and MDP primer", "Intense HF etching", "Pure silane", "No treatment required"], correct: 0, explanation: "Zirconia is not acid-etchable; sandblasting and MDP are required." },
        { question: "Hydrothermal degradation of zirconia (aging):", options: ["Crystalline transformation in humid environment", "Major metal oxidation", "Accelerated mechanical wear", "Total shade loss"], correct: 0, explanation: "It is a crystalline phase transformation under humidity." },
        { question: "Essential maintenance for CAD/CAM machines:", options: ["Calibration and changing burs", "Manual shade adjustment", "Changing scanner glass", "Refilling impression block"], correct: 0, explanation: "Worn burs degrade fitting precision." }
    ];

    // ============================================
    // =========== SCORE MAX CORRIGÉ =============
    // ============================================
    const MAX_SCORE_BASE = questions.length * 10; // 250 points (sans bonus)
    const MAX_SCORE_WITH_BONUS = questions.length * 15; // 375 points (avec bonus)
    
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let answerLocked = false;
    let currentCorrectIndex = 0;
    let shuffledOptions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function saveScore(finalScore, maxScore) {
        const percentage = (finalScore / maxScore) * 100;
        localStorage.setItem("cfao_impression3d_v1_debutant2_en", JSON.stringify({ 
            score: finalScore, 
            maxScore: maxScore,
            percentage: percentage,
            date: new Date().toISOString() 
        }));
        return percentage;
    }

    // ============================================
    // =========== UNLOCK INTERMEDIATE LEVEL 1 ====
    // ============================================
    function unlockLevel3(percentage) {
        const SEUIL_DEBLOCAGE = 60;
        
        if (percentage >= SEUIL_DEBLOCAGE) {
            localStorage.setItem("cfao_impression3d_v1_intermediaire1_en_unlocked", "true");
            localStorage.setItem("cfao_impression3d_v1_debutant2_en_score", percentage.toFixed(1));
            console.log("✅ Intermediate Level 1 UNLOCKED! Score: " + percentage.toFixed(1) + "%");
            return true;
        } else {
            localStorage.setItem("cfao_impression3d_v1_intermediaire1_en_unlocked", "false");
            console.log("❌ Intermediate Level 1 LOCKED. Score: " + percentage.toFixed(1) + "% (min " + SEUIL_DEBLOCAGE + "%)");
            return false;
        }
    }

    // ================================================================
    // 🔥 SAUVEGARDER LA VALIDATION POUR PROGRESSION.HTML (CORRIGÉ)
    // ================================================================
    function sauvegarderValidation(specialite, niveau, score, total) {
        const percentage = (score / total) * 100;
        
        if (percentage >= 60) {
            // 1. Sauvegarder dans eteo_validation
            localStorage.setItem('eteo_validation', JSON.stringify({
                specialite: specialite,
                niveau: niveau,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: Date.now()
            }));
            
            // 2. 🔥 AJOUT : Sauvegarder dans eteo_progression
            const progressionData = JSON.parse(localStorage.getItem('eteo_progression') || '{}');
            const key = specialite + '_' + niveau;
            progressionData[key] = true;
            localStorage.setItem('eteo_progression', JSON.stringify(progressionData));
            
            console.log('✅ Validation sauvegardée pour progression.html');
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 30;
        timerInterval = setInterval(() => {
            if (answerLocked) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                if (!answerLocked) {
                    speak("Time's up! Moving to next question.", "en-US");
                    currentQuestion++;
                    timeLeft = 30;
                    answerLocked = false;
                    if (currentQuestion < questions.length) renderQuestion();
                    else endQuiz();
                }
            } else {
                timeLeft--;
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
            }
        }, 1000);
    }

    function speakCurrentQuestion() {
        speak(`Question ${currentQuestion + 1}: ${questions[currentQuestion].question}`, "en-US");
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const app = document.getElementById('app');

        shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);
        currentCorrectIndex = shuffledOptions.indexOf(q.options[q.correct]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        const progress = (currentQuestion / questions.length) * 100;

        app.innerHTML = `
            <div class="header"><h1>🖥️ CAD/CAM & 3D Printing - Beginner Level 2</h1><p>Question ${currentQuestion + 1}/${questions.length}</p></div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="question-container">
                <div class="question-text">${q.question}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="explanation-box" id="explanationBox">
                    <div class="explanation-title">📖 Explanation:</div>
                    <div id="explanationText"></div>
                    <div class="correct-answer" id="correctAnswerText"></div>
                </div>
                <div class="timer">⏱️ Time left: <span id="timer">${timeLeft}</span> seconds</div>
                <div class="score">🏆 Current score: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="abandonQuiz()">❌ Abandon</button>
                    <button class="nav-btn" onclick="nextQuestion()">Next →</button>
                </div>
            </div>
        `;
        answerLocked = false;
        startTimer();
        setTimeout(() => speakCurrentQuestion(), 500);
    }

    function checkAnswer(selectedIndex) {
        if (answerLocked) return;

        const q = questions[currentQuestion];
        const isCorrect = (selectedIndex === currentCorrectIndex);
        let pointsEarned = 10;
        if (timeLeft > 0) pointsEarned = 15;

        if (isCorrect) {
            score += pointsEarned;
            speak(`Correct! +${pointsEarned} points.`, "en-US");
        } else {
            speak(`Wrong answer. The correct answer was: ${shuffledOptions[currentCorrectIndex]}.`, "en-US");
        }

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === currentCorrectIndex) btn.classList.add('correct');
            if (idx === selectedIndex && idx !== currentCorrectIndex) btn.classList.add('wrong');
        });

        document.getElementById('explanationText').innerHTML = q.explanation;
        document.getElementById('correctAnswerText').innerHTML = `✅ Correct answer: ${shuffledOptions[currentCorrectIndex]}`;
        document.getElementById('explanationBox').classList.add('show');
        document.querySelector('.score').innerHTML = `🏆 Current score: ${score}/${MAX_SCORE_WITH_BONUS}`;

        if (timerInterval) clearInterval(timerInterval);
        answerLocked = true;
    }

    function nextQuestion() {
        if (!answerLocked) { 
            speak("Please select an answer.", "en-US"); 
            return; 
        }
        currentQuestion++;
        timeLeft = 20;
        answerLocked = false;
        if (currentQuestion < questions.length) renderQuestion();
        else endQuiz();
    }

    // ============================================
    // =========== NAVIGATION =====================
    // ============================================
    
    function goToMenu() {
        // 🔥 AVEC TIMESTAMP POUR EVITER LE CACHE
        window.location.href = "menu_en.html?t=" + Date.now();
    }

    function goToDashboard() {
        window.location.href = "../../../../classements_dashboard.html";
    }

    function goToRanking() {

    }

    // ============================================
    // =========== endQuiz CORRIGÉ (BETA) ========
    // ============================================
    function endQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        
        saveScore(score, MAX_SCORE_WITH_BONUS);
        
        // === VERSION BETA : Le niveau suivant est verrouillé ===
        // Le déblocage du niveau Intermédiaire 1 est désactivé en BETA.
        // Les utilisateurs pourront débloquer les niveaux supérieurs dans la version finale (6 mois).
        // const isUnlocked = unlockLevel3(percentage); // DÉSACTIVÉ EN BETA
        const isUnlocked = false; // Toujours false en BETA pour les niveaux > Débutant 2
        // =================================
        
        // 🔥 Sauvegarder la validation pour progression.html - NOM CORRIGÉ
        sauvegarderValidation('CAD/CAM & 3D Printing', 'debutant2', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, percentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <h1>🎉 Quiz completed!</h1>
                <div class="final-score">Score: ${score}/${MAX_SCORE_WITH_BONUS}</div>
                <div style="font-size: 1.2rem; margin: 10px 0;">
                    Percentage: <strong>${percentage.toFixed(1)}%</strong>
                </div>
                <div style="margin:20px 0;">
                    ${percentage >= 60 ?
                        `<div class="unlock-badge">✅ Beginner Level 2 validated! 🎊</div>
                         <div class="locked-badge">🔒 BETA: The next levels (Intermediate & Expert) will arrive after 6 months of evaluation.</div>` :
                        `<div class="locked-badge">⚠️ Insufficient score (minimum 60% required to validate the level)</div>`}
                </div>
                <div style="margin:10px 0; font-size:0.9rem; color:#888;">
                    ${percentage >= 60 ?
                        '📚 You have validated both Beginner levels. Thank you for your participation!' :
                        `💪 You need ${(60 - percentage).toFixed(1)}% more to validate the level. Try again!`}
                </div>
                <div>
                    <button class="share-btn" onclick="shareScore()">📤 Share my score</button>
                    <button class="feedback-btn" onclick="giveFeedback()">📝 Give feedback</button>
                    <button class="menu-btn" onclick="goToMenu()">🏠 Main menu</button>
                    <button class="ranking-btn" onclick="goToDashboard()">🏆 World ranking</button>
                </div>
            </div>
        `;
        
        if (percentage >= 60) {
            speak(`Congratulations! You validated Beginner Level 2 with a score of ${percentage.toFixed(1)}%. The rest will be available in the final version.`, "en-US");
            
            // Popup BETA après 2 secondes
            setTimeout(function() {
                openBetaEvaluationPopup();
            }, 2000);
        } else {
            speak(`Your score is ${percentage.toFixed(1)}%. You need 60% to validate the level.`, "en-US");
        }
        
        setTimeout(() => {
            openRankingModal();
        }, 2500);
    }

    // ============================================
    // =========== POPUP RANKING MODAL ============
    // ============================================
    function openRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'flex';
            loadRankingInModal();
        }
    }

    function closeRankingModal() {
        const modal = document.getElementById('rankingModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    // ============================================
    // =========== loadRankingInModal ============
    // ============================================
    async function loadRankingInModal() {
        const container = document.getElementById('modalRankingContent');
        if (!container) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Anonymous";
        
        try {
            const snapshot = await db.collection('scores')
                .where('levelId', '==', LEVEL_ID)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">📭 No scores recorded for this level yet.</div>';
                return;
            }
            
            const scores = [];
            snapshot.forEach(doc => {
                scores.push(doc.data());
            });
            
            scores.sort((a, b) => (b.percentage || 0) - (a.percentage || 0));
            
            const topScores = scores.slice(0, 20);
            
            let userRank = -1;
            let userScore = null;
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].nom === userName) {
                    userRank = i + 1;
                    userScore = scores[i];
                    break;
                }
            }
            
            let html = '';
            
            html += `
                <div class="user-rank-card">
                    ${userRank > 0 ? `
                        <div>🏅</div>
                        <div class="rank-label">Your ranking</div>
                        <div class="rank-number">${userRank}e position</div>
                        <div>${userScore ? `${userScore.score}/${userScore.maxScore} points (${(userScore.percentage || 0).toFixed(1)}%)` : ''}</div>
                    ` : `
                        <div style="font-size: 1.2rem;">📊 You are not yet in the ranking for this level</div>
                        <div>Take the quiz to appear!</div>
                    `}
                </div>
            `;
            
            html += `<h3 style="margin: 15px 0 10px 0; color: #667eea;">🏆 TOP 20 - CAD/CAM & 3D Printing Beginner 2</h3>`;
            
            for (let i = 0; i < topScores.length; i++) {
                const s = topScores[i];
                const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}`;
                const isUser = s.nom === userName;
                html += `
                    <div class="ranking-item" style="${isUser ? 'background: rgba(102,126,234,0.2); border-radius: 5px;' : ''}">
                        <div><strong>${medal}</strong></div>
                        <div>${s.nom || "Anonymous"} ${isUser ? '👈' : ''}</div>
                        <div><strong>${(s.percentage || 0).toFixed(1)}%</strong></div>
                        <div>${s.score}/${s.maxScore}</div>
                    </div>
                `;
            }
            
            if (topScores.length === 0) {
                html += '<div style="text-align:center; padding:20px;">📭 No scores for this level</div>';
            }
            
            container.innerHTML = html;
            
        } catch (err) {
            console.error("Firestore error:", err);
            container.innerHTML = `<div style="padding: 20px; text-align: center;">❌ Unable to load ranking.<br><span style="font-size:0.7rem; color:#888;">${err.message || 'Unknown error'}</span></div>`;
        }
    }

    // ============================================
    // =========== BETA EVALUATION POPUP ==========
    // ============================================
    function openBetaEvaluationPopup() {
        if (document.getElementById('betaPopup')) return;
        
        const userName = localStorage.getItem("eteo_userName") || "Doctor";
        
        const modal = document.createElement('div');
        modal.id = 'betaPopup';
        modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10002;
            animation: fadeIn 0.3s ease;
        `;
        
        modal.innerHTML = `
            <div style="background: white; border-radius: 30px; width: 90%; max-width: 500px; padding: 35px 25px; text-align: center; animation: slideUp 0.3s ease; position: relative;">
                <div style="font-size: 4rem; margin-bottom: 10px;">🎉🏆🎉</div>
                <h2 style="color: #667eea; margin-bottom: 5px;">Congratulations ${userName}!</h2>
                <p style="margin-bottom: 20px; font-size: 1rem;">
                    You have successfully completed <strong>both Beginner levels</strong>.<br>
                    What an impressive journey!
                </p>
                
                <div style="margin: 25px 0;">
                    <p style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">🌟 Rate the BETA version 🌟</p>
                    <div id="starRating" style="display: flex; justify-content: center; gap: 12px; font-size: 3rem; cursor: pointer;">
                        <span data-rating="1" style="color: #ccc;">☆</span>
                        <span data-rating="2" style="color: #ccc;">☆</span>
                        <span data-rating="3" style="color: #ccc;">☆</span>
                        <span data-rating="4" style="color: #ccc;">☆</span>
                        <span data-rating="5" style="color: #ccc;">☆</span>
                    </div>
                    <p id="ratingMessage" style="margin-top: 10px; font-size: 0.85rem; color: #888;"></p>
                </div>
                
                <div style="background: #f0f8ff; padding: 15px; border-radius: 20px; margin: 15px 0; border-left: 4px solid #667eea;">
                    <p style="color: #ff5722; font-size: 0.95rem; margin: 0;">
                        🚀 <strong>Intermediate & Expert</strong> will arrive after <strong>6 months of evaluation</strong> of this Beta version.<br><br>
                        Your feedback helps us improve ETEO. Thank you for your trust, <strong>${userName}</strong>!
                    </p>
                </div>
                
                <button onclick="closeBetaPopup()" style="background: #4caf50; color: white; border: none; padding: 12px 30px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 15px;">
                    Back to menu
                </button>
            </div>
        `;
        
        document.body.appendChild(modal);
        
        const stars = modal.querySelectorAll('#starRating span');
        stars.forEach(function(star) {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                sendBetaEvaluation(rating);
                
                stars.forEach(function(s, idx) {
                    if (idx < rating) {
                        s.innerHTML = '★';
                        s.style.color = '#ffc107';
                    } else {
                        s.innerHTML = '☆';
                        s.style.color = '#ccc';
                    }
                });
                
                const messageDiv = document.getElementById('ratingMessage');
                messageDiv.innerHTML = '✅ Thank you for your rating! Your feedback has been recorded.';
                messageDiv.style.color = '#4caf50';
                messageDiv.style.fontWeight = 'bold';
            });
        });
    }

    function closeBetaPopup() {
        var modal = document.getElementById('betaPopup');
        if (modal) modal.remove();
        goToMenu();
    }

    async function sendBetaEvaluation(rating) {
        const userName = localStorage.getItem("eteo_userName") || "Anonymous";
        const userCountry = localStorage.getItem("eteo_userCountry") || "FR";
        
        try {
            await db.collection('evaluations_beta').add({
                nom: userName,
                pays: userCountry,
                note: rating,
                langue: 'en',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("✅ Beta evaluation sent!");
        } catch (error) {
            console.error("❌ Beta evaluation error:", error);
        }
    }

    // ============================================
    // =========== OTHER FUNCTIONS ================
    // ============================================
    function abandonQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        const partialPercentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        localStorage.setItem("cfao_impression3d_v1_debutant2_en", JSON.stringify({ 
            score, 
            maxScore: MAX_SCORE_WITH_BONUS, 
            percentage: partialPercentage, 
            date: new Date().toISOString(), 
            abandoned: true 
        }));
        
        // BETA : le niveau suivant est verrouillé
        // unlockLevel3(partialPercentage); // Désactivé en BETA

        // 🔥 Sauvegarder la validation même en cas d'abandon - NOM CORRIGÉ
        sauvegarderValidation('CAD/CAM & 3D Printing', 'debutant2', score, MAX_SCORE_WITH_BONUS);
        
        sendScoreToFirebase(score, MAX_SCORE_WITH_BONUS, partialPercentage);
        
        const app = document.getElementById('app');
        app.innerHTML = `<div class="result-container"><h1>❌ Quiz abandoned</h1><div class="final-score">Partial score: ${score}/${MAX_SCORE_WITH_BONUS}</div><div>Percentage: ${partialPercentage.toFixed(1)}%</div><div style="margin:20px 0;">🏆 This score has been recorded in the ranking.</div><button class="menu-btn" onclick="goToMenu()">🏠 Back to menu</button></div>`;
        speak(`Quiz abandoned. Partial score: ${score} out of ${MAX_SCORE_WITH_BONUS}.`, "en-US");
    }

    function shareScore() {
        const percentage = (score / MAX_SCORE_WITH_BONUS) * 100;
        const text = `🎓 ETEO - CAD/CAM & 3D Printing Beginner 2\nMy score: ${score}/${MAX_SCORE_WITH_BONUS} (${percentage.toFixed(1)}%)\nChallenge me on ETEO!`;
        if (navigator.share) {
            navigator.share({ title: 'ETEO Score', text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Score copied to clipboard!");
            }).catch(() => {
                alert("📋 To share, copy this text:\n\n" + text);
            });
        }
    }

    function giveFeedback() { 
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSca6J-wmsp7Ci9-Y_LEyhyvj4BrazhHZpLhmB3YcDgckzya6Q/viewform', '_blank'); 
    }

    function startQuiz() {
        saveUserInfo();
        activateVoice();
        currentQuestion = 0;
        score = 0;
        answerLocked = false;
        renderQuestion();
    }

    document.body.addEventListener('click', function firstClick() { 
        activateVoice(); 
        document.body.removeEventListener('click', firstClick); 
    });
    
    showWelcomeScreen();
</script>
